<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鼎兆元打卡</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32-mzt.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<!--
  LINE 單一打卡入口（v3 畫面，2026-10-08 Eason 指定：仿傳統打卡 App——日期、大時鐘、地圖、店家、班別、上班／下班兩顆鍵）
  官方帳號「鼎兆元打卡」選單「打卡」打開這頁（LIFF 2011292256-QFXEwFh4，Tall）。
    開頁：定位 → 這頁自己挑店（clock-line-core.js，規則與各店後端相同）→ 直接問那家店 liff_status（姓名、班別、今天的卡、防呆狀態）
    按上班／下班：直接打那家店 liff_punch {type}（防呆在店家後端再擋一次）→ 結果顯示在畫面 → 代同仁送出「打卡」讓機器人回覆 → 關閉
    （方案 C，2026-10-08：不再經光復轉一手。店家表由 tools/build-line-page.py 從 tools/stores.json 產生。）
  第一次使用：那家店回「沒綁定」→ 改問光復 line_hub_status／line_bind_name（輸入全名綁定、跨店同名確認，人要在那家店的範圍內）。
  ⚠ 獨立檔，不是由 clock.html 產生；各門市的 clock*.html 與這頁互不影響。
-->
<style>
  :root { --ink: #1f2a27; --muted: #6b7a75; --line: #dfe6e3; --ok: #1e7d4f; --warn: #a15a00; --err: #c22a12;
          --in: #2a6b5e; --out: #c0561f; --dis: #c9cfcd; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f4f6f5; color: var(--ink);
               font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 14px 16px 28px; }
  .card { background: #fff; border-radius: 16px; padding: 16px; }
  .date { text-align: center; font-size: 18px; font-weight: 600; }
  .clock { text-align: center; font-size: 64px; font-weight: 700; letter-spacing: 2px; line-height: 1.1; margin: 4px 0 10px;
           font-variant-numeric: tabular-nums; }
  #map { height: 210px; border-radius: 10px; background: #e8ecea; }
  .store { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 16px;
           display: flex; justify-content: space-between; align-items: center; }
  .store .who { color: var(--muted); font-size: 13px; }
  .shift { text-align: center; color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.7; }
  .today { text-align: center; font-size: 13px; margin-top: 2px; }
  .btns { display: flex; gap: 12px; margin-top: 16px; }
  .btns button { flex: 1; padding: 16px 0; font-size: 19px; font-weight: 700; border: 0; border-radius: 12px; color: #fff; }
  #btnIn { background: var(--in); } #btnOut { background: var(--out); }
  #btnIn:disabled, #btnOut:disabled { background: var(--dis); color: #fff; }   /* 要用 id 選擇器才蓋得過上一行的底色 */
  .msg { margin-top: 14px; text-align: center; font-size: 15px; line-height: 1.6; white-space: pre-line; min-height: 1.6em; }
  .msg.ok { color: var(--ok); } .msg.warn { color: var(--warn); }
  .hint { color: var(--muted); font-size: 13px; text-align: center; white-space: pre-line; margin-top: 4px; }
  input { width: 100%; padding: 12px; font-size: 17px; border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; }
  .primary { width: 100%; margin-top: 12px; padding: 14px; font-size: 17px; font-weight: 700; border: 0; border-radius: 12px;
             background: var(--in); color: #fff; }
  .ghost { width: 100%; margin-top: 10px; padding: 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 12px;
           background: #fff; color: var(--in); }
  .primary:disabled { opacity: .5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="date" id="date">—</div>
    <div class="clock" id="clock">--:--</div>
    <div id="map"></div>
    <div class="store"><span id="storeName">定位中…</span><span class="who" id="who"></span></div>
    <div class="shift" id="shift">上班時間 -- / 下班時間 --</div>
    <div class="today" id="today"></div>

    <div id="bindBox" hidden>
      <div class="msg" id="bindTitle">第一次使用，請輸入你的全名</div>
      <div class="hint" id="bindHint">要人在你上班的店裡，名字要和店裡名冊一樣</div>
      <input id="bindName" type="text" placeholder="例如：王小明" autocomplete="name">
      <div class="hint" id="bindError" style="color:var(--err)"></div>
      <button class="primary" id="btnBind" type="button">綁定</button>
    </div>

    <div class="btns" id="btns">
      <button id="btnIn" type="button" disabled>上班</button>
      <button id="btnOut" type="button" disabled>下班</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="hint" id="hint"></div>
    <button class="ghost" id="btnRetry" type="button" hidden>重新定位</button>
    <button class="ghost" id="btnHelp" type="button" hidden>看排除步驟</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="clock-line-core.js"></script>
<script>
(function () {
  'use strict';
  var LIFF_ID = '2011292256-QFXEwFh4';
  var HUB_API = 'https://script.google.com/macros/s/AKfycbxE4DTz847y0bPvLd4mD_9vBFTe3npmVVYKU1CYgeFcUpAuL4vLIA3rySXSR-2qujdJ0A/exec';
  function qs(n) { return new URLSearchParams(location.search).get(n); }
  var isLocalHost = ['localhost', '127.0.0.1'].indexOf(location.hostname) !== -1;
  if (isLocalHost && qs('api')) HUB_API = qs('api');
  /* STORES:BEGIN（tools/build-line-page.py 產生，勿手改）*/
  var STORES = [
    {"code": "", "name": "小辛辣 新竹光復", "lat": 24.7840945, "lng": 121.0157448, "radius_m": 20, "api": "https://script.google.com/macros/s/AKfycbxE4DTz847y0bPvLd4mD_9vBFTe3npmVVYKU1CYgeFcUpAuL4vLIA3rySXSR-2qujdJ0A/exec"},
    {"code": "mztjs", "name": "墨竹亭 新竹金山", "lat": 24.776717902605498, "lng": 121.02188536933596, "radius_m": 50, "api": "https://script.google.com/macros/s/AKfycby6Nv7aCGUDsxKA3dwPIYluxk76JaWKp-wqwCCvnE6knthefzGNR8Jyw3uRWds-PwOv/exec"},
    {"code": "mztgf", "name": "墨竹亭 新竹光復", "lat": 24.801160225561624, "lng": 120.98820054417844, "radius_m": 50, "api": "https://script.google.com/macros/s/AKfycbyGH4ktFmXON443Naibe84rEKeqprkOJO0t7eU4UukTvqLWsfu541x7scHKLvntV6okFw/exec"},
    {"code": "mztlzl", "name": "墨竹亭 台北六張犁", "lat": 25.022272780810678, "lng": 121.55487005744799, "radius_m": 50, "api": "https://script.google.com/macros/s/AKfycby7AwHFGZMckF84gtFVUklcV8nFkVqdyK69Yz2-g6p83VEX4WpDutZFTxFfbGQ2-On24Q/exec"},
    {"code": "hq", "name": "鼎兆元 總部", "lat": 24.776352585623435, "lng": 121.01992421142127, "radius_m": 50, "api": "https://script.google.com/macros/s/AKfycbyiocazNgn9M249CCkPzJsRvMJ35uh_Wjp_ju1y1sB2TZ_IWH3RD6pKUsHXsUJR-4N9TQ/exec"},
    {"code": "cf", "name": "鼎兆元 中央廚房", "lat": 24.12274490856511, "lng": 120.7102176960625, "radius_m": 50, "api": "https://script.google.com/macros/s/AKfycby-IzOBTrUK-usZxEUVRAcvPqagfAbHpvLevIWnk6drBpIuHwh1IlEun4bdsS9o-CIB/exec"}
  ];
  /* STORES:END */
  /** 那家店的後端網址；本機測試（?api=）時對到 mock 的 /api/<店代碼>。 */
  function storeApi(st) {
    if (isLocalHost && qs('api')) return String(qs('api')).replace(/\/$/, '') + (st.code ? '/' + st.code : '');
    return st.api;
  }
  var $ = function (id) { return document.getElementById(id); };
  var WK = ['日', '一', '二', '三', '四', '五', '六'];

  /* ── 日期與大時鐘（台北時間）── */
  function tick() {
    var d = new Date(Date.now() + (8 * 60 + new Date().getTimezoneOffset()) * 60000);
    $('date').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 星期' + WK[d.getDay()];
    $('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    refreshButtons();
  }

  /* ── 地圖（OpenStreetMap，不需要金鑰）── */
  var map = null, meMarker = null, storeCircle = null;
  function initMap() {
    if (!window.L) return;
    map = L.map('map', { zoomControl: false, attributionControl: true }).setView([24.7863, 121.0157], 15);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
  }
  function showMe(lat, lng) {
    if (!map) return;
    if (!meMarker) meMarker = L.circleMarker([lat, lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#d93025', fillOpacity: 1 }).addTo(map);
    else meMarker.setLatLng([lat, lng]);
    if (!storeCircle) map.setView([lat, lng], 17);
  }
  function showStore(st) {
    if (!map || !st || typeof st.lat !== 'number') return;
    if (storeCircle) map.removeLayer(storeCircle);
    storeCircle = L.circle([st.lat, st.lng], { radius: st.radius_m, color: '#2a6b5e', weight: 2, fillOpacity: 0.12 }).addTo(map);
    if (meMarker) map.fitBounds(L.featureGroup([meMarker, storeCircle]).getBounds(), { padding: [24, 24], maxZoom: 18 });
  }

  /* ── 後端 ── */
  var POST_TIMEOUT_MS = 25000;
  if (isLocalHost && qs('post_timeout')) POST_TIMEOUT_MS = +qs('post_timeout');   // 本機測試逾時路徑用
  function post(url, body, timeoutMs) {   // 預設 25 秒沒回應就放棄等待；打卡不自動重送（重送會變重複）
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeoutMs || POST_TIMEOUT_MS) : null;
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body),
                            signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { return r.text(); })
      .then(function (t) { if (timer) clearTimeout(timer); return JSON.parse(t); },
            function (e) { if (timer) clearTimeout(timer); throw e; });
  }

  /* 讀取（liff_status／line_hub_status，唯讀、可安全重送）：Apps Script 偶發很慢或回非 JSON（2026-10-09 央廚同仁開頁就「連線失敗」），
     每次 12 秒、最多 3 次（間隔 2／4 秒）。後端明確回的錯誤（沒綁定、太頻繁…）是最終答案，不重試。同 clock.html 的 whoami 重試。 */
  var READ_TIMEOUT_MS = 12000, READ_RETRY_MS = [2000, 4000];
  if (isLocalHost && qs('read_timeout')) READ_TIMEOUT_MS = +qs('read_timeout');
  if (isLocalHost && qs('retry_ms')) READ_RETRY_MS = [+qs('retry_ms'), +qs('retry_ms')];
  function readRetry(url, body, attempt) {
    attempt = attempt || 1;
    var again = function () {
      if (attempt > READ_RETRY_MS.length) return Promise.reject(new Error('read_failed'));
      $('hint').textContent = '連線較慢，重試中（第 ' + attempt + ' 次）…';
      return new Promise(function (res) { setTimeout(res, READ_RETRY_MS[attempt - 1]); })
        .then(function () { return readRetry(url, body, attempt + 1); });
    };
    return post(url, body, READ_TIMEOUT_MS).then(function (r) {
      if (!r || (r.ok === false && (!r.error || r.error === 'server_error'))) return again();
      return r;
    }, again);
  }

  /* ── LINE 身分 ── */
  function initLiff() {
    if (isLocalHost && qs('mock_uid')) {
      var uid = qs('mock_uid');
      window.liff = { init: function () { return Promise.resolve(); }, isLoggedIn: function () { return true; },
        getIDToken: function () { return 'MOCK_ID_TOKEN_' + uid; }, login: function () {}, isInClient: function () { return !!qs('in_client'); },
        sendMessages: function (m) { window.__sent = (window.__sent || []).concat(m); return Promise.resolve(); },
        closeWindow: function () { window.__closed = true; } };
      return Promise.resolve(true);
    }
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
      s.onload = function () { resolve(true); };
      s.onerror = function () { resolve(false); };
      document.head.appendChild(s);
    }).then(function (ok) {
      if (!ok) return false;
      return liff.init({ liffId: LIFF_ID }).then(function () {
        if (!liff.isLoggedIn()) { liff.login(); return false; }
        return true;
      }, function () { return false; });
    });
  }

  /* ── 定位：開頁就持續追蹤，送出時用手上最好的那筆（合格＝誤差 ≤40m 且 30 秒內；合格的一律勝過不合格的）── */
  var GOOD_ACC = 40, STALE_MS = 30000, lastFix = null, watchId = null;
  function good(p) { return p && p.coords.accuracy <= GOOD_ACC && Date.now() - p.timestamp <= STALE_MS; }
  function better(p) { if (!lastFix || good(p) || (!good(lastFix) && p.coords.accuracy < lastFix.coords.accuracy)) lastFix = p; }
  function startGeo() {
    return new Promise(function (resolve, reject) {
      if (isLocalHost && qs('loc')) {
        var m = String(qs('loc')).split(','), acc = parseFloat(qs('acc'));
        lastFix = { timestamp: Date.now(), coords: { latitude: +m[0], longitude: +m[1], accuracy: isFinite(acc) ? acc : 10 } };
        resolve(lastFix); return;
      }
      if (!navigator.geolocation) { reject(new Error('這支手機不支援定位')); return; }
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      lastFix = null;   // 重新定位不沿用上一輪的座標（審查 #5 N1）
      // 8 秒後有什麼就用什麼（定位不夠準交給後端判斷）；20 秒還一筆都沒有才算失敗（審查 M2）
      var settled = false, expired = false;
      function done(fn, v) { if (settled) return; settled = true; clearTimeout(soft); clearTimeout(hard); fn(v); }
      var soft = setTimeout(function () { expired = true; if (lastFix) done(resolve, lastFix); }, 8000);
      var hard = setTimeout(function () { if (!lastFix) done(reject, new Error('定位逾時')); }, 20000);
      watchId = navigator.geolocation.watchPosition(function (p) {
        better(p);
        showMe(lastFix.coords.latitude, lastFix.coords.longitude);
        if (good(p) || expired) done(resolve, lastFix);
      }, function (err) {
        // 只有「權限被拒」立刻放棄；暫時抓不到（code 2/3）繼續等，交給 20 秒上限（審查 M3）
        if (err && err.code === 1) done(reject, new Error('定位權限被拒絕'));
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    });
  }
  function fixForPick() {
    return { lat: lastFix.coords.latitude, lng: lastFix.coords.longitude,
             accuracy_m: isFinite(lastFix.coords.accuracy) ? lastFix.coords.accuracy : undefined };
  }
  function fixPayload() {
    if (isLocalHost && qs('loc')) lastFix.timestamp = Date.now();
    return { lat: lastFix.coords.latitude, lng: lastFix.coords.longitude,
             accuracy: isFinite(lastFix.coords.accuracy) ? lastFix.coords.accuracy : null };
  }

  /* ── 畫面狀態 ── */
  var status = null, busy = false, suggested = '', clockSkew = 0;   // clockSkew＝伺服器時間 − 手機時間（倒數用伺服器時鐘）
  function say(text, cls, hint) { $('msg').textContent = text || ''; $('msg').className = 'msg' + (cls ? ' ' + cls : ''); $('hint').textContent = hint || ''; offerHelp(null); }
  /* 打卡求助（2026-10-09）：失敗時多一顆「看排除步驟」→ 代同仁送出「打卡求助：<類別>」，機器人回步驟卡片。
     ⚠ 類別名稱與 LineHub.gs 的 LINE_HUB_HELP 一致，改一邊要改另一邊。say() 會先收起按鈕，所以 offerHelp 要在 say 之後呼叫。 */
  var helpKey = null;
  function offerHelp(key) { helpKey = key; $('btnHelp').hidden = !key; }
  function sendHelp() {
    var text = '打卡求助：' + helpKey;
    if (!liff.isInClient || !liff.isInClient() || !liff.sendMessages) { $('hint').textContent = '請到「鼎兆元打卡」聊天室輸入「打卡求助」看排除步驟。'; return; }
    liff.sendMessages([{ type: 'text', text: text }])
      .then(function () { setTimeout(function () { liff.closeWindow(); }, 800); }, function () { $('hint').textContent = '送不出去，請到聊天室輸入「打卡求助」。'; });
  }
  function refreshButtons() {
    var ready = !!(status && status.status === 'ready' && !busy);
    ['in', 'out'].forEach(function (t) {
      var b = t === 'in' ? $('btnIn') : $('btnOut'), label = t === 'in' ? '上班' : '下班';
      var g = ready ? status.guard : null, left = 0;
      if (g && g.lock && g.lock[t]) left = g.lock[t] - (Date.now() + clockSkew);
      b.disabled = !ready || (g && g.blocked === t) || left > 0;
      b.textContent = left > 0 ? label + '（' + Math.ceil(left / 60000) + ' 分後）' : label;
    });
  }
  function render(s) {
    status = s;
    $('bindBox').hidden = true; $('btns').hidden = false; $('btnRetry').hidden = true;
    if (s.status === 'ready') {
      clockSkew = s.guard && s.guard.now ? s.guard.now - Date.now() : 0;
      $('storeName').textContent = s.store.name;
      $('who').textContent = s.name;
      $('shift').textContent = '上班時間 ' + (s.shift_in || '--') + ' / 下班時間 ' + (s.shift_out || '--');
      var ok = (s.today || []).filter(function (e) { return e.status === 'ok' || e.status === 'pending_device_approval'; });
      $('today').textContent = ok.length ? '今天：' + ok.map(function (e) {
        return (e.type === 'in' ? '上班 ' : '下班 ') + e.hm + (e.status === 'pending_device_approval' ? '（待核准）' : '');
      }).join('、') : '今天還沒有打卡紀錄';
      showStore(s.store);
      say('', '', '');
    } else {
      var r = s.result || {};
      $('storeName').textContent = r.store_name || (r.code === 'ambiguous' ? '分不出在哪一家店' : '不在打卡範圍');
      $('who').textContent = '';
      if (r.nearest) showStore(r.nearest);
      if (r.code === 'not_bound') { showBind(r.store_name, r.suggest_name); }
      else {
        say(r.reason, 'warn', r.hint); $('btnRetry').hidden = false;
        offerHelp({ no_fix: '定位抓不到', ambiguous: '定位不準', out_of_range: '不在範圍' }[r.code] || null);
      }
    }
    refreshButtons();
  }
  var curStore = null;   // 這次畫面挑到、要直接打的那家店
  /** 挑不到店時的畫面（字句與光復 LineHub.gs lineHubResolve_ 相同）。 */
  function pickFail(pick) {
    if (pick.status === 'no_fix') return { status: 'fail', result: { ok: false, code: 'no_fix', reason: '抓不到手機定位', hint: '請允許 LINE 使用定位後再試一次' } };
    if (pick.status === 'ambiguous') return { status: 'fail', result: { ok: false, code: 'ambiguous', reason: '定位不夠準，分不出你在哪一家店', hint: '請開啟手機的「精確位置」與 Wi‑Fi 後再試一次' } };
    var n = pick.nearest;
    return { status: 'fail', result: { ok: false, code: 'out_of_range',
      reason: '你不在任何打卡地點範圍內（最近的是' + (n ? n.name : '—') + '，約 ' + pick.distance_m + ' 公尺）',
      hint: '人在店裡的話，請開啟「精確位置」與 Wi‑Fi 後再試一次',
      nearest: n ? { name: n.name, lat: n.lat, lng: n.lng, radius_m: n.radius_m } : null } };
  }
  function noReply() { say('系統沒有正常回應', 'warn', '請稍後按「重新定位」再試一次。'); $('btnRetry').hidden = false; offerHelp('網路不穩'); }
  function connFail() { say('連線失敗', 'warn', '請檢查網路後按「重新定位」再試一次。'); $('btnRetry').hidden = false; offerHelp('網路不穩'); }
  /** 店家說沒綁定、光復卻說綁著（兩邊資料對不上）：不亮鍵，請同仁找主管，避免一直按一直失敗（階段 2 審查 #2）。 */
  function mismatch() {
    status = null; refreshButtons();
    say('這家店的系統沒有認得你的 LINE 帳號', 'warn', '請按「重新定位」再試一次；一直這樣請告知主管。'); $('btnRetry').hidden = false; offerHelp('綁定');
  }
  function tooMany() { say('按太多次了', 'warn', '請等一分鐘後再試；先按選單「出勤紀錄」確認有沒有打到。'); $('btnRetry').hidden = false; }
  function loadStatus() {
    say('讀取中…', '', '');
    var pick = ClockLineCore.pickStore(fixForPick(), STORES);
    if (pick.status !== 'ok') { curStore = null; render(pickFail(pick)); return Promise.resolve(); }
    var st = pick.store;
    curStore = st;
    return readRetry(storeApi(st), { action: 'liff_status', id_token: liff.getIDToken() })
      .then(function (r) {
        if (r && r.ok && r.status === 'ready') {
          r.store = { code: st.code, name: st.name, lat: st.lat, lng: st.lng, radius_m: st.radius_m };
          render(r); return;
        }
        if (r && r.error === 'invalid_id_token') { liff.login(); return; }
        if (r && r.error === 'not_bound') return loadViaHub();   // 綁定（輸入全名、跨店同名確認）仍由光復處理
        if (r && r.error === 'too_many') { tooMany(); return; }
        if (r && r.error === 'line_identity_conflict') { say('你的 LINE 帳號在這家店對到兩位同仁', 'warn', '請告知主管處理。'); return; }
        noReply();
      }, connFail);
  }
  /** 這家店說還沒綁定：問光復（它會帶出跨店同名建議），畫面照舊顯示綁定框。 */
  function loadViaHub() {
    return readRetry(HUB_API, Object.assign({ action: 'line_hub_status', id_token: liff.getIDToken() }, fixPayload()))
      .then(function (r) {
        if (!r || !r.ok) {
          if (r && r.error === 'invalid_id_token') { liff.login(); return; }
          if (r && r.error === 'too_many') { tooMany(); return; }
          noReply(); return;
        }
        if (r.status === 'ready') { mismatch(); return; }   // 只有店家回 not_bound 才會走到這裡
        render(r);
      }, connFail);
  }

  /* ── 打卡 ── */
  function punch(type) {
    if (busy || !status || status.status !== 'ready') return;
    var label = type === 'in' ? '上班' : '下班';
    var hasIn = (status.today || []).some(function (e) { return e.type === 'in' && (e.status === 'ok' || e.status === 'pending_device_approval'); });
    if (type === 'out' && !status.guard.last && !hasIn && !window.confirm('你今天還沒打上班卡，確定要打下班嗎？')) return;
    // 送出前用最新定位再挑一次店：位置變了就重讀，不把卡打到畫面上沒顯示的那家店
    var pick = ClockLineCore.pickStore(fixForPick(), STORES);
    if (pick.status !== 'ok' || !curStore || pick.store.code !== curStore.code) {
      status = null; refreshButtons();
      return loadStatus().then(function () { if (status && status.status === 'ready') say('你的位置變了，請確認店家後再按一次', 'warn'); });
    }
    var st = curStore;
    var before = countToday(status, type);   // 結果不明時回頭確認用：比「今天這型的卡有沒有多一張」，不比時鐘（clock.html 2026-09-21 同一招）
    busy = true; refreshButtons();
    say('送出' + label + '打卡中…', '', '大約需要幾秒，請不要關閉');
    post(storeApi(st), Object.assign({ action: 'liff_punch', id_token: liff.getIDToken(), type: type }, fixPayload()))
      .then(function (r) {
        if (r && r.error === 'invalid_id_token') { say('LINE 登入逾時，正在重新登入…', 'warn', '登入後請再按一次。'); liff.login(); return; }
        if (r && r.error === 'not_bound') { mismatch(); return; }   // 開頁時已確認綁著，打卡時卻說沒綁＝資料對不上
        if (r && r.error === 'too_many') { status = null; tooMany(); return; }   // 不亮鍵：等一分鐘後按「重新定位」（審查 #4）
        if (!r || (r.ok === false && !r.reason)) {
          say('系統沒有正常回應', 'warn', '請按選單「出勤紀錄」看今天有沒有這筆；沒有再打一次。'); offerHelp('網路不穩'); return;
        }
        var hm = String(r.ts || '').slice(11, 16);
        if (r.ok) {
          var shown = label + '打卡成功 ' + hm + '\n地點：' + st.name + (r.missed ? '\n\n⚠️ ' + r.missed : '') + (r.greeting ? '\n\n' + r.greeting : '');
          // 就地鎖鍵（同網頁版 updateButtonStates({type, ts})）：同型不能再按、另一型 10 分鐘鎖（審查 M1）
          var nowSrv = Date.now() + clockSkew;
          status.guard = { blocked: type, lock: {}, last: { type: type, hm: hm }, now: nowSrv };
          status.guard.lock[type === 'in' ? 'out' : 'in'] = nowSrv + 10 * 60000;
          status.today = (status.today || []).concat([{ type: type, hm: hm, status: 'ok' }]);
          render(status); say(shown, 'ok');
          return sendToChat().then(function (closing) { if (closing) keepBusy = true; });
        }
        var failText = label + '打卡失敗\n原因：' + r.reason + (r.hint ? '\n怎麼辦：' + r.hint : '');
        // 失敗：重讀狀態；重讀也失敗就維持鍵停用（不拿舊狀態重新亮鍵），訊息保留（審查 L4）
        status = null; refreshButtons();
        var hk = { rejected_out_of_range: '定位不準', pending_device_approval: '新手機' }[r.status] || null;
        return loadStatus().then(function () { say(failText, 'warn'); offerHelp(hk); });
      }, function () { return confirmPunch(type, st, before); })
      .then(function () { if (!keepBusy) { busy = false; refreshButtons(); } });
  }
  function countToday(s, type) {
    return ((s && s.today) || []).filter(function (e) { return e.type === type && (e.status === 'ok' || e.status === 'pending_device_approval'); }).length;
  }
  /** 打卡送出後結果不明（逾時、斷線、回應不是 JSON）：重讀今天的紀錄確認，絕不自動重送打卡。 */
  function confirmPunch(type, st, before) {
    var label = type === 'in' ? '上班' : '下班';
    say('連線不穩，正在確認剛才那筆有沒有進去…', '', '請不要關閉，也不要再按');
    return readRetry(storeApi(st), { action: 'liff_status', id_token: liff.getIDToken() }).then(function (r) {
      if (!r || !r.ok || r.status !== 'ready') throw new Error('confirm_failed');
      r.store = { code: st.code, name: st.name, lat: st.lat, lng: st.lng, radius_m: st.radius_m };
      if (countToday(r, type) > before) {
        var mine = r.today.filter(function (e) { return e.type === type && (e.status === 'ok' || e.status === 'pending_device_approval'); });
        render(r);
        say(label + '打卡成功 ' + mine[mine.length - 1].hm + '（剛才那筆已經進去了，不用再按）\n地點：' + st.name, 'ok');
        return sendToChat().then(function (closing) { if (closing) keepBusy = true; });
      }
      render(r);
      say('這次' + label + '卡沒有送出', 'warn', '請再按一次「' + label + '」。');
    }).catch(function () {
      say('連線不穩，不確定這筆有沒有進去', 'warn', '請按選單「出勤紀錄」看今天有沒有這筆；沒有再打一次。不要連按。');
      offerHelp('網路不穩');
    });
  }
  var keepBusy = false;   // 已送進聊天室、畫面即將關閉：不要再把鍵解開
  /** 代同仁在聊天室送出「打卡」→ 機器人回覆結果 → 關閉。沒有 chat_message.write 或不在 LINE 裡：結果留在畫面上。 */
  function sendToChat() {   // 回傳 Promise<是否即將關閉>
    if (!liff.isInClient || !liff.isInClient() || !liff.sendMessages) return Promise.resolve(false);
    return liff.sendMessages([{ type: 'text', text: '打卡' }])
      .then(function () { setTimeout(function () { liff.closeWindow(); }, 1500); return true; }, function () { return false; });
  }

  /* ── 第一次使用：輸入全名綁定 ── */
  function showBind(storeName, suggest) {
    suggested = suggest || '';
    $('btns').hidden = true;
    $('bindBox').hidden = false;
    $('bindTitle').textContent = suggested ? '你在別家店已綁定為「' + suggested + '」' : '第一次使用，請輸入你的全名';
    $('bindHint').textContent = suggested
      ? '「' + storeName + '」的名冊上也有這個名字，是你本人就按下面的按鈕。'
      : '綁定「' + (storeName || '你上班的店') + '」：要人在店裡，名字要和店裡名冊一樣';
    $('bindName').value = suggested;
    $('btnBind').textContent = suggested ? '是我，綁定' : '綁定';
    $('bindError').textContent = '';
    say('', '', '');
  }
  $('btnBind').addEventListener('click', function () {
    var name = $('bindName').value.trim();
    if (!name) { $('bindError').textContent = '請輸入你的全名'; return; }
    $('btnBind').disabled = true; $('bindError').textContent = '';
    post(HUB_API, Object.assign({ action: 'line_bind_name', id_token: liff.getIDToken(), name: name }, fixPayload()))
      .then(function (r) {
        $('btnBind').disabled = false;
        if (r && r.ok) { loadStatus(); return; }
        if (r && r.error === 'invalid_id_token') { liff.login(); return; }
        $('bindError').textContent = (r && r.message) || '綁定沒有成功，請稍後再試；一直不行請告知主管。';
      }, function () { $('btnBind').disabled = false; $('bindError').textContent = '連線失敗，請檢查網路後再試。'; });
  });
  $('btnIn').addEventListener('click', function () { punch('in'); });
  $('btnOut').addEventListener('click', function () { punch('out'); });
  $('btnRetry').addEventListener('click', function () { $('btnRetry').hidden = true; start(); });
  $('btnHelp').addEventListener('click', sendHelp);

  function start() {
    say('定位中…', '', '');
    startGeo().then(function (p) { showMe(p.coords.latitude, p.coords.longitude); return loadStatus(); },
      function (err) {
        say(err.message, 'warn', '請允許 LINE 使用定位（手機設定 → LINE → 位置），開啟「精確位置」與 Wi‑Fi 後按「重新定位」。');
        $('btnRetry').hidden = false;
        offerHelp(/權限/.test(err.message) ? '定位權限' : '定位抓不到');
      });
  }

  tick(); setInterval(tick, 1000);
  initMap();
  initLiff().then(function (ok) {
    if (!ok) { say('請從 LINE 官方帳號「鼎兆元打卡」的選單打開這一頁。', 'warn'); return; }
    start();
  });
})();
</script>
</body>
</html>
