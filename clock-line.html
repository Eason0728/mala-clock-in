<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鼎兆元打卡</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32-mzt.png">
<!--
  LINE 單一打卡入口（v2，2026-10-08，規格 mala-clock-liff/docs/spec.md「v2 補充」）
  官方帳號「鼎兆元打卡」選單的「打卡」打開這頁（LIFF 2011292256-QFXEwFh4）：
    抓 GPS → 光復後端 line_quick_clock（挑店、自動判斷上／下班、10 分鐘鎖、打那家店）
    → 代同仁在聊天室送出「打卡」→ 關閉；機器人用「回覆」把結果送進聊天室（webhook，LineHub.gs）。
  第一次使用：輸入全名綁定（line_bind_name，人要在那家店的範圍內）。
  ⚠ 這頁是獨立檔，不是由 clock.html 產生；各門市的 clock*.html 與這頁互不影響。
-->
<style>
  :root { --ink: #1f2a27; --muted: #6b7a75; --ok: #1e7d4f; --warn: #a15a00; --brand: #2a6b5e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; color: #fff;
         background: radial-gradient(120% 90% at 50% 16%, #3d8f7f 0%, #2a6b5e 55%, #1c4a41 100%) fixed; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px 40px; }
  h1 { margin: 0 0 4px; text-align: center; font-size: 26px; letter-spacing: 2px; }
  .sub { text-align: center; opacity: .8; margin: 0 0 20px; font-size: 14px; }
  .card { background: #fff; color: var(--ink); border-radius: 18px; padding: 22px 18px; text-align: center;
          box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .icon { font-size: 44px; line-height: 1; margin-bottom: 10px; }
  .msg { font-size: 17px; line-height: 1.6; white-space: pre-line; }
  .msg.ok { color: var(--ok); } .msg.warn { color: var(--warn); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; white-space: pre-line; }
  input { width: 100%; padding: 12px; font-size: 17px; border: 1px solid #ccd5d2; border-radius: 10px; margin-top: 12px; }
  button { width: 100%; margin-top: 14px; padding: 14px; font-size: 17px; font-weight: 700; border: 0; border-radius: 12px;
           background: var(--brand); color: #fff; }
  button.ghost { background: #eef3f1; color: var(--brand); }
  button:disabled { opacity: .5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>鼎兆元打卡</h1>
  <p class="sub">在店裡按選單「打卡」就好，結果會回到聊天室</p>

  <div class="card" id="statusCard">
    <div class="icon" id="statusIcon">⏳</div>
    <div class="msg" id="statusMsg">準備中…</div>
    <div class="hint" id="statusHint"></div>
    <button class="ghost" id="btnRetry" type="button" hidden>再打一次</button>
    <button class="ghost" id="btnClose" type="button" hidden>關閉</button>
  </div>

  <div class="card" id="bindCard" hidden style="margin-top:14px;">
    <div class="msg">第一次使用，請輸入你的<b>全名</b></div>
    <div class="hint" id="bindStoreHint">要人在你上班的店裡才能綁定</div>
    <input id="bindName" type="text" placeholder="例如：王小明" autocomplete="name">
    <div class="hint" id="bindError" style="color:#c22a12;"></div>
    <button id="btnBind" type="button">綁定並打卡</button>
  </div>
</main>

<script>
(function () {
  'use strict';
  var LIFF_ID = '2011292256-QFXEwFh4';
  // 集中服務（光復打卡後端，LineHub.gs）
  var HUB_API = 'https://script.google.com/macros/s/AKfycbxE4DTz847y0bPvLd4mD_9vBFTe3npmVVYKU1CYgeFcUpAuL4vLIA3rySXSR-2qujdJ0A/exec';

  function qs(n) { return new URLSearchParams(location.search).get(n); }
  var isLocalHost = ['localhost', '127.0.0.1'].indexOf(location.hostname) !== -1;
  if (isLocalHost && qs('api')) HUB_API = qs('api');      // 本機 mock

  var $ = function (id) { return document.getElementById(id); };
  var lastPos = null;

  function show(icon, msg, cls, hint) {
    $('statusIcon').textContent = icon;
    $('statusMsg').textContent = msg;
    $('statusMsg').className = 'msg' + (cls ? ' ' + cls : '');
    $('statusHint').textContent = hint || '';
  }
  function showButtons(retry, close) { $('btnRetry').hidden = !retry; $('btnClose').hidden = !close; }

  /** POST JSON（text/plain 避開 CORS 預檢）。打卡是寫入動作：刻意不設逾時、不自動重送（重送會變重複打卡）。 */
  function post(body) {
    return fetch(HUB_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.text(); })
      .then(function (t) { return JSON.parse(t); });
  }

  /* ── LINE 身分 ── */
  function initLiff() {
    if (isLocalHost && qs('mock_uid')) {   // 本機測試：模擬已登入（mock 認 MOCK_ID_TOKEN_<uid>）
      var uid = qs('mock_uid');
      window.liff = { init: function () { return Promise.resolve(); }, isLoggedIn: function () { return true; },
        getIDToken: function () { return 'MOCK_ID_TOKEN_' + uid; }, login: function () {}, isInClient: function () { return !!qs('in_client'); },
        sendMessages: function (m) { window.__sent = (window.__sent || []).concat(m); return Promise.resolve(); },
        closeWindow: function () { window.__closed = true; } };
      return Promise.resolve(true);
    }
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
      s.onload = function () { resolve(true); };
      s.onerror = function () { resolve(false); };
      document.head.appendChild(s);
    }).then(function (ok) {
      if (!ok) return false;
      return liff.init({ liffId: LIFF_ID }).then(function () {
        if (!liff.isLoggedIn()) { liff.login(); return false; }
        return true;
      }, function () { return false; });
    });
  }

  /* ── 定位：與 clock.html getPosition 同一套規則（誤差 >40m 或 30 秒前的舊位置就多等最多 8 秒）── */
  var GOOD_ACCURACY_M = 40, STALE_FIX_MS = 30000, RETRY_BUDGET_MS = 8000;
  var GEO_OPTS = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };
  function good(p) {
    var acc = p && p.coords && isFinite(p.coords.accuracy) ? p.coords.accuracy : Infinity;
    return acc <= GOOD_ACCURACY_M && (Date.now() - (p.timestamp || 0)) <= STALE_FIX_MS;
  }
  function getPosition() {
    if (isLocalHost && qs('loc')) {
      var m = String(qs('loc')).split(',');
      var acc = parseFloat(qs('acc'));
      return Promise.resolve({ timestamp: Date.now(), coords: { latitude: +m[0], longitude: +m[1], accuracy: isFinite(acc) ? acc : 10 } });
    }
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) { reject(new Error('這支手機不支援定位')); return; }
      var best = null, watchId = null, timer = null, done = false;
      function finish() {
        if (done) return; done = true;
        if (timer) clearTimeout(timer);
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        if (best) resolve(best); else reject(new Error('定位失敗'));
      }
      function offer(p) {   // 合格的一律贏過不合格的；同級才比誤差（過時定位常常誤差反而小，見 clock.html 註解）
        if (!best || (good(p) && !good(best)) || (good(p) === good(best) && p.coords.accuracy < best.coords.accuracy)) best = p;
      }
      navigator.geolocation.getCurrentPosition(function (p) {
        offer(p);
        if (good(p)) { finish(); return; }
        show('📡', '定位中…（訊號較弱，再抓一次）');
        timer = setTimeout(finish, RETRY_BUDGET_MS);
        watchId = navigator.geolocation.watchPosition(function (p2) { offer(p2); if (good(p2)) finish(); }, function () {}, GEO_OPTS);
      }, function (err) {
        if (done) return; done = true;
        reject(new Error(err && err.code === 1 ? '定位權限被拒絕' : '定位失敗'));
      }, GEO_OPTS);
    });
  }

  /* ── 打卡 ── */
  function clock() {
    showButtons(false, false);
    $('bindCard').hidden = true;
    show('📡', '定位中…');
    getPosition().then(function (pos) {
      lastPos = pos;
      show('⏳', '送出打卡中…', '', '大約需要幾秒，請不要關閉');
      return post({ action: 'line_quick_clock', id_token: liff.getIDToken(),
                    lat: pos.coords.latitude, lng: pos.coords.longitude,
                    accuracy: isFinite(pos.coords.accuracy) ? pos.coords.accuracy : null })
        .then(function (r) {
          if (!r || !r.ok) {
            if (r && r.error === 'invalid_id_token') { show('🔄', 'LINE 身分已過期，正在重新登入…'); liff.login(); return; }
            show('⚠️', '系統沒有正常回應', 'warn', '請關掉後按選單「出勤紀錄」看今天有沒有這筆；沒有再按一次「打卡」。');
            showButtons(true, true);
            return;
          }
          var res = r.result || {};
          if (res.code === 'not_bound') { showBind(res.store_name); return; }
          show(res.ok ? '✅' : '❌', String(r.text || '').replace(/^[✅❌]\s*/, ''), res.ok ? 'ok' : 'warn');
          showButtons(!res.ok, true);
          return sendToChat();
        }, function () {
          // 送出之後才斷線：不知道這筆有沒有進去，不可自動重送
          show('⚠️', '連線不穩，不確定這筆有沒有進去', 'warn', '請關掉後按選單「出勤紀錄」看今天有沒有這筆；沒有再按一次「打卡」。');
          showButtons(false, true);
        });
    }, function (err) {
      show('📍', err.message, 'warn', '請允許 LINE 使用定位（手機設定 → LINE → 位置），開啟「精確位置」與 Wi‑Fi 後再按一次。');
      showButtons(true, true);
    });
  }

  /** 代同仁在聊天室送出「打卡」→ 機器人用回覆送出結果 → 關閉這頁。
   *  不在 LINE 裡開、或 LIFF 沒有 chat_message.write 權限：結果留在畫面上（打卡本身已完成）。 */
  function sendToChat() {
    if (!liff.isInClient || !liff.isInClient() || !liff.sendMessages) return;
    return liff.sendMessages([{ type: 'text', text: '打卡' }])
      .then(function () { setTimeout(function () { liff.closeWindow(); }, 600); }, function () {});
  }

  /* ── 第一次使用：輸入全名綁定 ── */
  function showBind(storeName) {
    show('👋', '還沒綁定' + (storeName ? '「' + storeName + '」' : ''), '', '');
    $('bindStoreHint').textContent = storeName ? '綁定「' + storeName + '」：要人在店裡，名字要和店裡名冊一樣' : '要人在你上班的店裡才能綁定';
    $('bindCard').hidden = false;
    $('bindError').textContent = '';
    $('bindName').focus();
  }
  $('btnBind').addEventListener('click', function () {
    var name = $('bindName').value.trim();
    if (!name) { $('bindError').textContent = '請輸入你的全名'; return; }
    if (!lastPos) { clock(); return; }
    $('btnBind').disabled = true;
    $('bindError').textContent = '';
    post({ action: 'line_bind_name', id_token: liff.getIDToken(), name: name,
           lat: lastPos.coords.latitude, lng: lastPos.coords.longitude,
           accuracy: isFinite(lastPos.coords.accuracy) ? lastPos.coords.accuracy : null })
      .then(function (r) {
        $('btnBind').disabled = false;
        if (r && r.ok) { $('bindCard').hidden = true; clock(); return; }
        if (r && r.error === 'invalid_id_token') { liff.login(); return; }
        $('bindError').textContent = (r && r.message) || '綁定沒有成功，請稍後再試；一直不行請告知主管。';
      }, function () {
        $('btnBind').disabled = false;
        $('bindError').textContent = '連線失敗，請檢查網路後再試。';
      });
  });
  $('btnRetry').addEventListener('click', clock);
  $('btnClose').addEventListener('click', function () { if (window.liff && liff.closeWindow) liff.closeWindow(); });

  initLiff().then(function (ok) {
    if (!ok) { show('💬', '請從 LINE 官方帳號「鼎兆元打卡」的選單打開這一頁。'); return; }
    clock();
  });
})();
</script>
</body>
</html>
