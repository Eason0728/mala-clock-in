<!-- ⚠ 這是「母版」。各門市（央廚 clock-cf.html／總部 clock-hq.html…）的頁面是從本檔產生的，
     改完本檔請務必重跑：  python3 tools/build-store-pages.py
     否則各門市頁面會停在舊版。原因：LINE 連結預覽卡與 iOS 加入主畫面都只讀原始 HTML、不執行 JS，
     所以標題與圖示必須寫死在各自的檔案裡。 -->
<!-- 本檔由 tools/build-store-pages.py 從 manager.html 產生，請勿手改 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鼎兆元 總部 值班主管核定</title>
<link rel="apple-touch-icon" href="assets/icon-180-mzt-manager.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<meta name="apple-mobile-web-app-title" content="總部值班">
<script>
/* ⚠ 主畫面圖示必須在 <head> 解析當下就換掉：iOS 在「加入主畫面」時抓的是它解析 head 時看到的
   apple-touch-icon，寫在頁尾才換有機會來不及。這段只改標籤，不依賴其他程式。 */
(function () {
  var MAP = {
    'cf': { icon: 'assets/icon-180-mzt-manager.png', home: '央廚值班' },
    'hq': { icon: 'assets/icon-180-mzt-manager.png', home: '總部值班' }
  };
  var s = String(new URLSearchParams(location.search).get('s') || '').toLowerCase();
  var b = MAP[s];
  if (!b) return;
  var l = document.querySelector('link[rel="apple-touch-icon"]');
  if (l) l.setAttribute('href', b.icon);
  var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (m) m.setAttribute('content', b.home);
})();
</script>

<div class="container">

  <div class="date-bar">
    <button type="button" id="btnPrevDay">‹</button>
    <input type="date" id="dateInput">
    <button type="button" id="btnNextDay">›</button>
    <button type="button" id="btnToday">今天</button>
  </div>

  <!-- 待核准裝置：只有真的有待核准時才出現，平常完全不佔版面 -->

  <div id="loadingCard" class="card center-msg">載入中…</div>

<script>
(function () {
  'use strict';

  /* 多門市後端對照：不帶 ?s= 就是光復（既有連結完全不受影響）。
     各店打卡各自一份試算表與部署，所以只有網址不同，程式共用一份。 */
  var STORE_APIS = {
    ''  : 'https://script.google.com/macros/s/AKfycbxE4DTz847y0bPvLd4mD_9vBFTe3npmVVYKU1CYgeFcUpAuL4vLIA3rySXSR-2qujdJ0A/exec',   // 麻的小辛辣 新竹光復店（預設）
    'cf': 'https://script.google.com/macros/s/AKfycby-IzOBTrUK-usZxEUVRAcvPqagfAbHpvLevIWnk6drBpIuHwh1IlEun4bdsS9o-CIB/exec',   // 鼎兆元 中央廚房（台中太平）
    'hq': 'https://script.google.com/macros/s/AKfycbyiocazNgn9M249CCkPzJsRvMJ35uh_Wjp_ju1y1sB2TZ_IWH3RD6pKUsHXsUJR-4N9TQ/exec'    // 鼎兆元 總部（座標暫用央廚）
  };
  var STORE_CODE = 'hq';   // 由 tools/build-store-pages.py 產生，勿手改
  var API_URL = STORE_APIS[STORE_CODE];
  // 假別清單與額度住在薪酬系統（全集團共用一份），固定打光復那套後端；
  // ⚠ 不可跟著門市切換——央廚／總部的後端沒有薪資模組。與 clock.html 的「我的薪資」同一個道理。
  // 本機測試時 ?api= 會一併覆寫（否則本機頁面會去打正式薪酬後端，mock 金鑰在那邊無效）
  var PAYROLL_API = qs('api')
    || 'https://script.google.com/macros/s/AKfycbxE4DTz847y0bPvLd4mD_9vBFTe3npmVVYKU1CYgeFcUpAuL4vLIA3rySXSR-2qujdJ0A/exec';
  // 後端拿到的假別表；拿不到時退回這份內建清單（值班核定不能因為薪酬後端掛掉就不能用）
  var LEAVE_FALLBACK = ['病假', '事假', '特休假', '生理假', '家庭照顧假', '天災假', '喪假', '婚假'];
  var LEAVE_OPTS = null;   // { types:[...], quotas:{emp_id:{code:{...}}}, day_hours:n }
  // ⚠ 本頁的門市代碼是小寫（''／'cf'／'hq'，跟 STORE_APIS 一致），
  //    薪酬系統的門市代碼是大寫（SSLGF／CF／HQ）且比對「完全相等」——不轉換會查不到門市，
  //    症狀是央廚／總部的假別下拉靜靜退回內建 8 種、額度也不會顯示。
  var PAYROLL_STORE_MAP = { '': 'SSLGF', 'cf': 'CF', 'hq': 'HQ' };
  function payrollStoreCode() { return PAYROLL_STORE_MAP[STORE_CODE] || 'SSLGF'; }

  /** 開頁時抓一次假別清單與各人剩餘額度。失敗不擋人——退回內建清單、只是沒有額度提示。 */
  function loadLeaveOptions() {
    return fetch(PAYROLL_API, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'payroll_leave_options', store: payrollStoreCode(), mgr_key: mgrKey })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok) LEAVE_OPTS = j;
    }).catch(function () { /* 靜默退回 fallback */ });
  }

  /** 期限規則檢查（與後端 payLeaveWindowCheck 同一套規則，改這裡兩邊都要改）。
   *  以事件日為基準：婚假＝結婚登記日、陪產假＝分娩日。事件日沒登記就不擋、只提示。 */
  function shiftDay(d, n) {
    var x = new Date(d + 'T00:00:00');
    x.setDate(x.getDate() + n);
    var p = function (v) { return (v < 10 ? '0' : '') + v; };
    return x.getFullYear() + '-' + p(x.getMonth() + 1) + '-' + p(x.getDate());
  }
  function windowCheck(def, empId, leaveDate) {
    if (!def || def.window_days == null) return { ok: true };
    var ev = ((LEAVE_OPTS && LEAVE_OPTS.events && LEAVE_OPTS.events[empId]) || {})[def.code];
    if (!ev) return { ok: true, note: def.name + ' 有期限規定，但還沒登記事件日，系統無法檢查' };
    var from = shiftDay(ev, -(Number(def.window_before) || 0));
    var to   = shiftDay(from, Number(def.window_days) || 0);
    var toMax = (def.window_max == null) ? null : shiftDay(from, Number(def.window_max));
    if (leaveDate < from) return { ok: false, msg: def.name + ' 最早只能從 ' + from + ' 開始請（事件日 ' + ev + '）' };
    if (leaveDate <= to) return { ok: true };
    if (toMax && leaveDate <= toMax) return { ok: true, note: def.name + ' 已超過 ' + to + ' 的期限，需雇主同意才可延至 ' + toMax };
    return { ok: false, msg: def.name + ' 請畢期限是 ' + to + (toMax ? '（經同意最多延至 ' + toMax + '）' : '') + '，已超過' };
  }

  /** 某人某假別的剩餘額度文字與是否該擋。 */
  function quotaOf(empId, code) {
    if (!LEAVE_OPTS || !LEAVE_OPTS.quotas) return null;
    var q = (LEAVE_OPTS.quotas[empId] || {})[code];
    return q || null;
  }
  /* 門市品牌：依 ?s= 換頁面標題與 logo。不帶參數＝光復，畫面與原本完全相同。 */
  var STORE_BRAND = {
    ''  : { title: '麻的🔥小辛辣', logo: null },
    'cf': { title: '中央廚房',     logo: 'assets/emblem-mzt.png', doc: '中央廚房',
            icon: 'assets/icon-180-mzt-manager.png', home: '央廚值班' },
    'hq': { title: '鼎兆元 總部', logo: 'assets/emblem-mzt.png', doc: '鼎兆元總部',
            icon: 'assets/icon-180-mzt-manager.png', home: '總部值班' }
  };
  (function () {
    var b = STORE_BRAND[STORE_CODE];
    if (!b || !b.logo) return;                 // 光復維持原樣
    var h1 = document.querySelector('header h1');
    if (h1) h1.textContent = b.title;
    var img = document.createElement('img');
    img.className = 'brandLogo'; img.src = b.logo; img.alt = b.title;
    if (h1 && h1.parentNode) h1.parentNode.insertBefore(img, h1);
    // 各門市的靜態頁（clock-cf.html…）標題已寫死，這裡要冪等，不然會變「中央廚房中央廚房 …」
    if (b.doc && document.title.indexOf(b.doc) !== 0) document.title = b.doc + document.title.replace(/^麻的小辛辣/, '');
    // 加到主畫面的圖示與名稱：iOS 是在「加入主畫面」當下讀這兩個標籤，所以這裡改得到
    if (b.icon) {
      var l = document.querySelector('link[rel="apple-touch-icon"]');
      if (l) l.setAttribute('href', b.icon);
    }
    if (b.home) {
      var mt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (mt) mt.setAttribute('content', b.home);
    }
  })();


  function qs(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  var isLocalHost = ['localhost', '127.0.0.1'].indexOf(window.location.hostname) !== -1;
  if (isLocalHost) {
    var apiOverride = qs('api');
    if (apiOverride) API_URL = apiOverride;
  }

  var mgrKey = qs('k');

  var loadingCard = document.getElementById('loadingCard');
  var errorCard = document.getElementById('errorCard');
  var empListEl = document.getElementById('empList');
  var pendingDevicesEl = document.getElementById('pendingDevices');
  var dateInput = document.getElementById('dateInput');
  var btnPrevDay = document.getElementById('btnPrevDay');
  var btnNextDay = document.getElementById('btnNextDay');
  var btnToday = document.getElementById('btnToday');

  var currentDate = null; // 'yyyy-mm-dd'，由伺服器回傳值決定（避免依賴裝置時區）

  function apiPost(payload) {
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload),
    }).then(function (res) { return res.json(); });
  }

  function showError(msg) {
    loadingCard.style.display = 'none';
    empListEl.innerHTML = '';
    errorCard.style.display = 'block';
    errorCard.textContent = msg;
  }

  function addDaysStr(dateStr, n) {
    var d = new Date(dateStr + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function weekdayZh(dateStr) {
    var WEEKDAY_ZH = ['日', '一', '二', '三', '四', '五', '六'];
    return WEEKDAY_ZH[new Date(dateStr + 'T00:00:00Z').getUTCDay()];
  }

  function segmentText(s) {
    return (s.in || '？') + '–' + (s.out || '？') + (s.cross ? '(+1)' : '');
  }

  function badgeClass(statusText) {
    if (!statusText || statusText === '正常') return 'normal';
    return 'warn';
  }

  function buildPeriodRow(period) {
    var row = document.createElement('div');
    row.className = 'period-row';
    var start = document.createElement('input');
    start.type = 'time';
    start.className = 'p-start';
    start.value = (period && period.start) || '';
    var dash = document.createElement('span');
    dash.className = 'dash';
    dash.textContent = '–';
    var end = document.createElement('input');
    end.type = 'time';
    end.className = 'p-end';
    end.value = (period && period.end) || '';
    var removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = '－';
    removeBtn.addEventListener('click', function () { row.remove(); });
    row.appendChild(start);
    row.appendChild(dash);
    row.appendChild(end);
    row.appendChild(removeBtn);
    return row;
  }

  // 假別＋時數的顯示後綴，如「・病假2.5h」「・病假」；沒假別回空字串
  function leaveSuffix(type, hours) {
    if (!type) return '';
    var h = (hours === 0 || hours) && hours !== '' ? Number(hours) : null;
    return '・' + type + (h != null && isFinite(h) ? h + 'h' : '');
  }

  function renderResult(resultBox, res) {
    resultBox.className = 'result-box show ' + (badgeClass(res.status_text) === 'normal' ? 'result-ok' : 'result-warn');
    resultBox.textContent = '✓ 已核定 ' + res.approved_hours + ' 小時・' + res.status_text
      + leaveSuffix(res.leave_type, res.leave_hours) + '（' + res.manager_name + '）';
  }

  function buildEmployeeCard(emp) {
    var card = document.createElement('div');
    card.className = 'card';

    var nameEl = document.createElement('div');
    nameEl.className = 'emp-name';
    nameEl.textContent = emp.name;
    card.appendChild(nameEl);

    var punchEl = document.createElement('div');
    punchEl.className = 'punch-summary';
    if (emp.segments && emp.segments.length) {
      // C2：後端忘刷卡整天回 reference=null（與月表空白同義），不可直接串接成字面 "null"
      var refText = (emp.reference === null || emp.reference === undefined) ? '參考 —' : ('參考 ' + emp.reference + ' 小時');
      punchEl.textContent = '打卡：' + emp.segments.map(segmentText).join('、') + '　' + refText;
    } else if (emp.attempts > 0) {
      // C3：有嘗試打卡但全部沒入帳（如被裝置/範圍擋下）——與「真的沒打卡」分開講清楚
      punchEl.textContent = '今天沒有入帳的打卡（有 ' + emp.attempts + ' 筆未入帳嘗試）';
    } else {
      // 沒打卡的同仁也列出（整天忘刷卡的人才核得到）；參考空白不顯示數字
      punchEl.textContent = '今天沒有打卡紀錄';
    }
    card.appendChild(punchEl);

    // 防呆：這天若有打卡段還沒配對完成（有上班沒下班，out===null），現在核定會比對不到
    // 這段（未配對的段不算「完整段」），核定結果卻是核定當下寫死，之後打卡補上也不會
    // 自動重算——常見於跨夜班還沒打完就核定。跨天下班卡本身配對正常，這只是時機問題。
    var hasOpenSeg = (emp.segments || []).some(function (s) { return s.in && !s.out; });
    if (hasOpenSeg) {
      var openWarn = document.createElement('div');
      openWarn.className = 'open-shift-warn';
      openWarn.textContent = '⚠ 有打卡段還沒打下班卡（可能還在上班或跨夜還沒打完），現在核定會核不到這段、且之後補打卡也不會自動更新。請同仁立即打卡避免忘刷卡。';
      card.appendChild(openWarn);
    }

    // 狀態徽章抽成可重設的元素：核定成功後當場翻成「已核定」，不用重新整理才看得到
    var badge = document.createElement('div');
    function setBadge(approved, leaveType, leaveHours) {
      if (approved) {
        badge.className = 'approved-badge ' + badgeClass(approved.status_text);
        badge.textContent = '已核定 ' + approved.approved_hours + ' 小時・' + approved.status_text
          + leaveSuffix(leaveType, leaveHours) + '（' + approved.manager_name + '）';
      } else {
        badge.className = 'approved-badge pending';
        badge.textContent = '待核定';
      }
    }
    setBadge(emp.approved, emp.leave_type, emp.leave_hours);
    card.appendChild(badge);

    var periodRows = document.createElement('div');
    periodRows.className = 'period-rows';
    var initialPeriods = (emp.approved && emp.approved.periods && emp.approved.periods.length)
      ? emp.approved.periods
      : [null];
    initialPeriods.forEach(function (p) { periodRows.appendChild(buildPeriodRow(p)); });
    card.appendChild(periodRows);

    // 請假註記：選了假別會寫入 leave 分頁（月表狀態欄顯示），改回「無」重送會清掉
    // 假別清單改由薪酬系統的 payroll_leave_type 決定——在那張表加一列，這裡就多一個選項，
    // 不必再改三處程式（後端／本頁／mock）。抓不到就用內建 fallback。
    var LEAVE_TYPES = (LEAVE_OPTS && LEAVE_OPTS.types && LEAVE_OPTS.types.length)
      ? LEAVE_OPTS.types.map(function (t) { return t.name; })
      : LEAVE_FALLBACK;
    var leaveRow = document.createElement('div');
    leaveRow.className = 'leave-row';
    var leaveLabel = document.createElement('label');
    leaveLabel.textContent = '請假註記';
    var leaveSelect = document.createElement('select');
    ['無'].concat(LEAVE_TYPES).forEach(function (t) {
      var opt = document.createElement('option');
      opt.value = t === '無' ? '' : t;
      opt.textContent = t;
      // 額度用完就反灰選不了（曆年制與每子女制才擋；婚喪產檢一年可能發生多次，不擋）
      if (t !== '無' && LEAVE_OPTS && LEAVE_OPTS.types) {
        var def = LEAVE_OPTS.types.filter(function (x) { return x.name === t; })[0];
        var q = def ? quotaOf(String(emp.emp_id), def.code) : null;
        if (q && q.cap_days != null) {
          var remain = Math.round((q.remain_days || 0) * 10) / 10;
          if (q.blocked) {
            opt.disabled = true;
            opt.textContent = t + '（額度已用完）';
          } else if (q.basis === 'event') {
            // 婚喪產檢是「每次事件」各有額度，一年可能發生多次；顯示「剩 N 日」會誤導
            // （一月用掉 3 天，十二月不該說只剩 5 天），改標示每次的上限。
            opt.textContent = t + '（每次上限 ' + q.cap_days + ' 日）';
          } else if (def.code === 'parental') {
            // 育嬰留停額度以月計較好懂（730 日＝24 個月）
            opt.textContent = t + '（剩 ' + (Math.round(remain / 30 * 10) / 10) + ' 個月）';
          } else {
            opt.textContent = t + '（剩 ' + remain + ' 日）';
          }
        }
        // 已經選過這個假別的紀錄，即使現在超額也要能顯示，否則重開頁會掉值
        if (String(emp.leave_type || '') === t) opt.disabled = false;
      }
      leaveSelect.appendChild(opt);
    });
    leaveSelect.value = emp.leave_type || '';
    // 時數：只在有選假別時可填（選「無」時鎖住並清空），單位小時、以 0.25（15 分鐘）為刻度
    var leaveHours = document.createElement('input');
    leaveHours.type = 'number';
    leaveHours.className = 'leave-hours';
    leaveHours.step = '0.25';
    leaveHours.min = '0';
    leaveHours.placeholder = '時數';
    leaveHours.value = (emp.leave_hours === 0 || emp.leave_hours) ? emp.leave_hours : '';
    var hoursUnit = document.createElement('span');
    hoursUnit.className = 'hours-unit';
    hoursUnit.textContent = '小時';
    function syncLeaveHoursEnabled() {
      var on = !!leaveSelect.value;
      leaveHours.disabled = !on;
      if (!on) leaveHours.value = '';
    }
    leaveSelect.addEventListener('change', syncLeaveHoursEnabled);
    syncLeaveHoursEnabled();
    leaveRow.appendChild(leaveLabel);
    leaveRow.appendChild(leaveSelect);
    leaveRow.appendChild(leaveHours);
    leaveRow.appendChild(hoursUnit);
    card.appendChild(leaveRow);

    var actions = document.createElement('div');
    actions.className = 'card-actions';
    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'add-period-btn';
    addBtn.textContent = '＋ 加一段';
    addBtn.addEventListener('click', function () { periodRows.appendChild(buildPeriodRow(null)); });
    var submitBtn = document.createElement('button');
    submitBtn.type = 'button';
    submitBtn.className = 'submit-btn';
    submitBtn.textContent = emp.approved ? '重新送出核定' : '送出核定';
    actions.appendChild(addBtn);
    actions.appendChild(submitBtn);
    card.appendChild(actions);

    var resultBox = document.createElement('div');
    resultBox.className = 'result-box';
    card.appendChild(resultBox);

    submitBtn.addEventListener('click', function () {
      // 硬擋：額度用完的假別不給送出。下拉的 disabled 只擋滑鼠，程式指定仍設得進去，
      // 所以送出前用同一份額度資料再判一次（Eason 2026-08-22 指定「硬擋，不給送出」）。
      if (leaveSelect.value && LEAVE_OPTS && LEAVE_OPTS.types) {
        var d0 = LEAVE_OPTS.types.filter(function (x) { return x.name === leaveSelect.value; })[0];
        var q0 = d0 ? quotaOf(String(emp.emp_id), d0.code) : null;
        // 原本就選著這個假別的既有紀錄放行，否則已超額的人連重送核定都做不了
        // 期限規則（婚假 3 個月內、陪產假前後 15 日內…）
        if (d0 && String(emp.leave_type || '') !== leaveSelect.value) {
          var wc = windowCheck(d0, String(emp.emp_id), currentDate);
          if (!wc.ok) {
            resultBox.style.display = 'block';
            resultBox.textContent = '✕ ' + wc.msg + '，無法送出。確有需要請聯絡 Eason。';
            return;
          }
          if (wc.note && !confirm(wc.note + '\n\n仍要送出嗎？')) return;
        }
        if (q0 && q0.blocked && String(emp.leave_type || '') !== leaveSelect.value) {
          resultBox.style.display = 'block';
          resultBox.textContent = '✕ ' + emp.name + ' 的「' + leaveSelect.value
            + '」額度已用完（上限 ' + q0.cap_days + ' 日，已用 '
            + (Math.round((q0.used_days || 0) * 10) / 10) + ' 日），無法送出。'
            + '確有需要請聯絡 Eason 調整假別設定。';
          return;
        }
      }
      var periods = [];
      var halfFilled = false;
      periodRows.querySelectorAll('.period-row').forEach(function (row) {
        var s = row.querySelector('.p-start').value;
        var e = row.querySelector('.p-end').value;
        if (s && e) periods.push({ start: s, end: e });
        else if (s || e) halfFilled = true; // 只填了上班或下班一邊
      });
      if (halfFilled) {
        resultBox.className = 'result-box show result-error';
        resultBox.textContent = '✕ 有一段只填了上班或下班時間，請補齊兩邊，或按該段的 － 移除。';
        return;
      }
      // C4：請假時數負數在送出前（confirm 之前）直接擋下，不用等後端回 bad_leave_hours
      if (leaveHours.value !== '' && Number(leaveHours.value) < 0) {
        resultBox.className = 'result-box show result-error';
        resultBox.textContent = '✕ 請假時數不能是負數，請修正後再送出。';
        return;
      }
      if (periods.length === 0) {
        // 沒填任何上班時段：有選假別＝整天請假（核定 0 小時）；否則就是漏填
        if (!leaveSelect.value) {
          resultBox.className = 'result-box show result-error';
          resultBox.textContent = '✕ 請至少輸入一段上班時間；若是整天請假，請在「請假註記」選假別再送出。';
          return;
        }
        var lmsg = '整天請假：' + emp.name + '\n' + leaveSelect.value
          + (leaveHours.value ? '　' + leaveHours.value + ' 小時' : '')
          + '\n核定時數 0 小時（整天沒上班）\n\n確定送出?';
        if (!window.confirm(lmsg)) return;
      } else {
        // 送出前防呆：算總時數（跨夜比照後端 end<=start 視為隔天）、揪出打反與時段重疊，
        // 用確認框把「核定總時數＋提醒」攤給主管看過再寫入（覆蓋前先確認、把打錯攔在寫入前）。
        var hm2min = function (t) { var a = t.split(':'); return (+a[0]) * 60 + (+a[1]); };
        var segs = periods.map(function (p) {
          var sm = hm2min(p.start), em = hm2min(p.end), overnight = em <= sm;
          if (overnight) em += 1440;
          return { start: p.start, end: p.end, sm: sm, em: em, overnight: overnight };
        });
        var totalH = Math.round(segs.reduce(function (a, s) { return a + (s.em - s.sm) / 60; }, 0) * 100) / 100;

        var warnings = [];
        segs.forEach(function (s) {
          if (s.overnight) warnings.push('・' + s.start + '–' + s.end + ' 會算成跨夜到隔天（' + (Math.round((s.em - s.sm) / 60 * 100) / 100) + ' 小時），若是打錯請改回。');
        });
        if (hasOpenSeg) {
          warnings.push('・這天有打卡段還沒打下班卡，現在核定可能會核不到那一段，且之後補打卡不會自動重算——請同仁立即打卡避免忘刷卡。');
        }
        // C5：只比相鄰兩段會漏報「長段包兩短段」（3 段以上時）；改為維護 runningMaxEnd 的掃描——
        // 依起點排序後，任一段起點 < 目前為止看過的最大終點，就與那個「目前最長」的段標重疊。
        var sorted = segs.slice().sort(function (a, b) { return a.sm - b.sm; });
        var runningMaxEnd = -Infinity;
        var runningMaxSeg = null;
        sorted.forEach(function (s, i) {
          if (i > 0 && s.sm < runningMaxEnd) {
            warnings.push('・' + runningMaxSeg.start + '–' + runningMaxSeg.end + ' 與 ' + s.start + '–' + s.end + ' 時段重疊，會重複計算。');
          }
          if (s.em > runningMaxEnd) {
            runningMaxEnd = s.em;
            runningMaxSeg = s;
          }
        });

        var msg = '即將核定 ' + emp.name + '：\n' + segs.map(function (s) { return s.start + '–' + s.end; }).join('、')
          + '\n核定時數共 ' + totalH + ' 小時';
        if (leaveSelect.value) msg += '\n請假：' + leaveSelect.value + (leaveHours.value ? ' ' + leaveHours.value + ' 小時' : '');
        if (warnings.length) msg += '\n\n⚠ 請再確認：\n' + warnings.join('\n');
        msg += '\n\n確定送出?';
        if (!window.confirm(msg)) return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = '送出中…';
      var approveDate = currentDate; // C1：送出當下鎖定日期，避免回呼觸發時 currentDate 已切到別天
      apiPost({
        action: 'mgr_approve',
        mgr_key: mgrKey,
        date: approveDate,
        emp_id: emp.emp_id,
        periods: periods,
        leave_type: leaveSelect.value,
        leave_hours: leaveSelect.value ? leaveHours.value : '',
      }).then(function (res) {
        submitBtn.disabled = false;
        submitBtn.textContent = '重新送出核定';
        if (!res.ok) {
          resultBox.className = 'result-box show result-error';
          resultBox.textContent = '✕ 核定失敗：' + (res.error || '未知錯誤');
          return;
        }
        delete dayCache[approveDate]; // 核定改了這天的資料 → 清快取，下次切回會抓新的（用送出當下鎖定的日期）
        renderResult(resultBox, res);
        setBadge(res, res.leave_type, res.leave_hours);
      }).catch(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = '重新送出核定';
        resultBox.className = 'result-box show result-error';
        resultBox.textContent = '✕ 連線失敗，請檢查網路後再試。';
      });
    });

    return card;
  }

  function renderEmployees(employees) {
    empListEl.innerHTML = '';
    if (!employees || employees.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'card center-msg';
      empty.textContent = '這天沒有任何同仁打卡紀錄。';
      empListEl.appendChild(empty);
      return;
    }
    employees.forEach(function (emp) { empListEl.appendChild(buildEmployeeCard(emp)); });
  }

  // 日期資料快取：Apps Script 每次請求都要讀 5 張表、有固定延遲，切換日期若每次重打會慢。
  // 只快取「今天之前」的日期（過去資料不會變——除了主管當下核定，核定成功會清掉該日快取）；
  // 今天/未來一律即時抓（會有新打卡）。載入某天時背景預抓前後一天，讓 ‹ › 幾乎瞬間。
  var dayCache = {};      // 'yyyy-mm-dd' -> employees 陣列
  var prefetching = {};   // 進行中的背景預抓，避免同一天重複打

  // C6：「今天」一律以台北時區為準（與後端 todayTaipeiStr 對齊），不用裝置本地時區——
  // 裝置在異地或跨時區時，本地日期可能與台北日期差一天，會讓快取邊界誤判。
  function taipeiTodayStr() {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei' }).format(new Date());
  }
  function cacheable(dateStr) { return !!dateStr && dateStr < taipeiTodayStr(); } // 嚴格早於今天（台北時區）才快取

  // 背景預抓中心日往前 N 天（近一週），讓手機翻閱近日幾乎都命中快取、不用等後端 ~2 秒。
  // Apps Script 每請求固定 ~2 秒，所以循序一次抓一天（近的先），避免手機同時開一堆連線互相拖慢。
  var PREFETCH_PAST_DAYS = 6;

  function prefetchNeighbors(dateStr) {
    var targets = [];
    for (var i = 1; i <= PREFETCH_PAST_DAYS; i++) targets.push(addDaysStr(dateStr, -i)); // 往前近→遠
    targets.push(addDaysStr(dateStr, 1)); // 往後一天（多半是今天/未來，會被 cacheable 擋掉）
    (function next() {
      var d = null;
      while (targets.length) {
        var cand = targets.shift();
        if (cacheable(cand) && !dayCache[cand] && !prefetching[cand]) { d = cand; break; }
      }
      if (!d) return;
      prefetching[d] = true;
      apiPost({ action: 'mgr_day', mgr_key: mgrKey, date: d }).then(function (res) {
        delete prefetching[d];
        if (res && res.ok) dayCache[res.date] = res.employees;
        next();
      }).catch(function () { delete prefetching[d]; next(); });
    })();
  }

  function renderDay(dateStr, employees) {
    loadingCard.style.display = 'none';
    errorCard.style.display = 'none';
    currentDate = dateStr;
    dateInput.value = dateStr;
    renderEmployees(employees);
  }

  /**
   * 待核准裝置區（2026-08-03 新增）。原本核准裝置只能開 Apps Script 編輯器跑函式，
   * 現在主管頁點兩下就好。核准邏輯全在後端 applyDeviceDecision（含「核准只解裝置這關、
   * 店外打的卡仍不入帳」的分流），這裡只負責顯示與送出。
   * 沒有待核准時整區不畫，平常不佔版面；載入失敗也靜默略過（不影響主要的核定功能）。
   */
  function loadPendingDevices() {
    apiPost({ action: 'mgr_pending_devices', mgr_key: mgrKey }).then(function (res) {
      if (!res.ok || !res.pending || !res.pending.length) {
        pendingDevicesEl.innerHTML = '';
        return;
      }
      pendingDevicesEl.innerHTML = '';
      res.pending.forEach(function (g) { pendingDevicesEl.appendChild(buildPendingCard(g)); });
    }).catch(function () { /* 靜默：待核准區失敗不該擋住當日核定 */ });
  }

  function tsLabel(ts) {
    // '2026-08-01T21:43:12+08:00' → '8/1 21:43'
    return parseInt(ts.slice(5, 7), 10) + '/' + parseInt(ts.slice(8, 10), 10) + ' ' + ts.slice(11, 16);
  }

  function buildPendingCard(g) {
    var card = document.createElement('div');
    card.className = 'pd-card';

    var title = document.createElement('div');
    title.className = 'pd-title';
    title.textContent = '⚠ ' + g.name + '　新裝置待核准';
    card.appendChild(title);

    var meta = document.createElement('div');
    meta.className = 'pd-meta';
    var range = g.count > 1 ? (tsLabel(g.first_ts) + ' ～ ' + tsLabel(g.last_ts)) : tsLabel(g.first_ts);
    meta.textContent = g.count + ' 筆待核准打卡・' + range
      + '　最遠 ' + g.max_distance_m + ' 公尺'
      + '\n裝置碼 …' + String(g.device_id).slice(-6);
    meta.style.whiteSpace = 'pre-line';
    card.appendChild(meta);

    // 全部都在範圍內＝人確實在店裡打的，可安心核准；有超出範圍的要主管自己判斷
    if (!g.all_within_range) {
      var warn = document.createElement('div');
      warn.className = 'pd-warn';
      warn.textContent = '有打卡超出門市範圍。核准只會解除「裝置」這一關，超出範圍的那幾筆仍然不會入帳。';
      card.appendChild(warn);
    }

    var actions = document.createElement('div');
    actions.className = 'pd-actions';
    var btnOk = document.createElement('button');
    btnOk.type = 'button';
    btnOk.className = 'pd-approve';
    btnOk.textContent = '核准';
    var btnNo = document.createElement('button');
    btnNo.type = 'button';
    btnNo.className = 'pd-reject';
    btnNo.textContent = '拒絕';
    actions.appendChild(btnOk);
    actions.appendChild(btnNo);
    card.appendChild(actions);

    var result = document.createElement('div');
    result.className = 'pd-result';
    card.appendChild(result);

    function decide(approve) {
      var msg = approve
        ? ('核准 ' + g.name + ' 的新裝置？\n\n這 ' + g.count + ' 筆打卡會開始計入出勤，'
           + '且她之後只能用這個裝置打卡。')
        : ('拒絕 ' + g.name + ' 的新裝置？\n\n這 ' + g.count + ' 筆打卡將不予計入，原本綁定的裝置維持不變。');
      if (!window.confirm(msg + '\n\n確定?')) return;
      btnOk.disabled = true;
      btnNo.disabled = true;
      result.textContent = '處理中…';
      apiPost({
        action: 'mgr_device_decision', mgr_key: mgrKey,
        emp_id: g.emp_id, device_id: g.device_id, approve: approve,
      }).then(function (res) {
        if (!res.ok) {
          btnOk.disabled = false;
          btnNo.disabled = false;
          // no_pending_device＝這批已被別人（或另一個分頁）處理掉了，重新整理就會消失
          result.style.color = '#c22a12';
          result.textContent = res.error === 'no_pending_device'
            ? '✕ 這批待核准已被處理過了，請重新整理頁面。'
            : ('✕ 失敗：' + res.error);
          return;
        }
        result.style.color = '#1a7a3d';
        result.textContent = (approve ? '✓ 已核准' : '✓ 已拒絕') + '，更新 ' + res.changed + ' 筆打卡';
        actions.style.display = 'none';
        // 核准會讓當日打卡狀態改變（pending→ok），清快取讓核定卡片拿到新的打卡段
        dayCache = {};
        if (currentDate) loadDay(currentDate);
      }).catch(function () {
        btnOk.disabled = false;
        btnNo.disabled = false;
        result.style.color = '#c22a12';
        result.textContent = '✕ 連線失敗，請再試一次。';
      });
    }

    btnOk.addEventListener('click', function () { decide(true); });
    btnNo.addEventListener('click', function () { decide(false); });
    return card;
  }

  function loadDay(dateOverride) {
    // 命中快取（過去看過或已預抓的日期）→ 直接畫，不轉圈、不打後端
    if (dateOverride && dayCache[dateOverride]) {
      renderDay(dateOverride, dayCache[dateOverride]);
      prefetchNeighbors(dateOverride);
      return;
    }
    loadingCard.style.display = 'block';
    errorCard.style.display = 'none';
    empListEl.innerHTML = '';
    var payload = { action: 'mgr_day', mgr_key: mgrKey };
    if (dateOverride) payload.date = dateOverride;
    apiPost(payload).then(function (res) {
      if (!res.ok) {
        showError(res.error === 'unauthorized' ? '主管金鑰錯誤，請確認網址是否正確。' : ('讀取失敗：' + res.error));
        return;
      }
      if (cacheable(res.date)) dayCache[res.date] = res.employees;
      renderDay(res.date, res.employees);
      prefetchNeighbors(res.date);
    }).catch(function () {
      loadingCard.style.display = 'none';
      showError('連線失敗，請檢查網路連線後重新整理頁面。');
    });
  }

  dateInput.addEventListener('change', function () {
    if (dateInput.value) loadDay(dateInput.value);
  });
  btnPrevDay.addEventListener('click', function () {
    if (currentDate) loadDay(addDaysStr(currentDate, -1));
  });
  btnNextDay.addEventListener('click', function () {
    if (currentDate) loadDay(addDaysStr(currentDate, 1));
  });
  btnToday.addEventListener('click', function () { loadDay(null); });

  function init() {
    if (!mgrKey) {
      loadingCard.style.display = 'none';
      showError('連結錯誤：找不到主管代碼，請確認網址是否完整。');
      return;
    }
    if (API_URL.indexOf('PASTE_') === 0) {
      loadingCard.style.display = 'none';
      showError('系統尚未設定完成，請聯絡老闆。');
      return;
    }
    // 先抓假別清單與額度，再畫卡片（抓不到就用內建 fallback，不擋值班核定）
    loadLeaveOptions().then(function () { loadDay(null); });
    loadPendingDevices(); // 與當日核定並行載入，失敗不影響主要功能
  }

  init();
})();
</script>
</body>
</html>
