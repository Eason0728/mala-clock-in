<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的薪資 — 麻的小辛辣</title>
<style>
:root{--red:#E8380D;--black:#231815;--gold:#FABE00;--cream:#FFE893;--bg:#faf8f6;--line:#e6e0da;--muted:#8a817a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--black);
 font-size:17px;line-height:1.65;padding-bottom:50px}
/* 桌機開啟時整頁再放大；手機維持流動版面只放大字級，避免爆版 */
@media(min-width:600px){body{zoom:1.2}}
header{background:var(--black);color:#fff;padding:15px 18px;display:flex;align-items:center;gap:10px}
header h1{font-size:17.5px;font-weight:900}header h1 span{color:var(--gold)}
header input{font:inherit;margin-left:auto;padding:5px 8px;border:0;border-radius:5px;background:#3a3330;color:#fff}
main{max-width:560px;margin:0 auto;padding:18px 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
/* 假別額度（2026-08-27）：與打卡頁「我的薪資」同一份資料與規則 */
.lq h4{font-size:15px;margin-bottom:4px}
.lq .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.7}
.lq table{width:100%;border-collapse:collapse;font-size:14px}
.lq td{padding:11px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.lq td.r{text-align:right;white-space:nowrap}
.lq .u{display:block;font-size:12px;color:var(--muted);font-weight:700}
.lq .bar{display:block;width:78px;height:6px;border-radius:4px;background:#ece7e1;overflow:hidden;margin-top:6px}
.lq .bar i{display:block;height:100%;background:#FABE00}
.lq .bar i.hi{background:#E8380D}
.lq .out{color:#c0392b;font-weight:900}
.who{display:flex;justify-content:space-between;align-items:flex-end;
 border-bottom:2px solid var(--black);padding-bottom:11px;margin-bottom:15px}
.who b{font-size:24px}
.who .m{color:var(--muted);font-size:13.5px}
h4{font-size:14.5px;font-weight:900;padding-bottom:5px;border-bottom:2px solid var(--red);margin:18px 0 4px}
h4.d{border-bottom-color:var(--black)}
table{width:100%;border-collapse:collapse}
td{padding:8px 2px;border-bottom:1px dotted var(--line);font-size:15px}
td:last-child{text-align:right;white-space:nowrap}
tr.sum td{font-weight:900;border-bottom:0}
.hrs{display:flex;gap:10px;margin-bottom:4px}
.hrs div{flex:1;background:#f6f2ee;border-radius:9px;padding:11px 13px}
.hrs span{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.hrs b{font-size:22px}
.net{margin-top:20px;background:var(--black);color:#fff;border-radius:10px;padding:16px 20px;
 display:flex;justify-content:space-between;align-items:center}
.net .v{font-size:30px;font-weight:900;color:var(--gold)}
.state{text-align:center;padding:46px 20px;color:var(--muted)}
.state .ic{font-size:34px;margin-bottom:10px}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.8}
</style>
</head>
<body>
<header>
  <h1>麻的<span>小辛辣</span> ｜ 我的薪資</h1>
  <input type="month" id="ym" value="2026-06">
</header>
<main id="app"><div class="card"><div class="state">載入中…</div></div></main>

<script>
/* API 依環境自動判斷：本機留空打 mock；正式站打 Apps Script（GitHub Pages 不收 POST，留空會 405）*/
const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?''
  :'https://script.google.com/macros/s/AKfycbxE4DTz847y0bPvLd4mD_9vBFTe3npmVVYKU1CYgeFcUpAuL4vLIA3rySXSR-2qujdJ0A/exec';
const KEY=new URLSearchParams(location.search).get('k')||'';
const nf=v=>Math.round(v).toLocaleString('zh-TW');
const r2=v=>Math.round(v*100)/100;
const HOURY=['overtime','shortfall_hours','personal_leave','sick_leave','menstrual_leave','disaster_leave','hourly_wage'];

/* 假別額度卡片：資料與規則來自後端 payMyLeaveQuota（＝主管看到的同一份），
   前端只負責排版，不重算任何額度。沒帶這個欄位的舊後端整張不畫。 */
function leaveCard(list){
  if(!list||!list.length) return '';
  const rows=list.map(q=>{
    const cap=q.cap_days, used=q.used_days||0;
    const pct=cap?Math.min(100,Math.round(used/cap*100)):0;
    const bar=(cap!=null&&q.basis!=='event')
      ? `<span class="bar"><i class="${pct>=80?'hi':''}" style="width:${pct}%"></i></span>`:'';
    // 單位統一用時數（Eason 2026-08-27），與打卡頁「我的薪資」同步
    const usedTxt=used?`<b>${r2(q.used_h)}</b> H`:'<span style="color:var(--muted)">未請過</span>';
    let remTxt;
    if(cap==null) remTxt='<span style="color:var(--muted)">無上限</span>';
    else if(q.basis==='event') remTxt=`<span style="color:var(--muted)">每次上限<span class="u">${r2(q.cap_h)} H</span></span>`;
    else if(q.remain_h<0) remTxt=`<span class="out">超出 ${r2(-q.remain_h)} H</span>`;
    else if(q.blocked) remTxt='<span class="out">已用完</span>';
    else remTxt=`<b>${r2(q.remain_h)}</b> H<span class="u">/ 上限 ${r2(q.cap_h)} H</span>`;
    return `<tr><td>${q.name}${bar}</td><td class="r">${usedTxt}</td><td class="r">${remTxt}</td></tr>`;
  }).join('');
  return `<div class="card lq"><h4>我的假別額度</h4>`
    +`<div class="sub">今年（曆年）已請與剩餘。數字來自店長在系統登記的請假紀錄，`
    +`如果和你記得的不一樣，請找店長確認。</div>`
    +`<table><tbody>${rows}</tbody></table></div>`;
}

async function load(){
  const app=document.getElementById('app');
  if(!KEY){app.innerHTML=st('🔒','連結不完整','請用店長給你的專屬打卡連結開啟。');return}
  app.innerHTML='<div class="card"><div class="state">載入中…</div></div>';
  let j;
  try{
    const res=await fetch(API||location.pathname.replace(/[^/]*$/,''),{method:'POST',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'my_payslip',key:KEY,ym:document.getElementById('ym').value})});
    j=await res.json();
  }catch(e){app.innerHTML=st('📡','連不上伺服器','請確認網路後重新整理。');return}

  if(!j.ok){app.innerHTML=st('🔒','無法驗證身分','這個連結可能已失效，請找店長重新取得。');return}
  const lq=leaveCard(j.leave_quota);
  if(!j.ready){app.innerHTML=lq+st('🕒',j.message||'尚未結算','薪資結算後這裡就會顯示明細。');return}

  const r=j.result||j.run, earn=r.earn||[], ded=r.ded||[];
  // 數量單位依項目而定：遲到→分鐘、餐費→天、時數類→H（與 payroll.html 同一套規則）
  const qtyUnit=k=>k==='late_deduct'?' 分鐘':(k==='meal_sub'?' 天':(HOURY.includes(k)||/_leave$/.test(String(k))?'H':''));
  const line=x=>`<tr><td>${x.item_label}${x.qty!=null?` <span style="color:#8a817a;font-size:12px">${r2(x.qty)}${qtyUnit(x.item_key)}${x.rate?' × '+nf(x.rate):''}</span>`:''}</td><td>${nf(x.amount)}</td></tr>`;
  app.innerHTML=`<div class="card">
    <div class="who"><div><b>${j.name}</b><div class="m">${j.ym.replace('-','年')}月薪資</div></div>
      <div class="m" style="text-align:right">發薪日<br>每月 ${j.payday} 日</div></div>
    <div class="hrs">
      <div><span>核定總時數</span><b>${r.total_hours}</b> H</div>
      ${r.support_hours?`<div><span>支援時數</span><b>${r2(r.support_hours)}</b> H</div>`:''}
      ${r.base_hours!=null?`<div><span>基本工時</span><b>${r.base_hours}</b> H</div>`:''}
      ${r.ot_paid_hours?`<div><span>計薪加班</span><b>${r2(r.ot_paid_hours)}</b> H</div>`:''}
      ${j.annual?`<div><span>剩餘特休</span><b>${j.annual.left_h}</b> H</div>`:''}
    </div>
    <h4>加項</h4><table>${earn.map(line).join('')}
      <tr class="sum"><td>應收合計</td><td>${nf(r.gross)}</td></tr></table>
    <h4 class="d">扣項</h4><table>${ded.length?ded.map(line).join(''):'<tr><td colspan="2" style="color:#8a817a">無</td></tr>'}
      <tr class="sum"><td>應付合計</td><td>${nf(r.deduction)}</td></tr></table>
    <div class="net"><div>實付金額</div><div class="v">NT$ ${nf(r.net)}</div></div>
    <div class="foot">如有疑問請於發薪日起 7 日內向店長反映。<br>本頁只顯示你本人的資料。</div>
  </div>`+lq;
}
function st(ic,t,d){return `<div class="card"><div class="state"><div class="ic">${ic}</div>
  <div style="font-weight:900;color:#231815;font-size:16px;margin-bottom:5px">${t}</div><div>${d}</div></div></div>`}
document.getElementById('ym').addEventListener('change',load);
load();
</script>
</body>
</html>
