<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>麻的小辛辣 員工打卡</title>
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<meta name="apple-mobile-web-app-title" content="打卡">
<style>
  :root {
    --brand-red: #E8380D;
    --brand-pink: #EF856D;
    --brand-black: #231815;
    --brand-orange: #F08300;
    --brand-gold: #FABE00;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: radial-gradient(120% 90% at 50% 16%, #c9290b 0%, #a81f08 55%, #8a1906 100%) fixed;
    color: #fff;
    min-height: 100vh;
  }
  /* 背景真實火焰影片（黑底以 screen 混合去除）＋暖色暈影——與績效系統同一套 */
  .fireVid {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center; z-index: 0; pointer-events: none;
    mix-blend-mode: screen; filter: brightness(1.05) saturate(1.05) contrast(1.05);
    opacity: 0.55;
  }
  .scrim {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(85% 74% at 50% 44%, rgba(42,11,3,0) 0%, rgba(34,9,3,.14) 60%, rgba(20,5,1,.4) 100%);
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 28px 20px 40px;
    position: relative;
    z-index: 1;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 26px;
    font-weight: 900;
    margin: 0 0 4px;
    letter-spacing: 2px;
  }
  header p {
    margin: 0;
    opacity: 0.85;
    font-size: 14px;
  }
  .card {
    background: #fff;
    color: var(--brand-black);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  }
  .name-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .name-row .name {
    font-size: 22px;
    font-weight: 700;
  }
  .device-hint {
    font-size: 12px;
    color: #8a6a5f;
    margin-bottom: 10px;
    min-height: 16px;
  }
  .today-list {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 14px;
  }
  .today-list li {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0e6e2;
  }
  .today-list li:last-child { border-bottom: none; }
  .no-events {
    font-size: 14px;
    color: #8a6a5f;
  }
  /* 次要按鈕：回查最近 40 天（沿用卡片內既有的字色與分隔線色，不加新色彩） */
  .recent-toggle {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    font-size: 14px;
    color: #8a6a5f;
    background: none;
    border: 1px solid #f0e6e2;
    border-radius: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .recent-toggle:disabled { opacity: 0.5; }
  .recent-list li {
    gap: 8px;
  }
  .recent-list .day-info { flex: 1; }
  /* 右欄改直向靠右：核定時數在上，遲到/早退標記疊在下一行，
     窄螢幕不會被擠爆（時數與標記各自 nowrap） */
  .recent-list .day-hours {
    white-space: nowrap;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  /* 本月／上月核定時數合計：擺在明細清單上方當摘要，兩欄並排、窄螢幕也放得下 */
  .month-totals {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .month-totals .mt-box {
    flex: 1;
    background: #faf6f4;
    border: 1px solid #f0e6e2;
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }
  .month-totals .mt-label {
    display: block;
    font-size: 12px;
    color: #8a6a5f;
  }
  .month-totals .mt-value {
    display: block;
    margin-top: 2px;
    font-size: 17px;
    font-weight: 700;
    color: #3b2b26;
  }
  /* 待核定提示：沿用 day-mark 的品牌橘當提醒色，不引入新色彩 */
  .month-totals .mt-pending {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    line-height: 1.4;
    color: var(--brand-orange);
  }
  /* 遲到/早退等核定狀態：沿用既有品牌橘當警示，不引入新色彩 */
  .recent-list .day-mark {
    margin-top: 2px;
    font-size: 12px;
    color: var(--brand-orange);
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: auto;
  }
  .btn {
    font-size: 22px;
    font-weight: 900;
    padding: 26px;
    border-radius: 16px;
    border: none;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:disabled { opacity: 0.5; }
  .btn-in { background: var(--brand-orange); }
  .btn-out { background: var(--brand-black); }
  .btn.not-allowed {
    filter: grayscale(1);
    opacity: 0.45;
  }
  .status-box {
    margin-top: 16px;
    padding: 16px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.6;
    display: none;
    /* 失敗訊息會多帶一行「定位可能不準」的提示，用 \n 換行；仍走 textContent 不碰 innerHTML */
    white-space: pre-line;
  }
  .status-box.show { display: block; }
  .status-ok { background: #e6f7ec; color: #1a7a3d; }
  .status-warn { background: #fff6e0; color: #8a6100; }
  .status-error { background: #fdeceb; color: #c22a12; }
  .status-loading { background: rgba(255, 255, 255, 0.9); color: var(--brand-black); }
  .center-msg { text-align: center; padding: 40px 0; }
  /* ── 分頁列（打卡／我的薪資）── */
  .tabbar { display: flex; gap: 8px; margin-bottom: 20px; }
  .tabbar .tab { flex: 1; border: 0; border-radius: 12px; padding: 12px 0; font: inherit;
    font-size: 16px; font-weight: 800; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; transition: .15s; }
  .tabbar .tab.on { background: var(--brand-gold); color: var(--brand-black); box-shadow: 0 4px 14px rgba(250,190,0,.3); }
  /* ── 我的薪資分頁 ── */
  .pay-monthcard { display: flex; align-items: center; gap: 12px; }
  .pay-mlabel { font-size: 15px; font-weight: 800; color: var(--brand-black); }
  #payYm { font: inherit; font-size: 18px; font-weight: 800; border: 1px solid #e6e0da;
    border-radius: 8px; padding: 8px 10px; margin-left: auto; color: var(--brand-black); }
  #payView .who { display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 2px solid var(--brand-black); padding-bottom: 11px; margin-bottom: 14px; }
  #payView .who b { font-size: 23px; }
  #payView .who .m { color: #8a817a; font-size: 13px; text-align: right; }
  #payView .hrs { display: flex; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  #payView .hrs div { flex: 1; min-width: 120px; background: #f6f2ee; border-radius: 10px; padding: 11px 13px; }
  #payView .hrs span { display: block; font-size: 12.5px; color: #8a817a; font-weight: 700; }
  #payView .hrs b { font-size: 21px; }
  #payView h4 { font-size: 15px; font-weight: 900; padding-bottom: 5px;
    border-bottom: 2px solid var(--brand-red); margin: 18px 0 4px; }
  #payView h4.d { border-bottom-color: var(--brand-black); }
  #payView table { width: 100%; border-collapse: collapse; }
  #payView td { padding: 8px 2px; border-bottom: 1px dotted #e6e0da; font-size: 15px; color: var(--brand-black); }
  #payView td:last-child { text-align: right; white-space: nowrap; }
  #payView tr.sum td { font-weight: 900; border-bottom: 0; }
  #payView .net { margin-top: 20px; background: var(--brand-black); color: #fff; border-radius: 12px;
    padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
  #payView .net .v { font-size: 28px; font-weight: 900; color: var(--brand-gold); }
  #payView .pfoot { font-size: 12.5px; color: #8a817a; text-align: center; margin-top: 16px; line-height: 1.8; }
  #payView .pstate { text-align: center; padding: 40px 16px; color: #8a817a; }
  #payView .pstate .ic { font-size: 34px; margin-bottom: 10px; }
  #payView .pstate .t { font-weight: 900; color: var(--brand-black); font-size: 17px; margin-bottom: 5px; }

  /* ── 天氣動態背景 ─────────────────────────────────────────────
     依門市當下的天氣切換情境：晴天出太陽、雨天下雨、雷雨加閃電、
     陰天／起霧飄雲、夜晚換月亮與星星。火焰底圖保留，只是依天氣調亮暗。
     抓不到天氣資料就完全不套用，畫面維持原本的樣子。 */
  .fireVid { transition: opacity 1.6s ease; }
  .wx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

  #wxCanvas { opacity: 0; transition: opacity 1.6s ease; }
  body.wx-on #wxCanvas { opacity: 1; }

  /* 全畫面色調：雨天壓成冷色、晴天鋪暖光、陰霧轉灰 */
  .wxTint { background: transparent; transition: background 1.6s ease; }
  body.wx-clear.wx-day .wxTint  { background: radial-gradient(120% 82% at 80% 0%, rgba(255,214,110,.34) 0%, rgba(255,160,40,.10) 42%, rgba(255,140,20,0) 72%); }
  body.wx-cloudy.wx-day .wxTint { background: radial-gradient(120% 82% at 80% 0%, rgba(255,214,110,.20) 0%, rgba(120,110,105,.16) 46%, rgba(90,85,80,.24) 100%); }
  body.wx-overcast .wxTint { background: linear-gradient(180deg, rgba(104,104,110,.44) 0%, rgba(62,62,68,.52) 100%); }
  body.wx-fog .wxTint      { background: linear-gradient(180deg, rgba(176,174,176,.52) 0%, rgba(138,136,140,.62) 100%); }
  body.wx-snow .wxTint     { background: linear-gradient(180deg, rgba(26,46,78,.34) 0%, rgba(16,30,56,.44) 100%); }
  body.wx-rain .wxTint     { background: linear-gradient(180deg, rgba(10,28,52,.46) 0%, rgba(6,18,36,.56) 100%); }
  body.wx-storm .wxTint    { background: linear-gradient(180deg, rgba(6,18,38,.58) 0%, rgba(3,10,24,.66) 100%); }

  /* 夜間再壓一層深色（與天氣分開，兩者可疊加） */
  .wxNight { background: linear-gradient(180deg, rgba(3,8,22,.52) 0%, rgba(2,5,14,.68) 100%); opacity: 0; transition: opacity 1.6s ease; }
  body.wx-night .wxNight { opacity: 1; }

  /* 太陽：光暈圓盤＋緩慢旋轉的光芒 */
  .wxSun, .wxMoon { position: absolute; opacity: 0; transition: opacity 1.8s ease; }
  body.wx-sun .wxSun { opacity: 1; }
  body.wx-sun.wx-cloudy .wxSun { opacity: .55; }
  body.wx-moon .wxMoon { opacity: 1; }
  .wxSun { top: -84px; right: -70px; width: 320px; height: 320px; }
  .wxSun .rays {
    position: absolute; inset: 0; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,238,175,.40) 0deg 4deg, rgba(255,238,175,0) 4deg 20deg);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,.95) 20%, rgba(0,0,0,.45) 44%, rgba(0,0,0,0) 70%);
            mask-image: radial-gradient(circle, rgba(0,0,0,.95) 20%, rgba(0,0,0,.45) 44%, rgba(0,0,0,0) 70%);
    animation: wxSpin 120s linear infinite;
  }
  .wxSun .disc {
    position: absolute; inset: 104px; border-radius: 50%;
    background: radial-gradient(circle, #fffdf0 0%, #ffe98e 40%, rgba(255,196,52,.62) 66%, rgba(255,170,30,0) 78%);
    box-shadow: 0 0 70px 30px rgba(255,196,60,.26);
    animation: wxBreathe 7s ease-in-out infinite;
  }
  /* 月亮：夜間取代太陽 */
  .wxMoon { top: 42px; right: 34px; width: 76px; height: 76px; }
  .wxMoon .disc {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 36% 34%, #ffffff 0%, #f4f7ff 44%, #dbe4f6 68%, rgba(202,216,242,.34) 84%, rgba(180,200,235,0) 100%);
    box-shadow: 0 0 34px 10px rgba(200,220,255,.30), 0 0 96px 34px rgba(140,175,255,.16);
    animation: wxBreathe 9s ease-in-out infinite;
  }

  /* 雲／霧：三片模糊雲團橫向飄移 */
  .wxClouds { position: absolute; inset: 0; opacity: 0; transition: opacity 1.8s ease; }
  body.wx-cloudy .wxClouds { opacity: .62; }
  body.wx-overcast .wxClouds, body.wx-rain .wxClouds, body.wx-snow .wxClouds { opacity: .82; }
  body.wx-storm .wxClouds { opacity: .9; }
  body.wx-fog .wxClouds { opacity: 1; }
  .wxClouds i {
    position: absolute; left: 0; display: block; border-radius: 50%; will-change: transform;
    background: radial-gradient(closest-side, rgba(255,255,255,.82) 0%, rgba(238,232,230,.42) 56%, rgba(232,226,224,0) 100%);
    filter: blur(12px); animation: wxDrift linear infinite;
  }
  .wxClouds i::before, .wxClouds i::after {   /* 兩球凸起，才像雲不像一團霧 */
    content: ''; position: absolute; border-radius: 50%; background: inherit;
  }
  .wxClouds i::before { left: 12%; top: -32%; width: 48%; height: 88%; }
  .wxClouds i::after  { right: 10%; top: -20%; width: 38%; height: 74%; }
  .wxClouds i:nth-child(1) { top: 3%;  width: 58vw; height: 20vh; animation-duration: 82s;  animation-delay: -14s; }
  .wxClouds i:nth-child(2) { top: 21%; width: 44vw; height: 15vh; animation-duration: 108s; animation-delay: -62s; opacity: .8; }
  .wxClouds i:nth-child(3) { top: 44%; width: 72vw; height: 26vh; animation-duration: 140s; animation-delay: -34s; opacity: .6; }
  /* 起霧時改成貼地的大片灰白霧氣 */
  body.wx-fog .wxClouds i {
    filter: blur(34px);
    background: radial-gradient(closest-side, rgba(226,225,226,.9) 0%, rgba(206,204,206,.5) 58%, rgba(200,199,201,0) 100%);
  }
  body.wx-fog .wxClouds i:nth-child(1) { top: 12%; width: 118vw; height: 42vh; }
  body.wx-fog .wxClouds i:nth-child(2) { top: 40%; width: 96vw;  height: 38vh; }
  body.wx-fog .wxClouds i:nth-child(3) { top: 64%; width: 128vw; height: 46vh; }

  /* 雷雨閃電 */
  .wxFlash { background: #fff; opacity: 0; }
  .wxFlash.on { animation: wxFlash 900ms ease-out; }

  /* 火焰底圖依天氣調整亮度（雨夜最暗、晴天最亮） */
  body.wx-clear.wx-day .fireVid  { opacity: .62; }
  body.wx-cloudy.wx-day .fireVid { opacity: .46; }
  body.wx-overcast .fireVid, body.wx-fog .fireVid { opacity: .34; }
  body.wx-snow .fireVid  { opacity: .30; }
  body.wx-rain .fireVid  { opacity: .26; }
  body.wx-storm .fireVid { opacity: .20; }
  body.wx-night.wx-clear .fireVid, body.wx-night.wx-cloudy .fireVid { opacity: .44; }
  body.wx-night.wx-rain .fireVid  { opacity: .20; }
  body.wx-night.wx-storm .fireVid { opacity: .16; }

  @keyframes wxSpin { to { transform: rotate(360deg); } }
  @keyframes wxBreathe { 0%, 100% { transform: scale(1); opacity: .94; } 50% { transform: scale(1.045); opacity: 1; } }
  @keyframes wxDrift { from { transform: translate3d(-50vw, 0, 0); } to { transform: translate3d(120vw, 0, 0); } }
  @keyframes wxFlash { 0% { opacity: 0; } 4% { opacity: .5; } 10% { opacity: .06; } 16% { opacity: .38; } 26% { opacity: 0; } 100% { opacity: 0; } }

  /* 使用者在系統設定關閉動畫時：只留靜態畫面，不做動畫 */
  @media (prefers-reduced-motion: reduce) {
    .wxSun .rays, .wxSun .disc, .wxMoon .disc, .wxClouds i, .wxFlash.on { animation: none; }
    .wxClouds i:nth-child(1) { transform: translate3d(2vw, 0, 0); }
    .wxClouds i:nth-child(2) { transform: translate3d(44vw, 0, 0); }
    .wxClouds i:nth-child(3) { transform: translate3d(18vw, 0, 0); }
  }
</style>
</head>
<body>
<video class="fireVid" src="assets/fire.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
<div class="scrim" aria-hidden="true"></div>
<div class="wx wxSky" aria-hidden="true">
  <div class="wxClouds"><i></i><i></i><i></i></div>
</div>
<div class="wx wxTint" aria-hidden="true"></div>
<div class="wx wxNight" aria-hidden="true"></div>
<div class="wx wxLights" aria-hidden="true">
  <div class="wxSun"><span class="rays"></span><span class="disc"></span></div>
  <div class="wxMoon"><span class="disc"></span></div>
</div>
<canvas class="wx" id="wxCanvas" aria-hidden="true"></canvas>
<div class="wx wxFlash" aria-hidden="true"></div>
<div class="container">
  <header>
    <h1>麻的🔥小辛辣</h1>
    <p>員工專區</p>
  </header>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-view="clock" type="button">🕐 打卡</button>
    <button class="tab" data-view="pay" type="button">💰 我的薪資</button>
  </nav>

  <div id="clockView">
  <div id="loadingCard" class="card center-msg">載入中…</div>

  <div id="mainCard" class="card" style="display:none;">
    <div class="name-row">
      <span class="name" id="empName">—</span>
    </div>
    <div class="device-hint" id="deviceHint"></div>
    <ul class="today-list" id="todayList"></ul>
    <div class="no-events" id="noEvents" style="display:none;">今天還沒有打卡紀錄</div>
    <div class="no-events" id="todayHours"></div>
    <button class="recent-toggle" id="btnRecent" type="button">查看最近 40 天</button>
    <div class="month-totals" id="monthTotals" style="display:none;"></div>
    <ul class="today-list recent-list" id="recentList" style="display:none;"></ul>
  </div>

  <div id="errorCard" class="card center-msg" style="display:none; color:#c22a12;"></div>

  <div class="btn-group" id="btnGroup" style="display:none;">
    <button class="btn btn-in" id="btnIn" type="button">上班打卡</button>
    <button class="btn btn-out" id="btnOut" type="button">下班打卡</button>
  </div>

  <div class="status-box" id="statusBox"></div>
  </div><!-- /clockView -->

  <div id="payView" style="display:none;">
    <div class="card pay-monthcard">
      <span class="pay-mlabel">薪資月份</span>
      <input type="month" id="payYm">
    </div>
    <div id="paySlip"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var API_URL = 'https://script.google.com/macros/s/AKfycbxE4DTz847y0bPvLd4mD_9vBFTe3npmVVYKU1CYgeFcUpAuL4vLIA3rySXSR-2qujdJ0A/exec';

  function qs(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  var isLocalHost = ['localhost', '127.0.0.1'].indexOf(window.location.hostname) !== -1;
  if (isLocalHost) {
    var apiOverride = qs('api');
    if (apiOverride) API_URL = apiOverride;
  }

  var key = qs('k');

  var DEVICE_KEY = 'mala_clock_device';
  function fallbackUuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0;
      var v = c === 'x' ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }
  function getDeviceId() {
    var id = localStorage.getItem(DEVICE_KEY);
    if (!id) {
      id = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : fallbackUuid();
      localStorage.setItem(DEVICE_KEY, id);
    }
    return id;
  }
  var deviceId = getDeviceId();

  var loadingCard = document.getElementById('loadingCard');
  var mainCard = document.getElementById('mainCard');
  var errorCard = document.getElementById('errorCard');
  var btnGroup = document.getElementById('btnGroup');
  var empNameEl = document.getElementById('empName');
  var deviceHintEl = document.getElementById('deviceHint');
  var todayListEl = document.getElementById('todayList');
  var noEventsEl = document.getElementById('noEvents');
  var todayHoursEl = document.getElementById('todayHours');
  var statusBox = document.getElementById('statusBox');
  var btnIn = document.getElementById('btnIn');
  var btnOut = document.getElementById('btnOut');
  var btnRecent = document.getElementById('btnRecent');
  var recentListEl = document.getElementById('recentList');
  var monthTotalsEl = document.getElementById('monthTotals');

  function showError(msg) {
    loadingCard.style.display = 'none';
    mainCard.style.display = 'none';
    btnGroup.style.display = 'none';
    errorCard.style.display = 'block';
    errorCard.textContent = msg;
  }

  function typeLabel(t) { return t === 'in' ? '上班' : '下班'; }
  function statusLabel(s) {
    if (s === 'ok') return '正常';
    if (s === 'pending_device_approval') return '待核准';
    if (s === 'rejected_out_of_range') return '超出範圍';
    if (s === 'rejected_device') return '裝置被拒';
    if (s === 'rejected_duplicate') return '重複打卡';
    return s;
  }

  // 目前不允許的打卡型別（'in'/'out'/null）。由伺服器 whoami 的 last_counted
  // （12 小時回看視窗，跨日也算）決定，不要自己從 today_events 算。
  var blockedType = null;

  function duplicateMessage(lastType) {
    return lastType === 'in'
      ? '⚠ 已打過上班卡，下一筆請打下班卡'
      : '⚠ 已打過下班卡，下一筆請打上班卡';
  }

  // 打卡沒成功時一律顯示這一句（Eason 2026-08-03 指定的統一措辭）。
  // 涵蓋所有失敗原因：超出範圍、新裝置待核准、重複打卡、定位失敗、沒網路、逾時、伺服器異常。
  // ⚠ 措辭要對「所有」情況都成立，所以刻意先叫她看今日紀錄再決定要不要重打——
  //   有些情況（新裝置待核准、伺服器有收到但回應異常）其實已經記錄下來了，
  //   直接叫她重打會產生重複卡；今日紀錄會顯示「待核准」等狀態，看了就知道。
  var CLOCK_FAIL_MSG = '⚠ 打卡未完成。請看下方今日紀錄確認，若沒有出現請再打一次；仍然不行請告知主管。';

  // 被判「超出範圍」而且手機回報的定位誤差很大時，多附這一段（2026-08-19 新增）。
  // 起因：王禹婕一天按了 12 次都被擋，畫面只寫「超出範圍」，她不知道該怎麼辦——
  // 實際上她人在店裡，是手機改用 Wi-Fi 定位、位置飄到店北邊 80 公尺。
  // ⚠ 只在「超出範圍 ＋ 定位誤差大」時出現。定位很準卻在店外（例如在家打卡）維持原本的統一訊息，
  //   不要給不在店裡的人一個現成的藉口。門檻由後端 low_accuracy 決定，不寫死在前端。
  function accuracyHint(res) {
    if (!res || res.status !== 'rejected_out_of_range' || !res.low_accuracy) return '';
    var m = isFinite(res.accuracy_m) ? Math.round(res.accuracy_m) : null;
    return '\n\n📍 這次定位可能不準' + (m ? '（誤差約 ±' + m + ' 公尺）' : '') +
      '：請關掉 Wi-Fi、或確認手機「精確位置」已開啟，再打一次。';
  }

  function updateButtonStates(lastCounted) {
    blockedType = lastCounted ? lastCounted.type : null;
    btnIn.classList.toggle('not-allowed', blockedType === 'in');
    btnOut.classList.toggle('not-allowed', blockedType === 'out');
  }

  function renderTodayEvents(events) {
    todayListEl.innerHTML = '';
    if (!events || events.length === 0) {
      noEventsEl.style.display = 'block';
      return;
    }
    noEventsEl.style.display = 'none';
    events.forEach(function (e) {
      var li = document.createElement('li');
      var time = (e.ts || '').substring(11, 16);
      var left = document.createElement('span');
      left.textContent = typeLabel(e.type) + ' ' + time;
      var right = document.createElement('span');
      // 超出範圍那幾筆附上定位誤差，讓同仁分得出「定位不準」還是「真的不在店裡」
      var acc = (e.status === 'rejected_out_of_range' && e.low_accuracy && isFinite(e.accuracy_m))
        ? '（誤差±' + Math.round(e.accuracy_m) + 'm）' : '';
      right.textContent = statusLabel(e.status) + acc;
      li.appendChild(left);
      li.appendChild(right);
      todayListEl.appendChild(li);
    });
  }

  // 今日時數摘要（whoami 的 today_hours：{reference, approved, working_since}）。
  // 有 working_since→仍在上班中，只列已完成時段的時數；無→今日已無進行中的班段。
  // 只顯示參考時數，不顯示核定（Eason 2026-07-13 定案：核定改由值班主管在 manager.html
  // 輸入實際時段核定，員工打卡頁一律顯示「參考」；後端仍回 approved 供月表等其他用途）。
  function renderTodayHours(h) {
    if (!h) { todayHoursEl.textContent = ''; return; }
    if (h.working_since) {
      todayHoursEl.textContent = '上班中（' + h.working_since + ' 起）・已完成時段參考 ' + h.reference + ' 小時';
    } else {
      todayHoursEl.textContent = '今日參考時數：' + h.reference + ' 小時';
    }
  }

  // fetch 逾時（毫秒）。⚠ 沒有這道防線時，網路卡住的請求會無限期不 settle：
  // 打卡畫面永遠停在「送出打卡中…」，且 setBusy(true) 讓兩顆按鈕一直停用、
  // 同仁連重打都不行（2026-08-03 林宸妤實際遇到，上班卡整筆遺失）。
  // Apps Script 正常回應約 2–3 秒，20 秒已非常寬鬆。
  var API_TIMEOUT_MS = 20000;

  function apiPost(payload) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timedOut = false;
    var timer = setTimeout(function () {
      timedOut = true;
      if (ctrl) ctrl.abort();
    }, API_TIMEOUT_MS);

    var opts = {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload),
    };
    if (ctrl) opts.signal = ctrl.signal;

    // 三種失敗要用不同措辭，因為「這次到底送出去了沒」不一樣，講錯會害同仁重複打卡或漏打：
    //   ① 逾時（我們主動 abort）：連線是通的，請求可能已抵達伺服器 → 講「可能沒送出，請看今日紀錄」
    //   ② fetch 本身失敗（沒網路／Wi-Fi 斷線／連線被拒，TypeError）：根本沒送出去 → 可放心叫她直接重打
    //      （原樣顯示會是英文 "Failed to fetch"，同仁看不懂，2026-08-03 Eason 要求改中文）
    //   ③ 回應不是 JSON（伺服器有回應但內容異常）：請求已經到了伺服器 → 不可說「沒送出」
    return fetch(API_URL, opts)
      .then(
        function (res) {
          return res.json().catch(function () {
            throw new Error('伺服器回應異常，這次打卡可能已經送出。請看下方今日紀錄確認，不要急著重打。');
          });
        },
        function (err) {
          if (timedOut) throw new Error('連線逾時，這次打卡可能沒有送出。請看下方今日紀錄確認，若沒有出現請再打一次。');
          throw new Error('連不上伺服器，這次打卡沒有送出。請確認手機網路連線後再打一次。');
        }
      )
      .then(function (v) { clearTimeout(timer); return v; }, function (e) { clearTimeout(timer); throw e; });
  }

  // ---- 最近 40 天回查（my_recent）：點按鈕才 fetch，可展開/收合 ----
  var WEEKDAY_ZH = ['日', '一', '二', '三', '四', '五', '六'];
  var recentOpen = false;
  var recentLoaded = false; // 打卡成功後設回 false，下次展開重新抓

  function weekdayZh(dateStr) {
    return WEEKDAY_ZH[new Date(dateStr + 'T00:00:00Z').getUTCDay()];
  }

  // 班段文字照月表慣例：跨夜段加 (+1)、缺的一端顯示「？」（如 17:05–？）
  function segmentText(s) {
    return (s.in || '？') + '–' + (s.out || '？') + (s.cross ? '(+1)' : '');
  }

  // 本月／上月核定時數合計。後端 month_totals 是掃 approved 分頁全部日期算的（與月表同源），
  // 不是把 days 加總——40 天視窗蓋不滿整個上月。舊後端沒有這個欄位時整塊不顯示（優雅降級）。
  function renderMonthTotals(totals) {
    monthTotalsEl.innerHTML = '';
    if (!totals || !totals.current || !totals.previous) {
      monthTotalsEl.style.display = 'none';
      return;
    }
    [
      { label: '本月合計', t: totals.current },
      { label: '上月合計', t: totals.previous },
    ].forEach(function (item) {
      var box = document.createElement('div');
      box.className = 'mt-box';
      var label = document.createElement('span');
      label.className = 'mt-label';
      // 標題帶月份，避免月初剛換月時看不出算的是哪個月
      label.textContent = item.label + '（' + parseInt(item.t.ym.slice(5, 7), 10) + ' 月）';
      var value = document.createElement('span');
      value.className = 'mt-value';
      // 0 是合法值（該月尚無核定或全天請假），不可用 falsy 判斷
      var h = (item.t.hours === null || item.t.hours === undefined) ? 0 : item.t.hours;
      value.textContent = h + ' 小時';
      box.appendChild(label);
      box.appendChild(value);
      // 合計只加總「已核定」的日子；有上班但主管還沒核的天數在此揭露，
      // 免得同仁以為時數被少算（Eason 2026-07-31 指定）。0 天不顯示，避免雜訊。
      var pending = item.t.pending_days;
      if (pending) {
        var note = document.createElement('span');
        note.className = 'mt-pending';
        note.textContent = '尚有 ' + pending + ' 天待核定';
        box.appendChild(note);
      }
      monthTotalsEl.appendChild(box);
    });
    monthTotalsEl.style.display = 'flex';
  }

  function renderRecentDays(days) {
    recentListEl.innerHTML = '';
    if (!days || days.length === 0) {
      var empty = document.createElement('li');
      empty.textContent = '最近 40 天沒有打卡紀錄';
      recentListEl.appendChild(empty);
      return;
    }
    days.forEach(function (d) {
      var li = document.createElement('li');
      var info = document.createElement('span');
      info.className = 'day-info';
      var md = parseInt(d.date.slice(5, 7), 10) + '/' + parseInt(d.date.slice(8, 10), 10);
      var segs = d.segments.map(segmentText).join('、');
      info.textContent = md + '（' + weekdayZh(d.date) + '）　' + segs
        + (d.notes && d.notes.length ? '　' + d.notes.join('、') : '');
      var hours = document.createElement('span');
      hours.className = 'day-hours';
      // 只顯示核定（Eason 2026-07-15 定案）：核定＝值班主管輸入之實際時段總長，是計薪依據；
      // 後端 my_recent 的 d.approved 已改讀 approved 分頁（不再是 15 分鐘取整的舊定義）。
      // 無核定紀錄→「待核定」（月表同款措辭）；忘刷卡當天不再空白——主管核定後就看得到時數，
      // 那正是最需要看核定的情境。d.approved 為 0 是合法值（全天請假），故不可用 falsy 判斷。
      var hoursText = (d.approved === null || d.approved === undefined)
        ? '待核定'
        : '核定 ' + d.approved;
      hours.textContent = hoursText;
      // 遲到/早退等核定狀態（後端 approved_status＝主管核定當下算的 status_text，與月表狀態欄同源）。
      // 「正常」不顯示以免雜訊；有異常才追加一段醒目小字（Eason 2026-07-15 要求顯示遲到分鐘）。
      if (d.approved_status && d.approved_status !== '正常') {
        var mark = document.createElement('span');
        mark.className = 'day-mark';
        mark.textContent = d.approved_status;
        hours.appendChild(mark);
      }
      li.appendChild(info);
      li.appendChild(hours);
      recentListEl.appendChild(li);
    });
  }

  function setRecentClosed() {
    recentOpen = false;
    recentListEl.style.display = 'none';
    monthTotalsEl.style.display = 'none'; // 合計跟著明細一起收合
    btnRecent.textContent = '查看最近 40 天';
  }

  /** 展開明細（含合計）——首次載入與再次展開共用，避免兩處各寫一份顯示邏輯。 */
  function setRecentOpen() {
    recentOpen = true;
    recentListEl.style.display = 'block';
    // 合計整塊有內容才顯示（舊後端無 month_totals 時 renderMonthTotals 已清空並隱藏）
    if (monthTotalsEl.children.length) monthTotalsEl.style.display = 'flex';
    btnRecent.textContent = '收合';
  }

  btnRecent.addEventListener('click', function () {
    if (recentOpen) {
      setRecentClosed();
      return;
    }
    if (recentLoaded) {
      setRecentOpen();
      return;
    }
    btnRecent.disabled = true;
    btnRecent.textContent = '載入中…';
    apiPost({ action: 'my_recent', key: key, device_id: deviceId })
      .then(function (res) {
        btnRecent.disabled = false;
        if (!res.ok) {
          setRecentClosed();
          showStatus('status-error', '✕ 查詢失敗，請重新整理頁面後再試。');
          return;
        }
        recentLoaded = true;
        renderMonthTotals(res.month_totals);
        renderRecentDays(res.days);
        setRecentOpen();
      })
      .catch(function () {
        btnRecent.disabled = false;
        setRecentClosed();
        showStatus('status-error', '✕ 連線失敗，請檢查網路後再試。');
      });
  });

  function init() {
    if (!key) {
      showError('連結錯誤：找不到員工代碼，請確認打卡連結是否完整。');
      return;
    }
    if (API_URL.indexOf('PASTE_') === 0) {
      showError('系統尚未設定完成，請聯絡老闆。');
      return;
    }
    // 立即顯示外殼與打卡按鈕，不等 whoami（後端約 2.5 秒）——打卡本身只需 key＋GPS＋裝置碼，
    // 伺服器端有重複打卡防護當安全網，員工一開 app 就能按。姓名／今日紀錄／按鈕灰階待 whoami 補上。
    loadingCard.style.display = 'none';
    mainCard.style.display = 'block';
    btnGroup.style.display = 'flex';
    empNameEl.textContent = '載入中…';
    apiPost({ action: 'whoami', key: key, device_id: deviceId })
      .then(function (res) {
        if (!res.ok) {
          showError('找不到這個打卡連結對應的員工，請確認連結是否正確。');
          return;
        }
        empNameEl.textContent = res.name;
        if (res.device_state === 'unbound') {
          deviceHintEl.textContent = '本裝置尚未綁定，首次打卡將自動綁定。';
        } else if (res.device_state === 'mismatch') {
          deviceHintEl.textContent = '這不是你平常綁定的裝置，打卡將送出待核准。';
        } else {
          deviceHintEl.textContent = '';
        }
        renderTodayEvents(res.today_events);
        renderTodayHours(res.today_hours);
        updateButtonStates(res.last_counted);
      })
      .catch(function () {
        showError('連線失敗，請檢查網路連線後重新整理頁面。');
      });
  }

  function setBusy(busy) {
    btnIn.disabled = busy;
    btnOut.disabled = busy;
  }

  function showStatus(cls, text) {
    statusBox.className = 'status-box show ' + cls;
    statusBox.textContent = text;
  }

  // 本機測試限定：?loc=store 模擬人在店內、?loc=away 模擬人在外地，正式環境不生效
  var FAKE_LOCATIONS = {
    store: { latitude: 24.7840945, longitude: 121.0157448 }, // 2026-07-13 校正座標，與後端 CONFIG 對齊
    away: { latitude: 25.0330, longitude: 121.5654 },
  };

  function getPosition() {
    if (isLocalHost && FAKE_LOCATIONS[qs('loc')]) {
      // localhost 限定：acc=120 可模擬「定位誤差 120 公尺」，用來測「定位可能不準」那段提示
      var fakeAcc = parseFloat(qs('acc'));
      var c = FAKE_LOCATIONS[qs('loc')];
      return Promise.resolve({
        coords: isFinite(fakeAcc) ? { latitude: c.latitude, longitude: c.longitude, accuracy: fakeAcc } : c,
      });
    }
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) {
        reject(new Error('此裝置不支援定位功能，無法打卡。'));
        return;
      }
      navigator.geolocation.getCurrentPosition(
        function (pos) { resolve(pos); },
        function (err) {
          if (err.code === err.PERMISSION_DENIED) {
            reject(new Error('定位權限被拒絕，請到手機設定開啟此頁面的定位權限後再試一次。'));
          } else if (err.code === err.TIMEOUT) {
            reject(new Error('定位逾時，請確認 GPS 訊號後重試。'));
          } else {
            reject(new Error('定位失敗，請重試。'));
          }
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  }

  function doClock(type) {
    if (blockedType === type) {
      // 前端先擋下的重複打卡（不打 API）。這句保留「已打過上班/下班卡」的具體說法：
      // 它不是「打卡沒成功」，而是「這一筆本來就不該打」，用統一失敗句會叫她再打一次、更混亂。
      showStatus('status-warn', duplicateMessage(blockedType));
      return;
    }
    setBusy(true);
    showStatus('status-loading', '定位中…');
    getPosition()
      .then(function (pos) {
        showStatus('status-loading', '送出打卡中…');
        return apiPost({
          action: 'clock',
          key: key,
          type: type,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          // 手機回報的定位誤差（公尺）。用來分辨「定位準、人真的在店外」與「定位根本不準」。
          // 舊後端收到多的欄位會直接忽略，不影響打卡，所以前後端部署順序不互卡。
          accuracy: pos.coords && isFinite(pos.coords.accuracy) ? pos.coords.accuracy : null,
          device_id: deviceId,
        });
      })
      .then(function (res) {
        // 只分「成功」與「沒成功」兩種（Eason 2026-08-03 指定：不管什麼狀況，
        // 只要沒打卡成功就跳同一句提醒，不要讓同仁去讀一堆不同的錯誤訊息）。
        if (res.ok && res.status === 'ok') {
          showStatus('status-ok', '✓ 打卡成功　' + (res.ts || '').substring(11, 16));
        } else {
          showStatus('status-warn', CLOCK_FAIL_MSG + accuracyHint(res));
        }
        apiPost({ action: 'whoami', key: key, device_id: deviceId }).then(function (r) {
          if (r.ok) {
            renderTodayEvents(r.today_events);
            renderTodayHours(r.today_hours);
            updateButtonStates(r.last_counted);
          }
        });
        // 剛打了卡，快取的最近 40 天已過期：展開中就立刻重抓，收合中則下次展開再抓
        recentLoaded = false;
        if (recentOpen) {
          apiPost({ action: 'my_recent', key: key, device_id: deviceId }).then(function (r2) {
            if (r2.ok) {
              recentLoaded = true;
              renderRecentDays(r2.days);
            }
          });
        }
      })
      .catch(function () {
        // 定位失敗、沒網路、逾時、伺服器異常 → 一律同一句（不再區分原因）
        showStatus('status-warn', CLOCK_FAIL_MSG);
        // 主動刷新今日紀錄：逾時/異常不代表沒進伺服器，讓她當場看得到到底有沒有成功，
        // 不用自己猜。這通失敗就算了（本來就是連線有問題），不再另外報錯蓋掉上面的訊息。
        apiPost({ action: 'whoami', key: key, device_id: deviceId }).then(function (r) {
          if (r.ok) {
            renderTodayEvents(r.today_events);
            renderTodayHours(r.today_hours);
            updateButtonStates(r.last_counted);
          }
        }).catch(function () {});
      })
      .then(function () { setBusy(false); }, function () { setBusy(false); });
  }

  btnIn.addEventListener('click', function () { doClock('in'); });
  btnOut.addEventListener('click', function () { doClock('out'); });

  // 背景火焰影片（純視覺，不影響打卡）：
  // 系統設「減少動態」→ 暫停；否則若 autoplay 被瀏覽器政策擋下，主動嘗試播放，
  // 再不行就等第一次觸碰畫面（使用者手勢）補播——涵蓋 LINE 內建瀏覽器等嚴格環境。
  (function () {
    var fv = document.querySelector('.fireVid');
    if (!fv) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      fv.pause(); fv.removeAttribute('autoplay');
      return;
    }
    var tryPlay = function () { var p = fv.play(); if (p && p.catch) p.catch(function () {}); };
    tryPlay();
    document.addEventListener('touchstart', tryPlay, { once: true });
    document.addEventListener('click', tryPlay, { once: true });
  })();

  // ══════ 我的薪資分頁（與打卡共用同一把 key，同仁不必另外領連結）══════
  var tabbar = document.getElementById('tabbar');
  var clockView = document.getElementById('clockView');
  var payView = document.getElementById('payView');
  var payYm = document.getElementById('payYm');
  var paySlipEl = document.getElementById('paySlip');
  var payLoadedYm = null;
  var HOURY = ['overtime','shortfall_hours','personal_leave','sick_leave','menstrual_leave','disaster_leave','hourly_wage'];
  function payNf(v) { return Math.round(v).toLocaleString('zh-TW'); }
  function payR2(v) { return Math.round(v * 100) / 100; }

  // 預設月份＝當月（台北時區）
  (function () {
    try {
      var parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit' }).formatToParts(new Date());
      var y = parts.find(function (p) { return p.type === 'year'; }).value;
      var mo = parts.find(function (p) { return p.type === 'month'; }).value;
      if (y && mo) payYm.value = y + '-' + mo;
    } catch (e) {}
  })();

  function payState(ic, t, d) {
    return '<div class="card"><div class="pstate"><div class="ic">' + ic + '</div><div class="t">' + t + '</div><div>' + d + '</div></div></div>';
  }
  function payLine(x) {
    var sub = '';
    if (x.qty != null) {
      sub = ' <span style="color:#8a817a;font-size:12px">' + payR2(x.qty) + (HOURY.indexOf(x.item_key) !== -1 ? 'H' : '') + (x.rate ? ' × ' + payNf(x.rate) : '') + '</span>';
    }
    return '<tr><td>' + x.item_label + sub + '</td><td>' + payNf(x.amount) + '</td></tr>';
  }
  function renderPay(j) {
    if (!j || !j.ok) { paySlipEl.innerHTML = payState('🔒', '無法驗證身分', '這個連結可能已失效，請找店長重新取得。'); return; }
    if (!j.ready) { paySlipEl.innerHTML = payState('🕒', j.message || '尚未結算', '薪資結算後這裡就會顯示明細。'); return; }
    var r = j.result || j.run, earn = r.earn || [], ded = r.ded || [];
    paySlipEl.innerHTML = '<div class="card">'
      + '<div class="who"><div><b>' + j.name + '</b><div class="m">' + String(j.ym).replace('-', '年') + '月薪資</div></div>'
      + '<div class="m">發薪日<br>每月 ' + j.payday + ' 日</div></div>'
      + '<div class="hrs">'
      + '<div><span>核定總時數</span><b>' + r.total_hours + '</b> H</div>'
      + (r.support_hours ? '<div><span>支援時數</span><b>' + payR2(r.support_hours) + '</b> H</div>' : '')
      + (r.base_hours != null ? '<div><span>基本工時</span><b>' + r.base_hours + '</b> H</div>' : '')
      + (r.ot_paid_hours ? '<div><span>計薪加班</span><b>' + payR2(r.ot_paid_hours) + '</b> H</div>' : '')
      + '</div>'
      + '<h4>加項</h4><table>' + earn.map(payLine).join('') + '<tr class="sum"><td>應收合計</td><td>' + payNf(r.gross) + '</td></tr></table>'
      + '<h4 class="d">扣項</h4><table>' + (ded.length ? ded.map(payLine).join('') : '<tr><td colspan="2" style="color:#8a817a">無</td></tr>') + '<tr class="sum"><td>應付合計</td><td>' + payNf(r.deduction) + '</td></tr></table>'
      + '<div class="net"><div>實付金額</div><div class="v">NT$ ' + payNf(r.net) + '</div></div>'
      + '<div class="pfoot">如有疑問請於發薪日起 7 日內向店長反映。<br>本頁只顯示你本人的資料。</div>'
      + '</div>';
  }
  function loadPayslip(force) {
    if (!key) { paySlipEl.innerHTML = payState('🔒', '連結不完整', '請用店長給你的專屬連結開啟。'); return; }
    if (!force && payLoadedYm === payYm.value) return;
    paySlipEl.innerHTML = '<div class="card center-msg" style="color:#8a817a">載入中…</div>';
    var reqYm = payYm.value;
    apiPost({ action: 'my_payslip', key: key, ym: reqYm }).then(function (j) {
      payLoadedYm = reqYm;
      renderPay(j);
    }, function () {
      paySlipEl.innerHTML = payState('📡', '連不上伺服器', '請確認網路後重新整理。');
    });
  }
  if (tabbar) {
    tabbar.addEventListener('click', function (e) {
      var b = e.target && e.target.closest ? e.target.closest('.tab') : null;
      if (!b) return;
      var tabs = tabbar.querySelectorAll('.tab');
      for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('on');
      b.classList.add('on');
      var isPay = b.getAttribute('data-view') === 'pay';
      clockView.style.display = isPay ? 'none' : '';
      payView.style.display = isPay ? '' : 'none';
      if (isPay) loadPayslip(false);
    });
    payYm.addEventListener('change', function () { loadPayslip(true); });
  }

  init();
})();
</script>
<script>
/* 天氣動態背景 ─ 依門市當下天氣切換背景情境（晴／多雲／陰／霧／雨／雷雨／雪，各分日夜）。
   天氣來源：Open-Meteo（免金鑰、免註冊），每 20 分鐘更新一次，結果存 localStorage，
   下次開頁先用上次的天氣立刻上場再背景更新，不會卡住打卡畫面。
   抓不到天氣就完全不套用情境，畫面維持原本的火焰背景。
   預覽用：?weather=clear|cloudy|overcast|fog|drizzle|rain|heavy-rain|storm|snow（可再加 &night=1 看夜間版）。 */
(function () {
  'use strict';

  var STORE_LAT = 24.7840945;      // 光復店；與 apps-script/Code.gs 的 CONFIG.STORE_LAT/STORE_LNG 同一組座標
  var STORE_LNG = 121.0157448;
  var WX_API = 'https://api.open-meteo.com/v1/forecast?latitude=' + STORE_LAT +
               '&longitude=' + STORE_LNG + '&current=weather_code,is_day&timezone=Asia%2FTaipei';
  var CACHE_KEY = 'mala_wx_cache';
  var CACHE_MS = 20 * 60 * 1000;   // 天氣多久重抓一次
  var TIMEOUT_MS = 6000;           // 抓天氣的逾時：訊號差時不要一直等

  var body = document.body;
  var canvas = document.getElementById('wxCanvas');
  var flashEl = document.querySelector('.wxFlash');
  var ctx = (canvas && canvas.getContext) ? canvas.getContext('2d') : null;
  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var reduceMotion = !!(mq && mq.matches);

  var SCENE_CLASSES = ['wx-on', 'wx-day', 'wx-night', 'wx-sun', 'wx-moon',
                       'wx-clear', 'wx-cloudy', 'wx-overcast', 'wx-fog', 'wx-rain', 'wx-storm', 'wx-snow'];

  function qsParam(n) {
    try { return new URLSearchParams(window.location.search).get(n); } catch (e) { return null; }
  }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* WMO 天氣代碼 → 背景情境。power 是雨勢強弱（影響雨滴數量與速度） */
  function sceneOf(code, isDay) {
    var c = Number(code);
    var s = { kind: 'cloudy', power: 1, day: !!isDay };
    if (c === 0) s.kind = 'clear';
    else if (c === 1 || c === 2) s.kind = 'cloudy';
    else if (c === 3) s.kind = 'overcast';
    else if (c === 45 || c === 48) s.kind = 'fog';
    else if (c >= 51 && c <= 57) { s.kind = 'rain'; s.power = 0.5; }            // 毛毛雨
    else if (c === 61 || c === 66 || c === 80) { s.kind = 'rain'; s.power = 0.85; }
    else if (c === 63 || c === 81) { s.kind = 'rain'; s.power = 1.2; }
    else if (c === 65 || c === 67 || c === 82) { s.kind = 'rain'; s.power = 1.7; }  // 大雨
    else if ((c >= 71 && c <= 77) || c === 85 || c === 86) s.kind = 'snow';
    else if (c >= 95) { s.kind = 'storm'; s.power = 1.6; }                      // 雷雨
    return s;
  }

  var current = null;

  function apply(scene) {
    if (current && current.kind === scene.kind && current.day === scene.day && current.power === scene.power) return;
    current = scene;
    for (var i = 0; i < SCENE_CLASSES.length; i++) body.classList.remove(SCENE_CLASSES[i]);
    body.classList.add('wx-' + scene.kind);
    body.classList.add(scene.day ? 'wx-day' : 'wx-night');
    if (scene.kind === 'clear' || scene.kind === 'cloudy') {
      body.classList.add(scene.day ? 'wx-sun' : 'wx-moon');
    }
    body.classList.add('wx-on');
    resetCanvas();
    scheduleFlash();
  }

  /* ── canvas 粒子（雨滴／雪花／星星）───────────────────────── */
  var W = 0, H = 0, lastW = 0, lastH = 0, parts = [], mode = 'none', wind = 0, rafId = 0, lastTs = 0;

  function sizeCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || document.documentElement.clientWidth;
    H = window.innerHeight || document.documentElement.clientHeight;
    lastW = W; lastH = H;
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeDrop(scene, seeded) {
    var z = Math.random();                        // 遠近層次：0 遠、1 近
    return {
      x: rand(-0.2 * W, 1.05 * W),
      y: seeded ? rand(-H, H) : rand(-H * 0.35, -10),
      len: (10 + z * 26) * (0.75 + scene.power * 0.35),
      sp: (620 + z * 760) * (0.7 + scene.power * 0.42),
      b: z < 0.34 ? 0 : (z < 0.7 ? 1 : 2)
    };
  }
  function makeFlake(seeded) {
    var z = Math.random();
    return { x: rand(0, W), y: seeded ? rand(0, H) : rand(-H * 0.3, -6),
             r: 1 + z * 2.4, sp: 26 + z * 52, ph: rand(0, Math.PI * 2), sw: rand(8, 26) };
  }
  function makeStar() {
    return { x: rand(0, W), y: rand(0, H * 0.6), r: rand(0.5, 1.5),
             ph: rand(0, Math.PI * 2), sp: rand(0.6, 2), a: rand(0.25, 0.8) };
  }

  function buildParts(scene) {
    parts = [];
    var span = Math.sqrt(W * H) / 26;             // 依螢幕大小決定密度，手機不會爆量
    var i, n;
    if (scene.kind === 'rain' || scene.kind === 'storm') {
      mode = 'rain';
      wind = scene.kind === 'storm' ? 0.4 : 0.2;
      n = clamp(Math.round(span * 3.2 * scene.power), 26, 200);
      for (i = 0; i < n; i++) parts.push(makeDrop(scene, true));
    } else if (scene.kind === 'snow') {
      mode = 'snow';
      n = clamp(Math.round(span * 1.9), 20, 120);
      for (i = 0; i < n; i++) parts.push(makeFlake(true));
    } else if (scene.kind === 'clear' && !scene.day) {
      mode = 'stars';
      n = clamp(Math.round(span * 1.6), 24, 110);
      for (i = 0; i < n; i++) parts.push(makeStar());
    } else {
      mode = 'none';                              // 晴天白天／陰天／霧：效果全在 CSS 圖層
    }
  }

  function step(dt) {
    var i, p;
    if (mode === 'rain') {
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        p.y += p.sp * dt;
        p.x += p.sp * wind * dt;
        if (p.y > H + 20 || p.x > W + 40) { p.y = rand(-H * 0.3, -12); p.x = rand(-0.2 * W, 1.05 * W); }
      }
    } else if (mode === 'snow') {
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        p.ph += dt;
        p.y += p.sp * dt;
        p.x += Math.sin(p.ph) * p.sw * dt;
        if (p.y > H + 6) { p.y = rand(-H * 0.25, -6); p.x = rand(0, W); }
        if (p.x < -12) p.x = W + 8; else if (p.x > W + 12) p.x = -8;
      }
    } else if (mode === 'stars') {
      for (i = 0; i < parts.length; i++) parts[i].ph += parts[i].sp * dt;
    }
  }

  var RAIN_STROKE = ['rgba(198,224,255,.20)', 'rgba(216,236,255,.34)', 'rgba(236,246,255,.54)'];
  var RAIN_WIDTH = [0.9, 1.3, 1.9];

  function draw() {
    ctx.clearRect(0, 0, W, H);
    var i, b, p;
    if (mode === 'rain') {
      ctx.lineCap = 'round';
      for (b = 0; b < 3; b++) {                   // 依遠近分三批畫，一批一次 stroke 比較省
        ctx.beginPath();
        ctx.strokeStyle = RAIN_STROKE[b];
        ctx.lineWidth = RAIN_WIDTH[b];
        for (i = 0; i < parts.length; i++) {
          p = parts[i];
          if (p.b !== b) continue;
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.len * wind, p.y + p.len);
        }
        ctx.stroke();
      }
    } else if (mode === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,.82)';
      ctx.beginPath();
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        ctx.moveTo(p.x + p.r, p.y);
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      }
      ctx.fill();
    } else if (mode === 'stars') {
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        ctx.fillStyle = 'rgba(255,252,236,' + (p.a * (0.55 + 0.45 * Math.sin(p.ph))).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function frame(ts) {
    rafId = window.requestAnimationFrame(frame);
    var dt = lastTs ? (ts - lastTs) / 1000 : 0.016;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05;                     // 切回分頁時不要一次跳太多
    step(dt);
    draw();
  }
  function startLoop() {
    if (rafId || mode === 'none' || reduceMotion || !window.requestAnimationFrame) return;
    lastTs = 0;
    rafId = window.requestAnimationFrame(frame);
  }
  function stopLoop() {
    if (rafId) { window.cancelAnimationFrame(rafId); rafId = 0; }
  }
  function resetCanvas() {
    if (!ctx || !current) return;
    stopLoop();
    sizeCanvas();
    buildParts(current);
    if (mode === 'none') { ctx.clearRect(0, 0, W, H); return; }
    if (reduceMotion) { draw(); return; }          // 關閉動畫時只畫靜止的一幀
    startLoop();
  }

  /* 雷雨閃電：每 5～16 秒閃一次 */
  var flashTimer = 0;
  function scheduleFlash() {
    clearTimeout(flashTimer);
    if (!flashEl || reduceMotion || !current || current.kind !== 'storm') return;
    flashTimer = setTimeout(function () {
      if (!document.hidden) {
        flashEl.classList.remove('on');
        void flashEl.offsetWidth;                  // 重觸發動畫
        flashEl.classList.add('on');
      }
      scheduleFlash();
    }, 5000 + Math.random() * 11000);
  }

  /* ── 取天氣 ────────────────────────────────────────────────── */
  function readCache() {
    try {
      var j = JSON.parse(window.localStorage.getItem(CACHE_KEY) || 'null');
      if (j && isFinite(j.code) && isFinite(j.t)) return j;
    } catch (e) {}
    return null;
  }
  function writeCache(code, day) {
    try {
      window.localStorage.setItem(CACHE_KEY, JSON.stringify({ code: code, day: day ? 1 : 0, t: Date.now() }));
    } catch (e) {}
  }
  function fetchWeather() {
    var ctl = window.AbortController ? new window.AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, TIMEOUT_MS);
    return fetch(WX_API, ctl ? { signal: ctl.signal } : undefined).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (j) {
      clearTimeout(timer);
      var cur = j && j.current;
      var code = cur ? Number(cur.weather_code) : NaN;
      if (!isFinite(code)) throw new Error('bad payload');
      var day = (cur.is_day === 1 || cur.is_day === true);
      writeCache(code, day);
      return { code: code, day: day };
    }, function (err) { clearTimeout(timer); throw err; });
  }
  function refresh() {
    if (forced || !window.fetch || !window.Promise) return;   // 預覽模式與不支援的瀏覽器都不抓
    var c = readCache();
    if (c && Date.now() - c.t < CACHE_MS) return;  // 還新鮮就不重抓
    fetchWeather().then(function (w) { apply(sceneOf(w.code, w.day)); }, function () {});
  }

  function forcedScene(nameRaw) {
    var codes = { clear: 0, sunny: 0, cloudy: 2, overcast: 3, fog: 45, drizzle: 53,
                  rain: 63, 'heavy-rain': 65, storm: 95, thunder: 95, snow: 73 };
    var name = String(nameRaw).toLowerCase();
    var code = Object.prototype.hasOwnProperty.call(codes, name) ? codes[name] : 0;
    return sceneOf(code, qsParam('night') !== '1');
  }

  window.addEventListener('resize', function () {
    if (!current || !ctx) return;
    // 手機捲動時網址列伸縮也會觸發 resize，高度小幅變化只調畫布、不重排粒子
    if (Math.abs(window.innerWidth - lastW) < 2 && Math.abs(window.innerHeight - lastH) < 140) {
      sizeCanvas();
    } else {
      resetCanvas();
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopLoop(); clearTimeout(flashTimer); return; }
    startLoop();
    scheduleFlash();
    refresh();                                     // 回到前景順便看看天氣變了沒
  });
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function (e) { reduceMotion = e.matches; resetCanvas(); scheduleFlash(); });
  }

  var forced = qsParam('weather');
  if (forced) {
    apply(forcedScene(forced));
  } else if (window.fetch && window.Promise) {
    var cached = readCache();
    if (cached) apply(sceneOf(cached.code, cached.day === 1));  // 先套上次的天氣，畫面不用等連線
    refresh();
    setInterval(refresh, CACHE_MS);                              // 頁面長時間開著也會跟著換
  }
})();
</script>
</body>
