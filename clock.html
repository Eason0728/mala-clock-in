<!-- ⚠ 這是「母版」。各門市（央廚 clock-cf.html／總部 clock-hq.html…）的頁面是從本檔產生的，
     改完本檔請務必重跑：  python3 tools/build-store-pages.py
     否則各門市頁面會停在舊版。原因：LINE 連結預覽卡與 iOS 加入主畫面都只讀原始 HTML、不執行 JS，
     所以標題與圖示必須寫死在各自的檔案裡。 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>麻的小辛辣 員工打卡</title>
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<meta name="apple-mobile-web-app-title" content="打卡">
<!-- ⚠ LIFF SDK 不可以放在這裡同步載入！這裡是 <head>，同步 <script src> 會擋住整份文件的解析——
     ?k= 舊模式從來沒有這支第三方 CDN 依賴，正式載入邏輯在下面 initIdentity()/loadLiffSdk()，
     只有確定不是 ?k= 模式時才會動態插入。詳見 2026-08-27 審查 Critical 1。 -->
<script>
/* ⚠ 主畫面圖示必須在 <head> 解析當下就換掉：iOS 在「加入主畫面」時抓的是它解析 head 時看到的
   apple-touch-icon，寫在頁尾才換有機會來不及。這段只改標籤，不依賴其他程式。 */
(function () {
  var MAP = {
    'cf': { icon: 'assets/icon-180-mzt.png', home: '央廚打卡' },
    'hq': { icon: 'assets/icon-180-mzt.png', home: '總部打卡' }
  };
  var s = String(new URLSearchParams(location.search).get('s') || '').toLowerCase();
  var b = MAP[s];
  if (!b) return;
  var l = document.querySelector('link[rel="apple-touch-icon"]');
  if (l) l.setAttribute('href', b.icon);
  var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (m) m.setAttribute('content', b.home);
})();
</script>

<style>
  :root {
    --brand-red: #E8380D;
    --brand-pink: #EF856D;
    --brand-black: #231815;
    --brand-orange: #F08300;
    --brand-gold: #FABE00;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: radial-gradient(120% 90% at 50% 16%, #c9290b 0%, #a81f08 55%, #8a1906 100%) fixed;
    color: #fff;
    min-height: 100vh;
  }
  .scrim {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(85% 74% at 50% 44%, rgba(42,11,3,0) 0%, rgba(34,9,3,.14) 60%, rgba(20,5,1,.4) 100%);
  }
  .container {
    max-width: 480px;

    display: flex;

  }
  /* 門市品牌：預設光復（純文字），其他門市可帶 logo */
  .brandLogo {

  }
  .card {
    background: #fff;
    color: var(--brand-black);

    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  }
  .name-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .name-row .name {
    font-size: 22px;
    font-weight: 700;
  }
  .device-hint {
    font-size: 12px;
    color: #8a6a5f;
    margin-bottom: 10px;
    min-height: 16px;
  }
  .today-list {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 14px;
  }
  .today-list li {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0e6e2;
  }
  .today-list li:last-child { border-bottom: none; }
  .no-events {
    font-size: 14px;
    color: #8a6a5f;
  }
  /* 次要按鈕：回查最近 40 天（沿用卡片內既有的字色與分隔線色，不加新色彩） */
  .recent-toggle {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    font-size: 14px;
    color: #8a6a5f;
    background: none;
    border: 1px solid #f0e6e2;
    border-radius: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .recent-toggle:disabled { opacity: 0.5; }
  .recent-list li {
    gap: 8px;
  }
  .recent-list .day-info { flex: 1; }
  /* 右欄改直向靠右：核定時數在上，遲到/早退標記疊在下一行，
     窄螢幕不會被擠爆（時數與標記各自 nowrap） */
  .recent-list .day-hours {
    white-space: nowrap;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  /* 本月／上月核定時數合計：擺在明細清單上方當摘要，兩欄並排、窄螢幕也放得下 */
  .month-totals {
    display: flex;

  }
  .month-totals .mt-box {

  .month-totals .mt-label {

  /* 待核定提示：沿用 day-mark 的品牌橘當提醒色，不引入新色彩 */

  /* 遲到/早退等核定狀態：沿用既有品牌橘當警示，不引入新色彩 */
  .recent-list .day-mark {
    margin-top: 2px;
    font-size: 12px;
    color: var(--brand-orange);
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: auto;
  }
  .btn {
    font-size: 22px;
    font-weight: 900;
    padding: 26px;
    border-radius: 16px;
    border: none;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:disabled { opacity: 0.5; }
  .btn-in { background: var(--brand-orange); }
  .btn-out { background: var(--brand-black); }
  .btn.not-allowed {
    filter: grayscale(1);
    opacity: 0.45;
  }
  .status-box {
    margin-top: 16px;
    padding: 16px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.6;
    display: none;
    /* 失敗訊息會多帶一行「定位可能不準」的提示，用 \n 換行；仍走 textContent 不碰 innerHTML */

  }
  .status-box.show { display: block; }
  .status-ok { background: #e6f7ec; color: #1a7a3d; }
  .status-warn { background: #fff6e0; color: #8a6100; }
  .status-error { background: #fdeceb; color: #c22a12; }

  .center-msg { text-align: center; padding: 40px 0; }

  /* ── 我的薪資分頁 ── */
  .pay-monthcard { display: flex; align-items: center; gap: 12px; }
  .pay-mlabel { font-size: 15px; font-weight: 800; color: var(--brand-black); }
  #payYm { font: inherit; font-size: 18px; font-weight: 800; border: 1px solid #e6e0da;
    border-radius: 8px; padding: 8px 10px; margin-left: auto; color: var(--brand-black); }
  #payView .who { display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 2px solid var(--brand-black); padding-bottom: 11px; margin-bottom: 14px; }
  #payView .who b { font-size: 23px; }
  #payView .who .m { color: #8a817a; font-size: 13px; text-align: right; }
  #payView .hrs { display: flex; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  #payView .hrs div { flex: 1; min-width: 120px; background: #f6f2ee; border-radius: 10px; padding: 11px 13px; }
  #payView .hrs span { display: block; font-size: 12.5px; color: #8a817a; font-weight: 700; }
  #payView .hrs b { font-size: 21px; }
  #payView h4 { font-size: 15px; font-weight: 900; padding-bottom: 5px;
    border-bottom: 2px solid var(--brand-red); margin: 18px 0 4px; }
  #payView h4.d { border-bottom-color: var(--brand-black); }
  #payView table { width: 100%; border-collapse: collapse; }
  #payView td { padding: 8px 2px; border-bottom: 1px dotted #e6e0da; font-size: 15px; color: var(--brand-black); }
  #payView td:last-child { text-align: right; white-space: nowrap; }
  #payView tr.sum td { font-weight: 900; border-bottom: 0; }
  #payView .net { margin-top: 20px; background: var(--brand-black); color: #fff; border-radius: 12px;
    padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
  #payView .net .v { font-size: 28px; font-weight: 900; color: var(--brand-gold); }
  #payView .pfoot { font-size: 12.5px; color: #8a817a; text-align: center; margin-top: 16px; line-height: 1.8; }
  #payView .pstate { text-align: center; padding: 40px 16px; color: #8a817a; }
  #payView .pstate .ic { font-size: 34px; margin-bottom: 10px; }
  #payView .pstate .t { font-weight: 900; color: var(--brand-black); font-size: 17px; margin-bottom: 5px; }
  /* 假別額度（2026-08-27）：同仁自己查今年還剩多少假 */
  #payView .lq h4 { font-size: 15px; margin-bottom: 4px; }
  #payView .lq .sub { font-size: 12.5px; color: #8a817a; margin-bottom: 12px; line-height: 1.7; }
  #payView .lq table { width: 100%; border-collapse: collapse; font-size: 14px; }
  #payView .lq td { padding: 11px 4px; border-bottom: 1px solid #f0ebe5; vertical-align: top; }
  #payView .lq td:first-child { text-align: left; }
  #payView .lq td.r { text-align: right; white-space: nowrap; }
  #payView .lq .u { display: block; font-size: 12px; color: #8a817a; font-weight: 700; }
  #payView .lq .bar { display: block; width: 78px; height: 6px; border-radius: 4px;
    background: #ece7e1; overflow: hidden; margin-top: 6px; }
  #payView .lq .bar i { display: block; height: 100%; background: var(--brand-gold); }
  #payView .lq .bar i.hi { background: var(--brand-red); }
  #payView .lq .out { color: #c0392b; font-weight: 900; }

  /* ── 天氣動態背景 ─────────────────────────────────────────────
     依門市當下的天氣切換情境：晴天出太陽、雨天下雨、雷雨打閃電、
     陰天／起霧飄雲、夜晚換月亮與星星。太陽、雲、雨、雪、閃電都在
     canvas 上即時算（見檔尾的天氣程式），這裡只負責整片的色調。
     抓不到天氣資料就完全不套用，畫面維持原本的紅底。 */
  .wx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

  #wxCanvas { opacity: 0; transition: opacity 1.2s ease; }
  body.wx-on #wxCanvas { opacity: 1; }

  /* 全畫面色調：雨天壓成冷色、晴天鋪暖光、陰霧轉灰 */
  .wxTint { background: transparent; transition: background 1.6s ease; }
  body.wx-clear.wx-day .wxTint  { background: radial-gradient(130% 88% at 84% 0%, rgba(255,206,96,.40) 0%, rgba(255,150,32,.12) 44%, rgba(255,130,16,0) 74%); }
  body.wx-cloudy.wx-day .wxTint { background: radial-gradient(130% 88% at 84% 0%, rgba(255,206,96,.22) 0%, rgba(122,112,106,.20) 48%, rgba(88,82,78,.30) 100%); }
  body.wx-overcast .wxTint { background: linear-gradient(180deg, rgba(104,104,110,.50) 0%, rgba(58,58,64,.58) 100%); }
  body.wx-fog .wxTint      { background: linear-gradient(180deg, rgba(178,176,178,.56) 0%, rgba(138,136,140,.66) 100%); }
  body.wx-snow .wxTint     { background: linear-gradient(180deg, rgba(30,52,86,.40) 0%, rgba(18,32,58,.50) 100%); }
  body.wx-rain .wxTint     { background: linear-gradient(180deg, rgba(12,32,58,.54) 0%, rgba(6,18,36,.64) 100%); }
  body.wx-storm .wxTint    { background: linear-gradient(180deg, rgba(8,20,42,.66) 0%, rgba(3,10,24,.74) 100%); }

  /* 夜間再壓一層深色（與天氣分開，兩者可疊加） */
  .wxNight { background: linear-gradient(180deg, rgba(3,8,22,.52) 0%, rgba(2,5,14,.68) 100%); opacity: 0; transition: opacity 1.6s ease; }
  body.wx-night .wxNight { opacity: 1; }

  /* 雷雨的整片閃光（電光本身畫在 canvas 上） */
  .wxFlash { background: #eaf1ff; opacity: 0; }
  .wxFlash.on { animation: wxFlash 900ms ease-out; }
  @keyframes wxFlash { 0% { opacity: 0; } 4% { opacity: .46; } 10% { opacity: .05; } 16% { opacity: .34; } 26% { opacity: 0; } 100% { opacity: 0; } }

  /* 使用者在系統設定關閉動畫時：只留靜態畫面，不做動畫 */
  @media (prefers-reduced-motion: reduce) {
    .wxFlash.on { animation: none; }
  }
</style>
</head>
<body>
<div class="scrim" aria-hidden="true"></div>
<div class="wx wxTint" aria-hidden="true"></div>
<div class="wx wxNight" aria-hidden="true"></div>
<canvas class="wx" id="wxCanvas" aria-hidden="true"></canvas>
<div class="wx wxFlash" aria-hidden="true"></div>
<div class="container">
  <header>
    <h1>麻的🔥小辛辣</h1>
    <p>員工專區</p>
  </header>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-view="clock" type="button">🕐 打卡</button>
    <button class="tab" data-view="pay" type="button">💰 我的薪資</button>
  </nav>

  <div id="clockView">
  <div id="loadingCard" class="card center-msg">載入中…</div>

  <div id="mainCard" class="card" style="display:none;">
    <div class="name-row">
      <span class="name" id="empName">—</span>
    </div>
    <div class="device-hint" id="deviceHint"></div>
    <ul class="today-list" id="todayList"></ul>
    <div class="no-events" id="noEvents" style="display:none;">今天還沒有打卡紀錄</div>

    <button class="recent-toggle" id="btnRecent" type="button">查看最近 40 天</button>

    <ul class="today-list recent-list" id="recentList" style="display:none;"></ul>
  </div>

  <div id="errorCard" class="card center-msg" style="display:none; color:#c22a12;"></div>

  <div id="bindCard" class="card center-msg" style="display:none;">
    <p style="margin:0 0 14px;">首次使用請輸入店長給你的啟用碼，或直接貼上店長傳的整條連結，完成 LINE 帳號綁定。</p>
    <input type="text" id="bindKeyInput" placeholder="啟用碼或連結皆可" autocomplete="off"
           style="width:100%;padding:12px;font-size:16px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;">
    <div id="bindErrorMsg" style="color:#c22a12;margin-top:10px;font-size:14px;min-height:1.2em;"></div>

  <div class="btn-group" id="btnGroup" style="display:none;">
    <button class="btn btn-in" id="btnIn" type="button">上班打卡</button>

  <div class="status-box" id="statusBox"></div>
  </div><!-- /clockView -->

  <div id="payView" style="display:none;">
    <div class="card pay-monthcard">
      <span class="pay-mlabel">薪資月份</span>
      <input type="month" id="payYm">
    </div>
    <div id="paySlip"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* 多門市後端對照：不帶 ?s= 就是光復（既有連結完全不受影響）。
     各店打卡各自一份試算表與部署，所以只有網址不同，程式共用一份。 */
  var STORE_APIS = {
    ''  : 'https://script.google.com/macros/s/AKfycbxE4DTz847y0bPvLd4mD_9vBFTe3npmVVYKU1CYgeFcUpAuL4vLIA3rySXSR-2qujdJ0A/exec',   // 麻的小辛辣 新竹光復店（預設）
    'cf': 'https://script.google.com/macros/s/AKfycby-IzOBTrUK-usZxEUVRAcvPqagfAbHpvLevIWnk6drBpIuHwh1IlEun4bdsS9o-CIB/exec',   // 鼎兆元 中央廚房（台中太平）
    'hq': 'https://script.google.com/macros/s/AKfycbyiocazNgn9M249CCkPzJsRvMJ35uh_Wjp_ju1y1sB2TZ_IWH3RD6pKUsHXsUJR-4N9TQ/exec'    // 鼎兆元 總部（座標暫用央廚）
  };
  var STORE_CODE = (function () {
    var v = String(new URLSearchParams(window.location.search).get('s') || '').toLowerCase();
    return STORE_APIS[v] ? v : '';
  })();
  var API_URL = STORE_APIS[STORE_CODE];
  /* 門市品牌：依 ?s= 換頁面標題與 logo。不帶參數＝光復，畫面與原本完全相同。 */
  var STORE_BRAND = {
    ''  : { title: '麻的🔥小辛辣', logo: null },
    'cf': { title: '中央廚房',     logo: 'assets/emblem-mzt.png', doc: '中央廚房',
            icon: 'assets/icon-180-mzt.png', home: '央廚打卡' },
    'hq': { title: '鼎兆元 總部', logo: 'assets/emblem-mzt.png', doc: '鼎兆元總部',
            icon: 'assets/icon-180-mzt.png', home: '總部打卡' }
  };
  (function () {
    var b = STORE_BRAND[STORE_CODE];
    if (!b || !b.logo) return;                 // 光復維持原樣
    var h1 = document.querySelector('header h1');
    if (h1) h1.textContent = b.title;
    var img = document.createElement('img');
    img.className = 'brandLogo'; img.src = b.logo; img.alt = b.title;
    if (h1 && h1.parentNode) h1.parentNode.insertBefore(img, h1);
    // 各門市的靜態頁（clock-cf.html…）標題已寫死，這裡要冪等，不然會變「中央廚房中央廚房 …」
    if (b.doc && document.title.indexOf(b.doc) !== 0) document.title = b.doc + document.title.replace(/^麻的小辛辣/, '');
    // 加到主畫面的圖示與名稱：iOS 是在「加入主畫面」當下讀這兩個標籤，所以這裡改得到
    if (b.icon) {
      var l = document.querySelector('link[rel="apple-touch-icon"]');
      if (l) l.setAttribute('href', b.icon);
    }
    if (b.home) {
      var mt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (mt) mt.setAttribute('content', b.home);
    }
  })();

  /* ⚠ 薪酬是「全集團共用一套」，永遠掛在光復那個後端；打卡才是每店一份。
     「我的薪資」分頁固定打這個網址，不可以跟著門市切換，否則央廚同仁會打到沒有薪資模組的後端。 */
  var PAYROLL_API = STORE_APIS[''];

  function qs(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  var isLocalHost = ['localhost', '127.0.0.1'].indexOf(window.location.hostname) !== -1;
  if (isLocalHost) {
    var apiOverride = qs('api');
    if (apiOverride) API_URL = apiOverride;
  }

  var key = qs('k');

  // ══════ LIFF 身分層（2026-08）：?k= 舊模式與 LIFF 新模式並存 ══════
  // 舊模式優先：網址帶 ?k= 就一律走舊模式、完全不碰 LIFF（向後相容優先，見計畫說明）。
  var LIFF_ID = '2011292256-dNENLDwW';
  // LIFF 後端（apps-script/Liff.gs）目前只部署給光復（STORE_CODE===''）；
  // 央廚／總部（cf/hq）的 API_URL 指到各自後端，沒有 LIFF_HANDLERS，開了也只會走到
  // liff_whoami → unknown_action 的死路（2026-08-27 審查 Important 3）。
  // cf/hq 頁面的 STORE_CODE 是 tools/build-store-pages.py 寫死的字串，這裡不需要另外維護清單。
  var LIFF_ENABLED = (STORE_CODE === '');
  var idToken = null;             // LIFF 模式下的身分憑證（僅供 init 時的存在性判斷，實際送出一律即時重讀，見 identityPayload）
  var useLiff = false;            // true = 走 liff_* action

  /** 前綴：舊模式回空字串（action 不變），LIFF 模式回 'liff_' */
  function actionPrefix() { return useLiff ? 'liff_' : ''; }

  /** 身分欄位：舊模式帶 key，LIFF 模式即時重讀 liff.getIDToken()。
   *  ⚠ 不可以回傳 init 當下存的 idToken——LIFF webview 常常開很久不關，token 會過期，
   *  每次送出前重讀才能保證帶的是當下有效的那一份（2026-08-27 審查 Important 5）。 */
  function identityPayload() {
    return useLiff ? { id_token: liff.getIDToken() } : { key: key };
  }

  /** 組出這次要送出的 payload：action 依模式加前綴，身分欄位依模式帶 key 或 id_token，
   *  其餘欄位（device_id、type、lat…）由呼叫端用 extra 補上。 */
  function mkPayload(action, extra) {
    var payload = { action: actionPrefix() + action, device_id: deviceId };
    var idp = identityPayload();
    Object.keys(idp).forEach(function (k2) { payload[k2] = idp[k2]; });
    if (extra) {
      Object.keys(extra).forEach(function (k3) { payload[k3] = extra[k3]; });
    }
    return payload;
  }

  /** 動態插入 LIFF SDK，只有確定不是 ?k= 模式（且該店啟用 LIFF）才會被呼叫。
   *  ⚠ 絕不可以在 <head> 放同步 <script src>——那會擋住整份文件的解析，讓每一筆
   *  ?k= 舊模式打卡都平白多等一顆不相干的第三方 CDN（2026-08-27 審查 Critical 1）。
   *  window.liff 已存在就直接跳過，不重複載入。 */
  function loadLiffSdk() {
    if (window.liff) return Promise.resolve(true);
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
      s.onload = function () { resolve(true); };
      s.onerror = function () { resolve(false); };
      document.head.appendChild(s);
    });
  }

  /**
   * 決定身分模式：網址帶 k → 一律走舊模式，完全不碰 LIFF SDK（連載入都不載入）。
   * 否則若該店啟用 LIFF，才動態載入 SDK → liff.init → 確認登入 → 取 ID token。
   * 回傳 Promise<boolean>：true 表示身分已就緒（舊模式或 LIFF 都算）。
   */
  function initIdentity() {
    if (key) { useLiff = false; return Promise.resolve(true); }   // 舊路徑：完全不碰 CDN
    if (!LIFF_ENABLED) return Promise.resolve(false);
    return loadLiffSdk().then(function (ok) {
      if (!ok) return false;
      return liff.init({ liffId: LIFF_ID }).then(function () {
        if (!liff.isLoggedIn()) { liff.login(); return false; }
        idToken = liff.getIDToken();
        useLiff = !!idToken;
        return useLiff;
      }).catch(function () { return false; });
    });
  }

  var DEVICE_KEY = 'mala_clock_device';
  function fallbackUuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0;
      var v = c === 'x' ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }
  function getDeviceId() {
    var id = localStorage.getItem(DEVICE_KEY);
    if (!id) {
      id = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : fallbackUuid();
      localStorage.setItem(DEVICE_KEY, id);
    }
    return id;
  }
  var deviceId = getDeviceId();

  var loadingCard = document.getElementById('loadingCard');
  var mainCard = document.getElementById('mainCard');
  var errorCard = document.getElementById('errorCard');
  var bindCard = document.getElementById('bindCard');
  var bindKeyInput = document.getElementById('bindKeyInput');
  var bindErrorMsg = document.getElementById('bindErrorMsg');
  var btnBindSubmit = document.getElementById('btnBindSubmit');
  var btnGroup = document.getElementById('btnGroup');
  var empNameEl = document.getElementById('empName');
  var deviceHintEl = document.getElementById('deviceHint');
  var todayListEl = document.getElementById('todayList');
  var noEventsEl = document.getElementById('noEvents');
  var todayHoursEl = document.getElementById('todayHours');
  var statusBox = document.getElementById('statusBox');
  var btnIn = document.getElementById('btnIn');
  var btnOut = document.getElementById('btnOut');
  var btnRecent = document.getElementById('btnRecent');
  var recentListEl = document.getElementById('recentList');
  var monthTotalsEl = document.getElementById('monthTotals');

  function showError(msg) {
    loadingCard.style.display = 'none';
    mainCard.style.display = 'none';
    btnGroup.style.display = 'none';
    bindCard.style.display = 'none';
    errorCard.style.display = 'block';
    errorCard.textContent = msg;
  }

  /** LIFF 模式 whoami 失敗時（not_bound 除外）的措辭：情境是在 LINE 裡開的頁面，
   *  不能沿用舊模式那套「打卡連結」的講法（她的畫面裡根本沒有連結）。
   *  每一句都要讓看的人知道下一步該做什麼：能自己排除的給操作指示，
   *  排除不了的直接叫她找主管，不留死路。 */
  function liffWhoamiErrorMsg(error) {
    if (error === 'invalid_id_token') {
      return 'LINE 身分驗證失敗或已過期，請關掉這個畫面，重新從 LINE 開啟一次。';
    }
    if (error === 'no_roster') {
      return '系統設定異常，不是你這邊能排除的問題，請告知主管處理。';
    }
    return '發生未預期的錯誤，請告知主管。';
  }

  // ══════ LIFF 綁定畫面：liff_whoami 回 not_bound 時顯示 ══════
  function showBindScreen() {
    loadingCard.style.display = 'none';
    mainCard.style.display = 'none';
    btnGroup.style.display = 'none';
    errorCard.style.display = 'none';
    bindCard.style.display = 'block';
  }
  function showBindError(msg) {
    bindErrorMsg.textContent = msg || '';
  }
  /** 同仁多半會把店長給的整條網址貼上來，自動抽出 ?k= 的值；純金鑰則原樣使用。 */
  function extractBindCode(raw) {
    var s = String(raw || '').trim();
    if (!s) return '';
    var m = s.match(/[?&]k=([^&#\s]+)/);
    if (m) { try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; } }
    return s;
  }
  function doBind(code) {
    var key = extractBindCode(code);
    // ⚠ 即時重讀 liff.getIDToken()，不要用 init 當下存的 idToken——同一個過期理由見 identityPayload()。
    return apiPost({ action: 'liff_bind', id_token: liff.getIDToken(), key: key })
      .then(function (res) {
        if (res && res.ok) { location.reload(); return; }
        var msg = {
          invalid_key: '啟用碼不正確，請跟店長確認',
          already_bound_other_user: '這個員工已綁定其他 LINE 帳號，請店長先解除綁定',
          // 2026-08-27 審查 Minor 7：原本沒有下一步指示，是最容易讓人卡住的一句——加上去
          line_account_in_use: '你的 LINE 帳號已經綁定另一位員工，請聯絡店長或主管協助處理',
          invalid_id_token: 'LINE 身分驗證失敗，請關掉重開'
        }[res && res.error] || '綁定失敗，請告知主管';
        showBindError(msg);
      })
      .catch(function () {
        showBindError('連線失敗，請檢查網路後再試。');
      });
  }
  if (btnBindSubmit) {
    btnBindSubmit.addEventListener('click', function () {
      var code = extractBindCode(bindKeyInput ? bindKeyInput.value : '');
      if (!code) { showBindError('請輸入啟用碼'); return; }
      btnBindSubmit.disabled = true;
      showBindError('');
      doBind(code).then(function () { btnBindSubmit.disabled = false; });
    });
  }

  function typeLabel(t) { return t === 'in' ? '上班' : '下班'; }
  function statusLabel(s) {
    if (s === 'ok') return '正常';
    if (s === 'pending_device_approval') return '待核准';
    if (s === 'rejected_out_of_range') return '超出範圍';
    if (s === 'rejected_device') return '裝置被拒';
    if (s === 'rejected_duplicate') return '重複打卡';
    return s;
  }

  /* 打完上班卡後的「下班卡冷卻」：同仁常在打上班的當下手滑又按到下班。
     這段是純前端的防呆——不擋真的要下班的人太久，也不影響後端判定。
     頁面重新整理也還原得了，因為時間點是從 whoami 的 last_counted 算的。 */
  var CLOCKOUT_LOCK_MIN = 10;
  var outLockUntil = 0;      // 毫秒；0＝沒鎖
  var outLockTimer = null;

  // 目前不允許的打卡型別（'in'/'out'/null）。由伺服器 whoami 的 last_counted
  // （12 小時回看視窗，跨日也算）決定，不要自己從 today_events 算。
  var blockedType = null;

  function duplicateMessage(lastType) {
    return lastType === 'in'
      ? '⚠ 已打過上班卡，下一筆請打下班卡'
      : '⚠ 已打過下班卡，下一筆請打上班卡';
  }

  // 打卡沒成功時一律顯示這一句（Eason 2026-08-03 指定的統一措辭）。
  // 涵蓋所有失敗原因：超出範圍、新裝置待核准、重複打卡、定位失敗、沒網路、逾時、伺服器異常。
  // ⚠ 措辭要對「所有」情況都成立，所以刻意先叫她看今日紀錄再決定要不要重打——
  //   有些情況（新裝置待核准、伺服器有收到但回應異常）其實已經記錄下來了，
  //   直接叫她重打會產生重複卡；今日紀錄會顯示「待核准」等狀態，看了就知道。
  var CLOCK_FAIL_MSG = '⚠ 打卡未完成。請看下方今日紀錄確認，若沒有出現請再打一次；仍然不行請告知主管。';

  // 被判「超出範圍」而且手機回報的定位誤差很大時，多附這一段（2026-08-19 新增）。
  // 起因：王禹婕一天按了 12 次都被擋，畫面只寫「超出範圍」，她不知道該怎麼辦——
  // 實際上她人在店裡，是手機改用 Wi-Fi 定位、位置飄到店北邊 80 公尺。
  // ⚠ 只在「超出範圍 ＋ 定位誤差大」時出現。定位很準卻在店外（例如在家打卡）維持原本的統一訊息，
  //   不要給不在店裡的人一個現成的藉口。門檻由後端 low_accuracy 決定，不寫死在前端。
  function accuracyHint(res) {
    if (!res || res.status !== 'rejected_out_of_range' || !res.low_accuracy) return '';
    var m = isFinite(res.accuracy_m) ? Math.round(res.accuracy_m) : null;
    return '\n\n📍 這次定位可能不準' + (m ? '（誤差約 ±' + m + ' 公尺）' : '') +
      '：請關掉 Wi-Fi、或確認手機「精確位置」已開啟，再打一次。';
  }

  function updateButtonStates(lastCounted) {
    blockedType = lastCounted ? lastCounted.type : null;
    btnIn.classList.toggle('not-allowed', blockedType === 'in');
    btnOut.classList.toggle('not-allowed', blockedType === 'out');
    // 最後一筆是上班卡 → 起算冷卻
    outLockUntil = 0;
    if (lastCounted && lastCounted.type === 'in') {
      var t = new Date(String(lastCounted.ts)).getTime();
      if (!isNaN(t)) outLockUntil = t + CLOCKOUT_LOCK_MIN * 60 * 1000;
    }
    refreshOutLock();
  }

  /** 下班鍵的冷卻顯示：反灰、按不下去、按鈕上顯示還要等多久；時間到自動恢復 */
  function refreshOutLock() {
    if (outLockTimer) { clearTimeout(outLockTimer); outLockTimer = null; }
    var left = outLockUntil - Date.now();
    if (left > 0) {
      var mm = Math.floor(left / 60000), ss = Math.floor((left % 60000) / 1000);
      btnOut.disabled = true;
      btnOut.classList.add('not-allowed');
      btnOut.textContent = '下班打卡（' + mm + ':' + ('0' + ss).slice(-2) + ' 後可按）';
      outLockTimer = setTimeout(refreshOutLock, 1000);
    } else {
      outLockUntil = 0;
      btnOut.textContent = '下班打卡';
      btnOut.disabled = false;
      btnOut.classList.toggle('not-allowed', blockedType === 'out');
    }
  }

  function renderTodayEvents(events) {
    todayListEl.innerHTML = '';
    if (!events || events.length === 0) {
      noEventsEl.style.display = 'block';
      return;
    }
    noEventsEl.style.display = 'none';
    events.forEach(function (e) {
      var li = document.createElement('li');
      var time = (e.ts || '').substring(11, 16);
      var left = document.createElement('span');
      left.textContent = typeLabel(e.type) + ' ' + time;
      var right = document.createElement('span');
      // 超出範圍那幾筆附上定位誤差，讓同仁分得出「定位不準」還是「真的不在店裡」
      var acc = (e.status === 'rejected_out_of_range' && e.low_accuracy && isFinite(e.accuracy_m))
        ? '（誤差±' + Math.round(e.accuracy_m) + 'm）' : '';
      right.textContent = statusLabel(e.status) + acc;
      li.appendChild(left);
      li.appendChild(right);
      todayListEl.appendChild(li);
    });
  }

  // 今日時數摘要（whoami 的 today_hours：{reference, approved, working_since}）。
  // 有 working_since→仍在上班中，只列已完成時段的時數；無→今日已無進行中的班段。
  // 只顯示參考時數，不顯示核定（Eason 2026-07-13 定案：核定改由值班主管在 manager.html
  // 輸入實際時段核定，員工打卡頁一律顯示「參考」；後端仍回 approved 供月表等其他用途）。
  function renderTodayHours(h) {
    if (!h) { todayHoursEl.textContent = ''; return; }
    if (h.working_since) {
      todayHoursEl.textContent = '上班中（' + h.working_since + ' 起）・已完成時段參考 ' + h.reference + ' 小時';
    } else {
      todayHoursEl.textContent = '今日參考時數：' + h.reference + ' 小時';
    }
  }

  // fetch 逾時（毫秒）。⚠ 沒有這道防線時，網路卡住的請求會無限期不 settle：
  // 打卡畫面永遠停在「送出打卡中…」，且 setBusy(true) 讓兩顆按鈕一直停用、
  // 同仁連重打都不行（2026-08-03 林宸妤實際遇到，上班卡整筆遺失）。
  // Apps Script 正常回應約 2–3 秒，20 秒已非常寬鬆。
  var API_TIMEOUT_MS = 20000;

  function apiPost(payload, urlOverride) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timedOut = false;
    var timer = setTimeout(function () {
      timedOut = true;
      if (ctrl) ctrl.abort();
    }, API_TIMEOUT_MS);

    var opts = {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload),
    };
    if (ctrl) opts.signal = ctrl.signal;

    // 三種失敗要用不同措辭，因為「這次到底送出去了沒」不一樣，講錯會害同仁重複打卡或漏打：
    //   ① 逾時（我們主動 abort）：連線是通的，請求可能已抵達伺服器 → 講「可能沒送出，請看今日紀錄」
    //   ② fetch 本身失敗（沒網路／Wi-Fi 斷線／連線被拒，TypeError）：根本沒送出去 → 可放心叫她直接重打
    //      （原樣顯示會是英文 "Failed to fetch"，同仁看不懂，2026-08-03 Eason 要求改中文）
    //   ③ 回應不是 JSON（伺服器有回應但內容異常）：請求已經到了伺服器 → 不可說「沒送出」
    return fetch(urlOverride || API_URL, opts)
      .then(
        function (res) {
          return res.json().catch(function () {
            throw new Error('伺服器回應異常，這次打卡可能已經送出。請看下方今日紀錄確認，不要急著重打。');
          });
        },
        function (err) {
          if (timedOut) throw new Error('連線逾時，這次打卡可能沒有送出。請看下方今日紀錄確認，若沒有出現請再打一次。');
          throw new Error('連不上伺服器，這次打卡沒有送出。請確認手機網路連線後再打一次。');
        }
      )
      .then(function (v) { clearTimeout(timer); return v; }, function (e) { clearTimeout(timer); throw e; });
  }

  // ---- 最近 40 天回查（my_recent）：點按鈕才 fetch，可展開/收合 ----
  var WEEKDAY_ZH = ['日', '一', '二', '三', '四', '五', '六'];
  var recentOpen = false;
  var recentLoaded = false; // 打卡成功後設回 false，下次展開重新抓

  function weekdayZh(dateStr) {
    return WEEKDAY_ZH[new Date(dateStr + 'T00:00:00Z').getUTCDay()];
  }

  // 班段文字照月表慣例：跨夜段加 (+1)、缺的一端顯示「？」（如 17:05–？）
  function segmentText(s) {
    return (s.in || '？') + '–' + (s.out || '？') + (s.cross ? '(+1)' : '');
  }

  // 本月／上月核定時數合計。後端 month_totals 是掃 approved 分頁全部日期算的（與月表同源），
  // 不是把 days 加總——40 天視窗蓋不滿整個上月。舊後端沒有這個欄位時整塊不顯示（優雅降級）。
  function renderMonthTotals(totals) {
    monthTotalsEl.innerHTML = '';
    if (!totals || !totals.current || !totals.previous) {
      monthTotalsEl.style.display = 'none';
      return;
    }
    [
      { label: '本月合計', t: totals.current },
      { label: '上月合計', t: totals.previous },
    ].forEach(function (item) {
      var box = document.createElement('div');
      box.className = 'mt-box';
      var label = document.createElement('span');
      label.className = 'mt-label';
      // 標題帶月份，避免月初剛換月時看不出算的是哪個月
      label.textContent = item.label + '（' + parseInt(item.t.ym.slice(5, 7), 10) + ' 月）';
      var value = document.createElement('span');
      value.className = 'mt-value';
      // 0 是合法值（該月尚無核定或全天請假），不可用 falsy 判斷
      var h = (item.t.hours === null || item.t.hours === undefined) ? 0 : item.t.hours;
      value.textContent = h + ' 小時';
      box.appendChild(label);
      box.appendChild(value);
      // 合計只加總「已核定」的日子；有上班但主管還沒核的天數在此揭露，
      // 免得同仁以為時數被少算（Eason 2026-07-31 指定）。0 天不顯示，避免雜訊。
      var pending = item.t.pending_days;
      if (pending) {
        var note = document.createElement('span');
        note.className = 'mt-pending';
        note.textContent = '尚有 ' + pending + ' 天待核定';
        box.appendChild(note);
      }
      monthTotalsEl.appendChild(box);
    });
    monthTotalsEl.style.display = 'flex';
  }

  function renderRecentDays(days) {
    recentListEl.innerHTML = '';
    if (!days || days.length === 0) {
      var empty = document.createElement('li');
      empty.textContent = '最近 40 天沒有打卡紀錄';
      recentListEl.appendChild(empty);
      return;
    }
    days.forEach(function (d) {
      var li = document.createElement('li');
      var info = document.createElement('span');
      info.className = 'day-info';
      var md = parseInt(d.date.slice(5, 7), 10) + '/' + parseInt(d.date.slice(8, 10), 10);
      var segs = d.segments.map(segmentText).join('、');
      info.textContent = md + '（' + weekdayZh(d.date) + '）　' + segs
        + (d.notes && d.notes.length ? '　' + d.notes.join('、') : '');
      var hours = document.createElement('span');
      hours.className = 'day-hours';
      // 只顯示核定（Eason 2026-07-15 定案）：核定＝值班主管輸入之實際時段總長，是計薪依據；
      // 後端 my_recent 的 d.approved 已改讀 approved 分頁（不再是 15 分鐘取整的舊定義）。
      // 無核定紀錄→「待核定」（月表同款措辭）；忘刷卡當天不再空白——主管核定後就看得到時數，
      // 那正是最需要看核定的情境。d.approved 為 0 是合法值（全天請假），故不可用 falsy 判斷。
      var hoursText = (d.approved === null || d.approved === undefined)
        ? '待核定'
        : '核定 ' + d.approved;
      hours.textContent = hoursText;
      // 遲到/早退等核定狀態（後端 approved_status＝主管核定當下算的 status_text，與月表狀態欄同源）。
      // 「正常」不顯示以免雜訊；有異常才追加一段醒目小字（Eason 2026-07-15 要求顯示遲到分鐘）。
      if (d.approved_status && d.approved_status !== '正常') {
        var mark = document.createElement('span');
        mark.className = 'day-mark';
        mark.textContent = d.approved_status;
        hours.appendChild(mark);
      }
      li.appendChild(info);
      li.appendChild(hours);
      recentListEl.appendChild(li);
    });
  }

  function init() {
    // 先決定身分模式：網址帶 ?k= → 舊模式（一律不碰 LIFF）；否則嘗試 LIFF 登入。
    // 兩種模式都失敗（沒有 k，也不在 LIFF 環境內／LIFF 登入失敗）才顯示錯誤畫面。
    initIdentity().then(function (identityOk) {
      if (!identityOk) {
        showError('請用店長給你的專屬打卡連結開啟。');
        return;
      }
      // LIFF 模式沒有薪資 handler（my_payslip 仍走 key），先把分頁藏起來避免點了報錯
      if (useLiff) {
        var payTab = document.querySelector('.tabbar .tab[data-view="pay"]');
        if (payTab) payTab.style.display = 'none';
      }
      if (API_URL.indexOf('PASTE_') === 0) {
        showError('系統尚未設定完成，請聯絡老闆。');
        return;
      }
      // 立即顯示外殼與打卡按鈕，不等 whoami（後端約 2.5 秒）——打卡本身只需身分＋GPS＋裝置碼，
      // 伺服器端有重複打卡防護當安全網，員工一開 app 就能按。姓名／今日紀錄／按鈕灰階待 whoami 補上。
      loadingCard.style.display = 'none';
      mainCard.style.display = 'block';
      btnGroup.style.display = 'flex';
      empNameEl.textContent = '載入中…';
      apiPost(mkPayload('whoami'))
        .then(function (res) {
          if (!res.ok) {
            if (useLiff) {
              // LIFF 帳號驗證成功但還沒綁員工 → 讓她自己輸入啟用碼綁定，不是錯誤
              if (res.error === 'not_bound') {
                showBindScreen();
                return;
              }
              // 其餘 LIFF 錯誤碼（invalid_id_token / no_roster / 未預期）用 LIFF 專屬措辭，
              // 不能沿用下面那句「打卡連結」的講法——舊模式（?k=）維持完全不變。
              showError(liffWhoamiErrorMsg(res.error));
              return;
            }
            showError('找不到這個打卡連結對應的員工，請確認連結是否正確。');
            return;
          }
          empNameEl.textContent = res.name;
          if (res.device_state === 'unbound') {
            deviceHintEl.textContent = '本裝置尚未綁定，首次打卡將自動綁定。';
          } else if (res.device_state === 'mismatch') {
            deviceHintEl.textContent = '這不是你平常綁定的裝置，打卡將送出待核准。';
          } else {
            deviceHintEl.textContent = '';
          }
          renderTodayEvents(res.today_events);
          renderTodayHours(res.today_hours);
          updateButtonStates(res.last_counted);
        })
        .catch(function () {
          showError('連線失敗，請檢查網路連線後重新整理頁面。');
        });
      // 定位預熱：頁面一確定身分就開始抓，打卡當下才不用整個等定位（見 getPosition 捷徑）。
      startWarmUp();
    });
  }

  function setBusy(busy) {
    btnIn.disabled = busy;
    btnOut.disabled = busy;
    if (!busy) refreshOutLock();   // ⚠ 不可無條件解鎖，否則打完卡冷卻立刻失效
  }

  function showStatus(cls, text) {
    statusBox.className = 'status-box show ' + cls;
    statusBox.textContent = text;
  }

  // 本機測試限定：?loc=store 模擬人在店內、?loc=away 模擬人在外地，正式環境不生效
  var FAKE_LOCATIONS = {
    store: { latitude: 24.7840945, longitude: 121.0157448 }, // 2026-07-13 校正座標，與後端 CONFIG 對齊
    away: { latitude: 25.0330, longitude: 121.5654 },
    // 模擬「人在店裡但定位飄到店北約 80 公尺」（王禹婕 2026-08-11 的情況），測誤差折抵用
    drift: { latitude: 24.7848135, longitude: 121.0157448 },
  };

  // ── 定位取得：不合理就自動再抓（2026-08-21 加）─────────────────────
  // 實際資料顯示打卡失敗有兩種，不是一種：
  //   ① 定位不準——誤差很大、位置飄掉（王禹婕 8/11，飄到店北 77m，連按 12 次都被擋）
  //   ② 定位過時——誤差看起來很小，但位置是舊的（8/20 14:45 同一分鐘先報 1201m 再報 6.6m）
  // 所以第一次讀到「誤差大」或「時間戳很舊」時不要急著送出，改用 watchPosition 等更好的一次。
  // ⚠ 只有「這次看起來會被擋」才會多等；誤差小又新鮮就立刻送出，正常打卡完全不會變慢
  //   （2026-08-19～20 實際 33 筆誤差最大 30.9m，全部低於門檻，一筆都不會被拖到）。
  // ⚠ 這裡刻意不做「距離門市多遠」的判斷——門市座標若再複製一份到前端，日後校正座標
  //   要同步的地方就從三處變四處（見 2026-07-13 座標沒同步白測一輪的教訓）。改看「時間戳」，
  //   過時的定位一樣抓得到，而且不需要知道門市在哪。
  var GOOD_ACCURACY_M = 40;    // 誤差在這個範圍內就相信這次定位（實測正常值 5～31m）
  var STALE_FIX_MS = 30000;    // 定位時間戳超過這麼久＝手機給了舊的位置，要重抓
  var RETRY_BUDGET_MS = 8000;  // 第一次不理想時，最多再花這麼久等更好的
  var GEO_OPTS = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };

  function fixLooksGood(pos) {
    var acc = pos && pos.coords && isFinite(pos.coords.accuracy) ? pos.coords.accuracy : Infinity;
    var age = pos && pos.timestamp ? (Date.now() - pos.timestamp) : 0;
    return acc <= GOOD_ACCURACY_M && age <= STALE_FIX_MS;
  }
  function fixAccuracy(pos) {
    return pos && pos.coords && isFinite(pos.coords.accuracy) ? pos.coords.accuracy : Infinity;
  }
  function geoError(err) {
    if (err && err.code === err.PERMISSION_DENIED) {
      return new Error('定位權限被拒絕，請到手機設定開啟此頁面的定位權限後再試一次。');
    }
    if (err && err.code === err.TIMEOUT) return new Error('定位逾時，請確認 GPS 訊號後重試。');
    return new Error('定位失敗，請重試。');
  }

  // ── 定位預熱：頁面一載入就先抓，打卡當下能直接用（2026-08 加）───────────
  // 階段 0 實測：冷啟動最慢 7,140ms，門檻 8,000ms，同仁按下打卡要等 7 秒會以為當掉。
  // 只是把 watchPosition 收到的最新定位存起來，不改動既有 getPosition() 的判斷邏輯。
  var warmFix = null;     // 預熱拿到的最新定位
  var warmWatchId = null;

  // ⚠ 2026-08-27 審查 Important 2：預熱絕對不能自己觸發瀏覽器的定位詢問。
  //   watchPosition 在「還沒授權」時呼叫就是在問——不管有沒有人按過打卡按鈕。
  //   這會把詢問時機從「按上班打卡」搬到「一開頁面」，同仁看不懂為什麼跳出來，
  //   而且瀏覽器會把拒絕記在這個 origin 上：反射性按下「不允許」的人，之後永遠打不了卡。
  //   所以先用 Permissions API 確認「已經是 granted」才預熱；任何不確定（denied/prompt/
  //   瀏覽器不支援 Permissions API）一律不預熱，回退成原本「按下打卡才問」的行為。
  function startWarmUp() {
    if (!navigator.geolocation) return;
    if (!navigator.permissions || !navigator.permissions.query) return;  // 不確定就不預熱
    navigator.permissions.query({ name: 'geolocation' }).then(function (st) {
      if (st.state !== 'granted') return;   // 只在已授權時預熱，絕不由預熱觸發詢問
      warmWatchId = navigator.geolocation.watchPosition(function (pos) {
        warmFix = pos;                                  // 持續更新，永遠是最新的
      }, function () {}, GEO_OPTS);
      // 3 分鐘後停掉，避免頁面開著一直耗電
      setTimeout(function () {
        if (warmWatchId !== null) { navigator.geolocation.clearWatch(warmWatchId); warmWatchId = null; }
      }, 180000);
    }).catch(function () {});
  }

  /**
   * 取定位。onRetry 會在「決定要多等一下」時被呼叫一次，讓畫面能說明為什麼變慢
   * （不講的話同仁會以為當掉了——參考 2026-08-03「卡在送出打卡中」那次）。
   */
  function getPosition(onRetry) {
    if (isLocalHost && FAKE_LOCATIONS[qs('loc')]) {
      // localhost 限定：acc=120 可模擬「定位誤差 120 公尺」，用來測提示與重抓
      var fakeAcc = parseFloat(qs('acc'));
      var c = FAKE_LOCATIONS[qs('loc')];
      return Promise.resolve({
        timestamp: Date.now(),
        coords: isFinite(fakeAcc) ? { latitude: c.latitude, longitude: c.longitude, accuracy: fakeAcc } : c,
      });
    }
    // 預熱捷徑：startWarmUp() 背景抓的定位如果已經夠好，直接用，不用再等一輪 getCurrentPosition。
    // 沿用既有的 fixLooksGood，所以過時判斷與精準度門檻的行為完全一致。
    if (warmFix && fixLooksGood(warmFix)) { return Promise.resolve(warmFix); }
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) {
        reject(new Error('此裝置不支援定位功能，無法打卡。'));
        return;
      }
      var best = null, watchId = null, timer = null, settled = false;

      function finish() {
        if (settled) return;
        settled = true;
        if (timer) clearTimeout(timer);
        if (watchId !== null && navigator.geolocation.clearWatch) navigator.geolocation.clearWatch(watchId);
        if (best) resolve(best); else reject(new Error('定位失敗，請重試。'));
      }
      // ⚠ 不能只比誤差大小（2026-08-21 實測抓到的 bug）：過時的定位常常誤差很小，
      //   例如 8/20 那筆報 1201m 的誤差只有 ±13.1，比後來新鮮的 ±16.8 還「好」，
      //   只比誤差就會留下錯的那筆，等於白重抓。先分「合格／不合格」，同級才比誤差。
      function fixRank(pos) { return fixLooksGood(pos) ? 0 : 1; }
      function offer(pos) {
        if (!best) { best = pos; return; }
        var rp = fixRank(pos), rb = fixRank(best);
        if (rp !== rb) { if (rp < rb) best = pos; return; }   // 合格的一律贏過不合格的
        if (fixAccuracy(pos) < fixAccuracy(best)) best = pos; // 同級才比誤差
      }

      navigator.geolocation.getCurrentPosition(function (pos) {
        offer(pos);
        if (fixLooksGood(pos)) { finish(); return; }        // 正常情況：立刻送出，不多等
        if (typeof onRetry === 'function') { try { onRetry(); } catch (e) {} }
        if (!navigator.geolocation.watchPosition) { finish(); return; }
        timer = setTimeout(finish, RETRY_BUDGET_MS);        // 硬上限，絕不無限等
        watchId = navigator.geolocation.watchPosition(function (p2) {
          offer(p2);
          if (fixLooksGood(p2)) finish();                   // 一拿到好的就馬上走，不等滿
        }, function () { /* 重抓失敗就用手上最好的，交給上面的 timer 收尾 */ }, GEO_OPTS);
      }, function (err) {
        if (settled) return;
        settled = true;
        reject(geoError(err));
      }, GEO_OPTS);
    });
  }


  function doClock(type) {
    if (type === 'out' && outLockUntil > Date.now()) {
      var s2 = Math.ceil((outLockUntil - Date.now()) / 60000);
      showStatus('status-warn', '⚠ 剛打完上班卡，' + s2 + ' 分鐘後才能打下班卡（避免手滑誤打）。真的要下班請告知主管補登。');
      return;
    }
    if (blockedType === type) {
      // 前端先擋下的重複打卡（不打 API）。這句保留「已打過上班/下班卡」的具體說法：
      // 它不是「打卡沒成功」，而是「這一筆本來就不該打」，用統一失敗句會叫她再打一次、更混亂。
      showStatus('status-warn', duplicateMessage(blockedType));
      return;
    }
    setBusy(true);
    showStatus('status-loading', '定位中…');
    // 第一次定位不理想時會多等幾秒，這裡把原因寫出來，不要讓同仁以為畫面當掉
    getPosition(function () { showStatus('status-loading', '定位中…（訊號較弱，再抓一次）'); })
      .then(function (pos) {
        showStatus('status-loading', '送出打卡中…');
        return apiPost(mkPayload('clock', {
          type: type,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          // 手機回報的定位誤差（公尺）。用來分辨「定位準、人真的在店外」與「定位根本不準」。
          // 舊後端收到多的欄位會直接忽略，不影響打卡，所以前後端部署順序不互卡。
          accuracy: pos.coords && isFinite(pos.coords.accuracy) ? pos.coords.accuracy : null,
        }));
      })
      .then(function (res) {
        // 只分「成功」與「沒成功」兩種（Eason 2026-08-03 指定：不管什麼狀況，
        // 只要沒打卡成功就跳同一句提醒，不要讓同仁去讀一堆不同的錯誤訊息）。
        if (res.ok && res.status === 'ok') {
          showStatus('status-ok', '✓ 打卡成功　' + (res.ts || '').substring(11, 16));
        } else if (useLiff && res && res.error === 'invalid_id_token') {
          // 2026-08-27 審查 Important 5：LIFF 的 ID token 過期時套用統一失敗句沒有意義——
          // 「看今日紀錄再打一次」解決不了過期的 token，會一直重複失敗。LIFF webview
          // 常常開很久不關，直接重新走一次登入才是真的能恢復的路。
          showStatus('status-warn', 'LINE 身分驗證已過期，正在重新登入…');
          liff.login();
          return;
        } else {
          showStatus('status-warn', CLOCK_FAIL_MSG + accuracyHint(res));
        }
        apiPost(mkPayload('whoami')).then(function (r) {
          if (r.ok) {
            renderTodayEvents(r.today_events);
            renderTodayHours(r.today_hours);
            updateButtonStates(r.last_counted);
          }
        });
        // 剛打了卡，快取的最近 40 天已過期：展開中就立刻重抓，收合中則下次展開再抓
        recentLoaded = false;
        if (recentOpen) {
          apiPost(mkPayload('my_recent')).then(function (r2) {
            if (r2.ok) {
              recentLoaded = true;
              renderRecentDays(r2.days);
            }
          });
        }
      })
      .catch(function () {
        // 定位失敗、沒網路、逾時、伺服器異常 → 一律同一句（不再區分原因）
        showStatus('status-warn', CLOCK_FAIL_MSG);
        // 主動刷新今日紀錄：逾時/異常不代表沒進伺服器，讓她當場看得到到底有沒有成功，
        // 不用自己猜。這通失敗就算了（本來就是連線有問題），不再另外報錯蓋掉上面的訊息。
        apiPost(mkPayload('whoami')).then(function (r) {
          if (r.ok) {
            renderTodayEvents(r.today_events);
            renderTodayHours(r.today_hours);
            updateButtonStates(r.last_counted);
          }
        }).catch(function () {});
      })
      .then(function () { setBusy(false); }, function () { setBusy(false); });
  }

  btnIn.addEventListener('click', function () { doClock('in'); });
  btnOut.addEventListener('click', function () { doClock('out'); });

  // ══════ 我的薪資分頁（與打卡共用同一把 key，同仁不必另外領連結）══════
  var tabbar = document.getElementById('tabbar');
  var clockView = document.getElementById('clockView');
  var payView = document.getElementById('payView');
  var payYm = document.getElementById('payYm');
  var paySlipEl = document.getElementById('paySlip');
  var payLoadedYm = null;
  var HOURY = ['overtime','shortfall_hours','personal_leave','sick_leave','menstrual_leave','disaster_leave','hourly_wage'];
  function payNf(v) { return Math.round(v).toLocaleString('zh-TW'); }
  function payR2(v) { return Math.round(v * 100) / 100; }

  // 預設月份＝當月（台北時區）
  (function () {
    try {
      var parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit' }).formatToParts(new Date());
      var y = parts.find(function (p) { return p.type === 'year'; }).value;
      var mo = parts.find(function (p) { return p.type === 'month'; }).value;
      if (y && mo) payYm.value = y + '-' + mo;
    } catch (e) {}
  })();

  function payState(ic, t, d) {
    return '<div class="card"><div class="pstate"><div class="ic">' + ic + '</div><div class="t">' + t + '</div><div>' + d + '</div></div></div>';
  }
  function payLine(x) {
    var sub = '';
    if (x.qty != null) {
      sub = ' <span style="color:#8a817a;font-size:12px">' + payR2(x.qty) + (HOURY.indexOf(x.item_key) !== -1 ? 'H' : '') + (x.rate ? ' × ' + payNf(x.rate) : '') + '</span>';
    }
    return '<tr><td>' + x.item_label + sub + '</td><td>' + payNf(x.amount) + '</td></tr>';
  }
  /* 假別額度卡片：規則與主管看到的同源（後端 payMyLeaveQuota → payLeaveUsage），
     所以同仁自己算的跟店長講的一定一致。沒資料就整張不畫（舊後端沒這欄位時優雅降級）。 */
  function payLeaveCard(list) {
    if (!list || !list.length) return '';
    var rows = list.map(function (q) {
      var cap = q.cap_days, used = q.used_days || 0;
      var pct = cap ? Math.min(100, Math.round(used / cap * 100)) : 0;
      var bar = (cap != null && q.basis !== 'event')
        ? '<span class="bar"><i class="' + (pct >= 80 ? 'hi' : '') + '" style="width:' + pct + '%"></i></span>' : '';
      // 單位統一用時數（Eason 2026-08-27）：同仁在打卡頁看到的核定時數也是 H，一致才不會誤讀
      var usedTxt = used
        ? '<b>' + payR2(q.used_h) + '</b> H'
        : '<span style="color:#8a817a">未請過</span>';
      var remTxt;
      if (cap == null) remTxt = '<span style="color:#8a817a">無上限</span>';
      else if (q.basis === 'event') remTxt = '<span style="color:#8a817a">每次上限<span class="u">' + payR2(q.cap_h) + ' H</span></span>';
      else if (q.remain_h < 0) remTxt = '<span class="out">超出 ' + payR2(-q.remain_h) + ' H</span>';
      else if (q.blocked) remTxt = '<span class="out">已用完</span>';
      else remTxt = '<b>' + payR2(q.remain_h) + '</b> H<span class="u">/ 上限 ' + payR2(q.cap_h) + ' H</span>';
      return '<tr><td>' + q.name + bar + '</td>'
        + '<td class="r">' + usedTxt + '</td><td class="r">' + remTxt + '</td></tr>';
    }).join('');
    return '<div class="card lq"><h4>我的假別額度</h4>'
      + '<div class="sub">今年（曆年）已請與剩餘。數字來自店長在系統登記的請假紀錄，'
      + '如果和你記得的不一樣，請找店長確認。</div>'
      + '<table><tbody>' + rows + '</tbody></table></div>';
  }
  function renderPay(j) {
    if (!j || !j.ok) { paySlipEl.innerHTML = payState('🔒', '無法驗證身分', '這個連結可能已失效，請找店長重新取得。'); return; }
    var lq = payLeaveCard(j.leave_quota);
    if (!j.ready) {
      var an = j.annual ? '<div class="card"><div class="hrs"><div><span>剩餘特休</span><b>' + j.annual.left_h + '</b> H</div></div></div>' : '';
      paySlipEl.innerHTML = an + lq + payState('🕒', j.message || '尚未結算', '薪資結算後這裡就會顯示明細。'); return; }
    var r = j.result || j.run, earn = r.earn || [], ded = r.ded || [];
    paySlipEl.innerHTML = '<div class="card">'
      + '<div class="who"><div><b>' + j.name + '</b><div class="m">' + String(j.ym).replace('-', '年') + '月薪資</div></div>'
      + '<div class="m">發薪日<br>每月 ' + j.payday + ' 日</div></div>'
      + '<div class="hrs">'
      + '<div><span>核定總時數</span><b>' + r.total_hours + '</b> H</div>'
      + (r.support_hours ? '<div><span>支援時數</span><b>' + payR2(r.support_hours) + '</b> H</div>' : '')
      + (r.base_hours != null ? '<div><span>基本工時</span><b>' + r.base_hours + '</b> H</div>' : '')
      + (r.ot_paid_hours ? '<div><span>計薪加班</span><b>' + payR2(r.ot_paid_hours) + '</b> H</div>' : '')
      + (j.annual ? '<div><span>剩餘特休</span><b>' + j.annual.left_h + '</b> H</div>' : '')
      + '</div>'
      + '<h4>加項</h4><table>' + earn.map(payLine).join('') + '<tr class="sum"><td>應收合計</td><td>' + payNf(r.gross) + '</td></tr></table>'
      + '<h4 class="d">扣項</h4><table>' + (ded.length ? ded.map(payLine).join('') : '<tr><td colspan="2" style="color:#8a817a">無</td></tr>') + '<tr class="sum"><td>應付合計</td><td>' + payNf(r.deduction) + '</td></tr></table>'
      + '<div class="net"><div>實付金額</div><div class="v">NT$ ' + payNf(r.net) + '</div></div>'
      + '<div class="pfoot">如有疑問請於發薪日起 7 日內向店長反映。<br>本頁只顯示你本人的資料。</div>'
      + '</div>' + lq;
  }
  function loadPayslip(force) {
    if (!key) { paySlipEl.innerHTML = payState('🔒', '連結不完整', '請用店長給你的專屬連結開啟。'); return; }
    if (!force && payLoadedYm === payYm.value) return;
    paySlipEl.innerHTML = '<div class="card center-msg" style="color:#8a817a">載入中…</div>';
    var reqYm = payYm.value;
    apiPost({ action: 'my_payslip', key: key, ym: reqYm }, PAYROLL_API).then(function (j) {
      payLoadedYm = reqYm;
      renderPay(j);
    }, function () {
      paySlipEl.innerHTML = payState('📡', '連不上伺服器', '請確認網路後重新整理。');
    });
  }
  if (tabbar) {
    tabbar.addEventListener('click', function (e) {
      var b = e.target && e.target.closest ? e.target.closest('.tab') : null;
      if (!b) return;
      var tabs = tabbar.querySelectorAll('.tab');
      for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('on');
      b.classList.add('on');
      var isPay = b.getAttribute('data-view') === 'pay';
      clockView.style.display = isPay ? 'none' : '';
      payView.style.display = isPay ? '' : 'none';
      if (isPay) loadPayslip(false);
    });
    payYm.addEventListener('change', function () { loadPayslip(true); });
  }

  init();
})();
</script>
<script>
/* 天氣動態背景 ─ 依門市當下天氣切換背景情境（晴／多雲／陰／霧／雨／雷雨／雪，各分日夜）。
   全部效果都在同一張 canvas 上即時算：雨有景深與動態模糊、玻璃上會積水滑落、地面濺起水花，
   晴天是真的光束＋鏡頭光暈，雲霧用碎形雜訊算出來的雲層，雷雨會打出有分岔的閃電。
   天氣來源：Open-Meteo（免金鑰、免註冊），每 20 分鐘更新一次，結果存 localStorage，
   下次開頁先用上次的天氣立刻上場再背景更新，不會卡住打卡畫面。
   抓不到天氣就完全不套用情境，畫面維持原本的火焰背景。
   預覽用：?weather=clear|cloudy|overcast|fog|drizzle|rain|heavy-rain|storm|snow（可再加 &night=1 看夜間版）。 */
(function () {
  'use strict';

  var STORE_LAT = 24.7840945;      // 光復店；與 apps-script/Code.gs 的 CONFIG.STORE_LAT/STORE_LNG 同一組座標
  var STORE_LNG = 121.0157448;
  var WX_API = 'https://api.open-meteo.com/v1/forecast?latitude=' + STORE_LAT +
               '&longitude=' + STORE_LNG + '&current=weather_code,is_day&timezone=Asia%2FTaipei';
  var CACHE_KEY = 'mala_wx_cache';
  var CACHE_MS = 20 * 60 * 1000;   // 天氣多久重抓一次
  var TIMEOUT_MS = 6000;           // 抓天氣的逾時：訊號差時不要一直等

  var body = document.body;
  var canvas = document.getElementById('wxCanvas');
  var flashEl = document.querySelector('.wxFlash');
  var ctx = (canvas && canvas.getContext) ? canvas.getContext('2d') : null;
  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var reduceMotion = !!(mq && mq.matches);

  var SCENE_CLASSES = ['wx-on', 'wx-day', 'wx-night', 'wx-sun', 'wx-moon',
                       'wx-clear', 'wx-cloudy', 'wx-overcast', 'wx-fog', 'wx-rain', 'wx-storm', 'wx-snow'];

  function qsParam(n) {
    try { return new URLSearchParams(window.location.search).get(n); } catch (e) { return null; }
  }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* WMO 天氣代碼 → 背景情境。power 是雨勢強弱（影響雨量、水滴與水花） */
  function sceneOf(code, isDay) {
    var c = Number(code);
    var s = { kind: 'cloudy', power: 1, day: !!isDay };
    if (c === 0) s.kind = 'clear';
    else if (c === 1 || c === 2) s.kind = 'cloudy';
    else if (c === 3) s.kind = 'overcast';
    else if (c === 45 || c === 48) s.kind = 'fog';
    else if (c >= 51 && c <= 57) { s.kind = 'rain'; s.power = 0.5; }            // 毛毛雨
    else if (c === 61 || c === 66 || c === 80) { s.kind = 'rain'; s.power = 0.85; }
    else if (c === 63 || c === 81) { s.kind = 'rain'; s.power = 1.2; }
    else if (c === 65 || c === 67 || c === 82) { s.kind = 'rain'; s.power = 1.7; }  // 大雨
    else if ((c >= 71 && c <= 77) || c === 85 || c === 86) s.kind = 'snow';
    else if (c >= 95) { s.kind = 'storm'; s.power = 1.7; }                      // 雷雨
    return s;
  }

  var scene = null;

  function apply(next) {
    if (scene && scene.kind === next.kind && scene.day === next.day && scene.power === next.power) return;
    scene = next;
    for (var i = 0; i < SCENE_CLASSES.length; i++) body.classList.remove(SCENE_CLASSES[i]);
    body.classList.add('wx-' + scene.kind);
    body.classList.add(scene.day ? 'wx-day' : 'wx-night');
    if (scene.kind === 'clear' || scene.kind === 'cloudy') {
      body.classList.add(scene.day ? 'wx-sun' : 'wx-moon');
    }
    body.classList.add('wx-on');
    rebuild();
    scheduleBolt();
  }

  /* ══ 畫面素材：雲的碎形雜訊貼圖、雨滴的動態模糊筆刷 ══════════════
     兩者都只在第一次用到時算一次，之後每一格只是貼上去，手機才跑得動。 */

  var cloudTile = null, dropSprite = null, glassSprites = null, trailSprite = null, spriteDpr = 0;

  function fbm(size, lattice, octaves) {   // 可左右無縫接續的碎形雜訊
    var out = new Float32Array(size * size), amp = 1, total = 0, o, i;
    for (o = 0; o < octaves; o++) {
      var L = lattice << o, grid = new Float32Array(L * L);
      for (i = 0; i < L * L; i++) grid[i] = Math.random();
      var cell = size / L;
      for (var y = 0; y < size; y++) {
        var gy = y / cell, iy = Math.floor(gy), fy = gy - iy;
        fy = fy * fy * (3 - 2 * fy);
        var y0 = ((iy % L) + L) % L, y1 = (y0 + 1) % L;
        for (var x = 0; x < size; x++) {
          var gx = x / cell, ix = Math.floor(gx), fx = gx - ix;
          fx = fx * fx * (3 - 2 * fx);
          var x0 = ((ix % L) + L) % L, x1 = (x0 + 1) % L;
          var top = grid[y0 * L + x0] + (grid[y0 * L + x1] - grid[y0 * L + x0]) * fx;
          var bot = grid[y1 * L + x0] + (grid[y1 * L + x1] - grid[y1 * L + x0]) * fx;
          out[y * size + x] += amp * (top + (bot - top) * fy);
        }
      }
      total += amp; amp *= 0.5;
    }
    for (i = 0; i < out.length; i++) out[i] /= total;
    return out;
  }

  function buildCloudTile() {
    var S = 256, n = fbm(S, 3, 4);
    var c = document.createElement('canvas');
    c.width = S; c.height = S;
    var g = c.getContext('2d'), img = g.createImageData(S, S), d = img.data;
    for (var y = 0; y < S; y++) {
      var edge = Math.sin(Math.PI * (y / (S - 1)));      // 上下淡出，貼上去才沒有硬邊
      edge = edge * edge;
      for (var x = 0; x < S; x++) {
        var v = (n[y * S + x] - 0.42) * 2.5;             // 拉對比：讓雲有厚薄，不是一片均勻的霧
        v = v < 0 ? 0 : (v > 1 ? 1 : v);
        var p = (y * S + x) * 4;
        d[p] = 255; d[p + 1] = 253; d[p + 2] = 250;
        d[p + 3] = Math.round(255 * v * edge);
      }
    }
    g.putImageData(img, 0, 0);
    cloudTile = c;
  }

  function buildDropSprite() {   // 一顆帶動態模糊的雨滴：中間亮、頭尾散開
    var W = 16, H = 96;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');
    var lin = g.createLinearGradient(0, 0, 0, H);
    lin.addColorStop(0, 'rgba(255,255,255,0)');
    lin.addColorStop(0.35, 'rgba(226,240,255,.55)');
    lin.addColorStop(0.82, 'rgba(255,255,255,.95)');
    lin.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lin;
    g.fillRect(0, 0, W, H);
    var mask = g.createLinearGradient(0, 0, W, 0);                    // 橫向羽化，邊緣不銳利
    mask.addColorStop(0, 'rgba(0,0,0,0)');
    mask.addColorStop(0.5, 'rgba(0,0,0,1)');
    mask.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalCompositeOperation = 'destination-in';
    g.fillStyle = mask;
    g.fillRect(0, 0, W, H);
    dropSprite = c;
  }

  function buildGlassSprites() {
    glassSprites = [];
    for (var i = 0; i < 6; i++) {
      var r = 1.1 + i * 0.92, S = Math.ceil((r * 1.06 + 2) * 2);
      var c = document.createElement('canvas');
      c.width = Math.ceil(S * DPR); c.height = Math.ceil(S * DPR);
      var g = c.getContext('2d');
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      var x = S / 2, y = S / 2;
      // 水珠把背景折射掉：上緣偏暗、下緣把光聚起來，再加一點高光
      var rim = g.createRadialGradient(x, y - r * 0.34, r * 0.1, x, y, r * 1.02);
      rim.addColorStop(0, 'rgba(20,7,3,.30)');
      rim.addColorStop(0.75, 'rgba(20,7,3,.16)');
      rim.addColorStop(1, 'rgba(20,7,3,0)');
      g.fillStyle = rim;
      g.beginPath(); g.ellipse(x, y, r, r * 1.06, 0, 0, Math.PI * 2); g.fill();
      var lens = g.createRadialGradient(x + r * 0.2, y + r * 0.42, 0, x + r * 0.1, y + r * 0.3, r * 0.86);
      lens.addColorStop(0, 'rgba(255,238,214,.34)');
      lens.addColorStop(0.6, 'rgba(255,224,188,.13)');
      lens.addColorStop(1, 'rgba(255,220,180,0)');
      g.fillStyle = lens;
      g.beginPath(); g.ellipse(x, y, r, r * 1.06, 0, 0, Math.PI * 2); g.fill();
      if (r > 1.6) {                                   // 大顆的才看得到高光
        g.fillStyle = 'rgba(255,252,246,.5)';
        g.beginPath(); g.ellipse(x - r * 0.32, y - r * 0.42, r * 0.2, r * 0.15, -0.5, 0, Math.PI * 2); g.fill();
      }
      glassSprites.push({ c: c, r: r, s: S });
    }
    var t = document.createElement('canvas');          // 滑下去留的水痕
    t.width = 8; t.height = 64;
    var tg = t.getContext('2d');
    var lin = tg.createLinearGradient(0, 0, 0, 64);
    lin.addColorStop(0, 'rgba(236,246,255,0)');
    lin.addColorStop(1, 'rgba(236,246,255,.85)');
    tg.fillStyle = lin; tg.fillRect(0, 0, 8, 64);
    trailSprite = t;
    spriteDpr = DPR;
  }

  /* ══ 粒子 ══════════════════════════════════════════════════════ */

  var W = 0, H = 0, lastW = 0, lastH = 0, DPR = 1;
  var drops = [], glass = [], splashes = [], flakes = [], stars = [];
  var wind = 0, rainOn = false, snowOn = false, starsOn = false;
  var sunOn = false, moonOn = false, cloudA = 0, cloudLow = false;
  var rafId = 0, lastTs = 0, clock = 0;

  // ── 效能保護：連續掉幀就自動降解析度（2026-08-19 加）───────────────
  // 背景吃滿 3 倍解析度後，繪製量是原本 1.75 倍時的約 2.9 倍，舊手機可能撐不住。
  // 這裡量真實幀距，持續過慢就把上限降一階並重建畫布。**只降不升**——會升就會在
  // 邊界來回跳，畫面一直重建反而更糟。
  var DPR_CAP_STEPS = [3, 2.25, 1.75];
  var dprStep = 0;
  var PERF_SLOW_MS = 22;     // 單幀超過這個毫秒數算慢（60fps 的預算是 16.7ms）
  var PERF_RATIO = 0.6;      // 觀察視窗內超過六成是慢幀就降一階
  var PERF_WINDOW = 90;      // 觀察視窗幀數（約 1.5 秒）
  var perfGrace = 60;        // 剛啟動／剛降階後先不判斷，避開暖機抖動
  var perfSlow = 0, perfSeen = 0;

  function sizeCanvas() {
    // 2026-08-19 Eason 指定改用滿解析度：原本夾在 1.75 是為了省算力，但 iPhone 是 3 倍螢幕，
    // 等於背景只用 58% 的解析度再被放大，雨絲、雲層邊緣、光束都糊掉。
    // 上限走 DPR_CAP_STEPS 階梯（見 watchPerf）：預設吃滿到 3，掉幀就自動降階。
    // 保留 3 的上限：部分 Android 回報 4 以上，再往上畫素量暴增而肉眼幾乎無感。
    // 粒子數量是依 CSS 尺寸（sqrt(W*H)/26）算的、與 DPR 無關，這裡只增加繪製成本。
    DPR = Math.min(window.devicePixelRatio || 1, DPR_CAP_STEPS[dprStep]);
    W = window.innerWidth || document.documentElement.clientWidth;
    H = window.innerHeight || document.documentElement.clientHeight;
    lastW = W; lastH = H;
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function newDrop(seeded) {
    var z = Math.random();                      // 景深：0 最遠（細、慢、淡）1 最近（粗、快、亮）
    return {
      x: rand(-0.25 * W, 1.1 * W),
      y: seeded ? rand(-H, H) : rand(-H * 0.4, -20),
      z: z,
      len: (26 + z * 74) * (0.6 + scene.power * 0.5),
      sp: (760 + z * 900) * (0.65 + scene.power * 0.45)
    };
  }
  function newGlass(seeded) {
    var i = Math.random() < 0.62 ? (Math.random() < 0.6 ? 0 : 1) : (2 + Math.floor(Math.random() * 4));
    return {
      x: rand(0, W), y: seeded ? rand(0, H) : rand(-40, 0), i: i, r: glassSprites[i].r,
      life: rand(4, 16),                        // 停多久才開始滑
      vy: 0, trail: 0
    };
  }
  function newFlake(seeded) {
    var z = Math.random();
    return { x: rand(0, W), y: seeded ? rand(0, H) : rand(-H * 0.3, -8),
             r: 1 + z * 3, sp: 24 + z * 56, ph: rand(0, Math.PI * 2), sw: rand(10, 30), z: z };
  }
  function newStar() {
    return { x: rand(0, W), y: rand(0, H * 0.68), r: rand(0.5, 1.7),
             ph: rand(0, Math.PI * 2), sp: rand(0.5, 1.8), a: rand(0.32, 1) };
  }

  function rebuild() {
    if (!ctx || !scene) return;
    stopLoop();
    sizeCanvas();
    var k = scene.kind, span = Math.sqrt(W * H) / 26, i, n;

    rainOn = (k === 'rain' || k === 'storm');
    snowOn = (k === 'snow');
    starsOn = (k === 'clear' && !scene.day);
    sunOn = (k === 'clear' || k === 'cloudy') && scene.day;
    moonOn = (k === 'clear' || k === 'cloudy') && !scene.day;
    cloudLow = (k === 'fog');
    cloudA = k === 'cloudy' ? 0.34 : k === 'overcast' ? 0.6 : k === 'fog' ? 0.72
           : k === 'rain' ? 0.5 : k === 'storm' ? 0.6 : k === 'snow' ? 0.5 : 0;
    if (!scene.day) cloudA *= 0.5;

    drops = []; glass = []; splashes = []; flakes = []; stars = [];
    wind = k === 'storm' ? 0.38 : 0.17;

    if (rainOn) {
      if (!dropSprite) buildDropSprite();
      if (!glassSprites || spriteDpr !== DPR) buildGlassSprites();
      n = clamp(Math.round(span * 2.6 * scene.power), 24, 170);
      for (i = 0; i < n; i++) drops.push(newDrop(true));
      n = clamp(Math.round(span * 0.85 * scene.power), 10, 54);      // 玻璃上的積水
      for (i = 0; i < n; i++) glass.push(newGlass(true));
    }
    if (snowOn) {
      n = clamp(Math.round(span * 1.9), 20, 120);
      for (i = 0; i < n; i++) flakes.push(newFlake(true));
    }
    if (starsOn) {
      n = clamp(Math.round(span * 1.6), 24, 110);
      for (i = 0; i < n; i++) stars.push(newStar());
    }
    if (cloudA > 0 && !cloudTile) buildCloudTile();

    if (reduceMotion) { drawFrame(0); return; }   // 關閉動畫時只畫靜止的一幀
    startLoop();
  }

  /* ══ 每一格的運算 ══════════════════════════════════════════════ */

  function step(dt) {
    var i, p;
    clock += dt;
    for (i = 0; i < drops.length; i++) {
      p = drops[i];
      p.y += p.sp * dt;
      p.x += p.sp * wind * dt;
      if (p.y > H + 40 || p.x > W + 60) {
        if (p.z > 0.62 && splashes.length < 16) {                    // 近處的雨才看得到落地水花
          splashes.push({ x: p.x, y: rand(H * 0.965, H * 1.005), t: 0, life: rand(0.3, 0.52), r: rand(5, 12) * p.z });
        }
        drops[i] = newDrop(false);
      }
    }
    for (i = splashes.length - 1; i >= 0; i--) {
      splashes[i].t += dt;
      if (splashes[i].t > splashes[i].life) splashes.splice(i, 1);
    }
    for (i = 0; i < glass.length; i++) {
      p = glass[i];
      p.life -= dt;
      if (p.life <= 0) {                                             // 積到夠重就開始往下滑
        p.vy += (30 + p.r * 26) * dt;
        p.y += p.vy * dt;
        p.x += Math.sin(p.y * 0.03) * 8 * dt;
        p.trail = 1;
      }
      if (p.y - p.r > H) glass[i] = newGlass(false);
    }
    for (i = 0; i < flakes.length; i++) {
      p = flakes[i];
      p.ph += dt;
      p.y += p.sp * dt;
      p.x += Math.sin(p.ph) * p.sw * dt;
      if (p.y > H + 8) { p.y = rand(-H * 0.25, -8); p.x = rand(0, W); }
      if (p.x < -14) p.x = W + 10; else if (p.x > W + 14) p.x = -10;
    }
    for (i = 0; i < stars.length; i++) stars[i].ph += stars[i].sp * dt;
    if (bolt) {
      bolt.t += dt;
      if (bolt.t > bolt.life) bolt = null;
    }
  }

  /* ── 雲層：兩層碎形雲以不同速度飄，霧就壓低放大 ── */
  function drawClouds() {
    if (!(cloudA > 0) || !cloudTile) return;
    var bands = cloudLow
      ? [{ y: 0.10, h: 0.52, w: 2.1, sp: 5.5, a: 1 }, { y: 0.46, h: 0.6, w: 2.7, sp: 3.4, a: 0.92 }]
      : [{ y: -0.06, h: 0.42, w: 1.7, sp: 9, a: 1 }, { y: 0.16, h: 0.5, w: 2.4, sp: 5.5, a: 0.6 }];
    for (var b = 0; b < bands.length; b++) {
      var s = bands[b], tw = W * s.w, th = H * s.h, ty = H * s.y;
      var x = -((clock * s.sp) % tw);
      ctx.globalAlpha = cloudA * s.a;
      for (var k = 0; k < 2 + Math.ceil(W / tw); k++) ctx.drawImage(cloudTile, x + k * tw, ty, tw, th);
    }
    ctx.globalAlpha = 1;
  }

  /* ── 太陽：光暈＋放射光束＋鏡頭光斑（相機對著太陽拍的樣子）──
     整組先烘成一張離屏貼圖，每格只做「貼圖＋緩慢旋轉的光束層」，省掉幾十個漸層 */
  var sunLayer = null, rayLayer = null, sunKey = '';

  function buildSun() {
    var sx = W * 0.84, sy = H * 0.045, R = Math.max(W, H) * 1.15;
    var mk = function () {
      var c = document.createElement('canvas');
      c.width = Math.ceil(W * DPR); c.height = Math.ceil(H * DPR);
      var g = c.getContext('2d');
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      return { c: c, g: g };
    };
    var base = mk(), g = base.g, i;

    var halo = g.createRadialGradient(sx, sy, 0, sx, sy, R * 0.42);
    halo.addColorStop(0, 'rgba(255,248,214,.8)');
    halo.addColorStop(0.06, 'rgba(255,231,150,.46)');
    halo.addColorStop(0.26, 'rgba(255,193,86,.16)');
    halo.addColorStop(1, 'rgba(255,170,40,0)');
    g.fillStyle = halo;
    g.fillRect(0, 0, W, H);

    var core = g.createRadialGradient(sx, sy, 0, sx, sy, W * 0.15);
    core.addColorStop(0, 'rgba(255,255,250,.95)');
    core.addColorStop(0.5, 'rgba(255,240,180,.35)');
    core.addColorStop(1, 'rgba(255,220,120,0)');
    g.fillStyle = core;
    g.fillRect(0, 0, W, H);

    var cx = W / 2, cy = H / 2, dx = cx - sx, dy = cy - sy;   // 鏡頭光斑：沿著太陽→畫面中心那條線
    var ghosts = [[0.42, 0.055, 'rgba(255,196,120,.10)'], [0.72, 0.03, 'rgba(180,220,255,.10)'],
                  [1.15, 0.075, 'rgba(255,170,90,.075)'], [1.5, 0.042, 'rgba(210,190,255,.07)']];
    for (i = 0; i < ghosts.length; i++) {
      var gx = sx + dx * ghosts[i][0], gy = sy + dy * ghosts[i][0], gr = W * ghosts[i][1];
      var gg = g.createRadialGradient(gx, gy, gr * 0.2, gx, gy, gr);
      gg.addColorStop(0, ghosts[i][2]);
      gg.addColorStop(0.72, ghosts[i][2]);
      gg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gg;
      g.beginPath(); g.arc(gx, gy, gr, 0, Math.PI * 2); g.fill();
    }
    var streak = g.createLinearGradient(sx - W * 0.6, sy, sx + W * 0.6, sy);   // 橫向散光
    streak.addColorStop(0, 'rgba(255,214,150,0)');
    streak.addColorStop(0.5, 'rgba(255,236,196,.16)');
    streak.addColorStop(1, 'rgba(255,214,150,0)');
    g.fillStyle = streak;
    g.fillRect(0, sy - 5, W, 10);
    sunLayer = base.c;

    var rays = mk(); g = rays.g;
    for (i = 0; i < 15; i++) {                           // 光束：寬窄不一
      var a0 = i * 2.39996;                              // 黃金角，分佈才不會規律得像圖案
      var wdt = 0.012 + 0.035 * (0.5 + 0.5 * Math.sin(i * 12.9898));
      var amp = 0.05 + 0.06 * (0.5 + 0.5 * Math.sin(i * 7.13));
      var lg = g.createLinearGradient(sx, sy, sx + Math.cos(a0) * R, sy + Math.sin(a0) * R);
      lg.addColorStop(0, 'rgba(255,240,190,' + amp.toFixed(3) + ')');
      lg.addColorStop(0.42, 'rgba(255,214,120,' + (amp * 0.42).toFixed(3) + ')');
      lg.addColorStop(1, 'rgba(255,190,80,0)');
      g.fillStyle = lg;
      g.beginPath();
      g.moveTo(sx, sy);
      g.lineTo(sx + Math.cos(a0 - wdt) * R, sy + Math.sin(a0 - wdt) * R);
      g.lineTo(sx + Math.cos(a0 + wdt) * R, sy + Math.sin(a0 + wdt) * R);
      g.closePath();
      g.fill();
    }
    rayLayer = rays.c;
    sunKey = W + 'x' + H + '@' + DPR;
  }

  function drawSun() {
    if (sunKey !== W + 'x' + H + '@' + DPR) buildSun();
    var sx = W * 0.84, sy = H * 0.045;
    var pulse = 0.92 + 0.08 * Math.sin(clock * 0.7);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = pulse;
    ctx.drawImage(sunLayer, 0, 0, W, H);
    ctx.save();                                          // 光束整層繞太陽緩慢轉
    ctx.translate(sx, sy);
    ctx.rotate(clock * 0.016);
    ctx.translate(-sx, -sy);
    ctx.globalAlpha = 0.75 + 0.25 * Math.sin(clock * 0.45);
    ctx.drawImage(rayLayer, 0, 0, W, H);
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ── 月亮：月面有紋理、外圈有大氣散射的光暈 ── */
  function drawMoon() {
    var mx = W * 0.8, my = H * 0.1, r = Math.min(W, H) * 0.062;
    ctx.globalCompositeOperation = 'lighter';
    var halo = ctx.createRadialGradient(mx, my, r * 0.6, mx, my, r * 7);
    halo.addColorStop(0, 'rgba(196,216,255,.3)');
    halo.addColorStop(0.35, 'rgba(150,180,255,.08)');
    halo.addColorStop(1, 'rgba(120,160,255,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);
    var disc = ctx.createRadialGradient(mx - r * 0.28, my - r * 0.3, r * 0.1, mx, my, r);
    disc.addColorStop(0, 'rgba(255,255,252,1)');
    disc.addColorStop(0.62, 'rgba(238,242,252,.96)');
    disc.addColorStop(0.94, 'rgba(206,218,240,.9)');
    disc.addColorStop(1, 'rgba(190,206,235,0)');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-atop';       // 月海：幾塊淡淡的陰影
    var maria = [[-0.26, -0.20, 0.62], [0.22, 0.26, 0.52], [0.10, -0.36, 0.38]];
    for (var i = 0; i < maria.length; i++) {
      var ox = mx + r * maria[i][0], oy = my + r * maria[i][1], orr = r * maria[i][2];
      var mg = ctx.createRadialGradient(ox, oy, 0, ox, oy, orr);
      mg.addColorStop(0, 'rgba(126,138,164,.15)');
      mg.addColorStop(0.55, 'rgba(126,138,164,.09)');
      mg.addColorStop(1, 'rgba(126,138,164,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(ox, oy, orr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawStars() {
    for (var i = 0; i < stars.length; i++) {
      var p = stars[i], a = p.a * (0.45 + 0.55 * Math.sin(p.ph));
      ctx.fillStyle = 'rgba(255,252,238,' + (a > 0 ? a.toFixed(3) : 0) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ── 雨：整片一起旋轉，貼上帶動態模糊的雨滴筆刷 ── */
  function drawRain() {
    var ang = Math.atan(wind);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.rotate(ang);
    var cos = Math.cos(ang), sin = Math.sin(ang);
    for (var i = 0; i < drops.length; i++) {
      var p = drops[i];
      var rx = p.x * cos + p.y * sin, ry = -p.x * sin + p.y * cos;   // 轉到旋轉後的座標
      var w = (0.7 + p.z * 1.9);
      ctx.globalAlpha = 0.12 + p.z * 0.5;
      ctx.drawImage(dropSprite, rx - w / 2, ry, w, p.len);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawSplashes() {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < splashes.length; i++) {
      var s = splashes[i], k = s.t / s.life, r = s.r * (0.3 + k * 1.9);
      ctx.strokeStyle = 'rgba(226,240,255,' + ((1 - k) * 0.24).toFixed(3) + ')';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, r, r * 0.32, 0, 0, Math.PI * 2);
      ctx.stroke();
      if (k < 0.5) {                                   // 濺起來的小水珠
        var up = Math.sin(k * Math.PI) * s.r * 1.5;
        ctx.fillStyle = 'rgba(240,248,255,' + ((0.5 - k) * 0.7).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(s.x - r * 0.5, s.y - up, 1.1, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(s.x + r * 0.55, s.y - up * 0.8, 1, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ── 玻璃上的積水：暗邊＋亮底＋高光，滑下去會留水痕 ── */
  function drawGlass() {
    for (var i = 0; i < glass.length; i++) {
      var p = glass[i], r = p.r, sp = glassSprites[p.i];
      if (p.trail && p.vy > 6) {                       // 水痕
        var tl = Math.min(p.vy * 0.5, 90);
        ctx.globalAlpha = 0.16;
        ctx.drawImage(trailSprite, p.x - r * 0.42, p.y - tl, r * 0.84, tl);
        ctx.globalAlpha = 1;
      }
      ctx.drawImage(sp.c, p.x - sp.s / 2, p.y - sp.s / 2, sp.s, sp.s);
    }
  }
  function drawSnow() {
    for (var i = 0; i < flakes.length; i++) {
      var p = flakes[i];
      ctx.fillStyle = 'rgba(255,255,255,' + (0.32 + p.z * 0.55).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ── 閃電：中點位移法畫出有分岔的電光 ── */
  var bolt = null, boltTimer = 0;

  function makeBolt() {
    var x = rand(W * 0.15, W * 0.85), pts = [{ x: x, y: -20 }], segs = [];
    var y = -20, endY = rand(H * 0.5, H * 0.92);
    while (y < endY) {
      y += rand(H * 0.05, H * 0.13);
      x += rand(-W * 0.09, W * 0.09);
      pts.push({ x: x, y: y });
      if (Math.random() < 0.32 && pts.length > 2) {                  // 分岔
        var bx = x, by = y, br = [{ x: bx, y: by }];
        for (var k = 0; k < 3; k++) {
          bx += rand(-W * 0.11, W * 0.11); by += rand(H * 0.03, H * 0.08);
          br.push({ x: bx, y: by });
        }
        segs.push(br);
      }
    }
    return { main: pts, branches: segs, t: 0, life: 0.5 };
  }

  function drawBolt() {
    if (!bolt) return;
    var k = bolt.t / bolt.life;
    var flick = (k < 0.12 || (k > 0.2 && k < 0.28) || (k > 0.4 && k < 0.46)) ? 1 : 0.22;
    var a = (1 - k) * flick;
    if (a <= 0.01) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    function stroke(pts, w, color) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
    }
    stroke(bolt.main, 13, 'rgba(150,190,255,' + (a * 0.16).toFixed(3) + ')');   // 外層輝光
    stroke(bolt.main, 5, 'rgba(206,226,255,' + (a * 0.5).toFixed(3) + ')');
    stroke(bolt.main, 1.7, 'rgba(255,255,255,' + a.toFixed(3) + ')');           // 核心
    for (var i = 0; i < bolt.branches.length; i++) {
      stroke(bolt.branches[i], 4, 'rgba(180,208,255,' + (a * 0.22).toFixed(3) + ')');
      stroke(bolt.branches[i], 1.1, 'rgba(255,255,255,' + (a * 0.7).toFixed(3) + ')');
    }
    ctx.restore();
  }

  function scheduleBolt() {
    clearTimeout(boltTimer);
    bolt = null;
    if (reduceMotion || !scene || scene.kind !== 'storm') return;
    boltTimer = setTimeout(function () {
      if (!document.hidden) {
        bolt = makeBolt();
        if (flashEl) {
          flashEl.classList.remove('on');
          void flashEl.offsetWidth;             // 重觸發動畫
          flashEl.classList.add('on');
        }
      }
      scheduleBolt();
    }, 5000 + Math.random() * 11000);
  }

  function drawFrame() {
    ctx.clearRect(0, 0, W, H);
    if (cloudA > 0) drawClouds();
    if (starsOn) drawStars();
    if (sunOn) drawSun();
    if (moonOn) drawMoon();
    if (snowOn) drawSnow();
    if (rainOn) { drawRain(); drawSplashes(); drawGlass(); }
    if (bolt) drawBolt();
  }

  /**
   * 收一幀的實際耗時，必要時降一階解析度。
   * ⚠ 收的是「未經 clamp 的原始幀距」：frame() 裡的 dt 被夾在 0.05 秒，拿那個判斷會低估卡頓。
   * ⚠ 分頁切回前景的第一幀會有很大的間隔，用 500ms 上限濾掉，不然一切回來就誤判成卡。
   */
  function watchPerf(rawMs) {
    if (dprStep >= DPR_CAP_STEPS.length - 1) return;   // 已經降到底，不再量
    if (perfGrace > 0) { perfGrace--; return; }
    if (rawMs > 500) { perfSlow = 0; perfSeen = 0; return; }
    perfSeen++;
    if (rawMs > PERF_SLOW_MS) perfSlow++;
    if (perfSeen < PERF_WINDOW) return;
    if (perfSlow / perfSeen > PERF_RATIO) {
      dprStep++;
      perfGrace = 60;
      perfSlow = 0; perfSeen = 0;
      rebuild();     // 重新 sizeCanvas（吃到新的上限）並重建相依於 DPR 的精靈圖，最後自己 startLoop
      return;
    }
    perfSlow = 0; perfSeen = 0;
  }

  function frame(ts) {
    rafId = window.requestAnimationFrame(frame);
    var rawMs = lastTs ? (ts - lastTs) : 16;    // 給 watchPerf 用：未經下面 clamp 的原始幀距
    var dt = lastTs ? (ts - lastTs) / 1000 : 0.016;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05;                   // 切回分頁時不要一次跳太多
    step(dt);
    drawFrame();
    watchPerf(rawMs);
  }
  function startLoop() {
    if (rafId || reduceMotion || !scene || !window.requestAnimationFrame) return;
    lastTs = 0;
    rafId = window.requestAnimationFrame(frame);
  }
  function stopLoop() {
    if (rafId) { window.cancelAnimationFrame(rafId); rafId = 0; }
  }

  /* ══ 取天氣 ══════════════════════════════════════════════════ */
  function readCache() {
    try {
      var j = JSON.parse(window.localStorage.getItem(CACHE_KEY) || 'null');
      if (j && isFinite(j.code) && isFinite(j.t)) return j;
    } catch (e) {}
    return null;
  }
  function writeCache(code, day) {
    try {
      window.localStorage.setItem(CACHE_KEY, JSON.stringify({ code: code, day: day ? 1 : 0, t: Date.now() }));
    } catch (e) {}
  }
  function fetchWeather() {
    var ctl = window.AbortController ? new window.AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, TIMEOUT_MS);
    return fetch(WX_API, ctl ? { signal: ctl.signal } : undefined).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (j) {
      clearTimeout(timer);
      var cur = j && j.current;
      var code = cur ? Number(cur.weather_code) : NaN;
      if (!isFinite(code)) throw new Error('bad payload');
      var day = (cur.is_day === 1 || cur.is_day === true);
      writeCache(code, day);
      return { code: code, day: day };
    }, function (err) { clearTimeout(timer); throw err; });
  }
  function refresh() {
    if (forced || !window.fetch || !window.Promise) return;   // 預覽模式與不支援的瀏覽器都不抓
    var c = readCache();
    if (c && Date.now() - c.t < CACHE_MS) return;             // 還新鮮就不重抓
    fetchWeather().then(function (w) { apply(sceneOf(w.code, w.day)); }, function () {});
  }

  function forcedScene(nameRaw) {
    var codes = { clear: 0, sunny: 0, cloudy: 2, overcast: 3, fog: 45, drizzle: 53,
                  rain: 63, 'heavy-rain': 65, storm: 95, thunder: 95, snow: 73 };
    var name = String(nameRaw).toLowerCase();
    var code = Object.prototype.hasOwnProperty.call(codes, name) ? codes[name] : 0;
    return sceneOf(code, qsParam('night') !== '1');
  }

  window.addEventListener('resize', function () {
    if (!scene || !ctx) return;
    // 手機捲動時網址列伸縮也會觸發 resize，高度小幅變化只調畫布、不重排粒子
    if (Math.abs(window.innerWidth - lastW) < 2 && Math.abs(window.innerHeight - lastH) < 140) {
      sizeCanvas();
    } else {
      rebuild();
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopLoop(); clearTimeout(boltTimer); return; }
    startLoop();
    scheduleBolt();
    refresh();                                   // 回到前景順便看看天氣變了沒
  });
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function (e) { reduceMotion = e.matches; rebuild(); scheduleBolt(); });
  }

  var forced = qsParam('weather');
  if (forced) {
    apply(forcedScene(forced));
  } else if (window.fetch && window.Promise) {
    var cached = readCache();
    if (cached) apply(sceneOf(cached.code, cached.day === 1));  // 先套上次的天氣，畫面不用等連線
    refresh();
    setInterval(refresh, CACHE_MS);                              // 頁面長時間開著也會跟著換
  }
})();
</script>
</body>
</html>
